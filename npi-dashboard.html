      .history-row {
        display: grid;
        grid-template-columns: 1fr 1.4fr auto;
        gap: 14px;
        align-items: center;
        padding: 10px 12px;
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-sm);
        font-size: 14.5px;
      }
      @media (max-width: 760px) {
        .history-row {
          grid-template-columns: 1fr;
          gap: 4px;
        }
      }
      .history-row-field {
        font-family: var(--font-display);
        font-weight: 600;
        color: var(--steel-200);
      }
      .history-row-change {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 14px;
        overflow: hidden;
      }
      .history-old {
        color: var(--steel-500);
        text-decoration: line-through;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-new {
        color: var(--g);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-arrow {
        color: var(--steel-600);
        flex: 0 0 auto;
      }
      .history-row-meta {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-500);
        white-space: nowrap;
      }

      .topic-section {
        position: relative;
        text-align: left;
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-md);
        padding: 0;
        font-family: inherit;
        color: inherit;
        display: flex;
        flex-direction: column;
        transition:
          border-color 0.18s var(--ease),
          background 0.18s var(--ease),
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
        animation: fadeRise 0.4s var(--ease) both;
      }
      .topic-section-grid .topic-section:nth-child(1) {
        animation-delay: 0.02s;
      }
      .topic-section-grid .topic-section:nth-child(2) {
        animation-delay: 0.06s;
      }
      .topic-section-grid .topic-section:nth-child(3) {
        animation-delay: 0.1s;
      }
      .topic-section-grid .topic-section:nth-child(4) {
        animation-delay: 0.14s;
      }
      .topic-section-grid .topic-section:nth-child(5) {
        animation-delay: 0.18s;
      }
      .topic-section-grid .topic-section:nth-child(6) {
        animation-delay: 0.22s;
      }
      .topic-section:hover {
        border-color: var(--amber-deep);
        background: var(--steel-700);
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
      }
      .topic-section-open {
        appearance: none;
        background: none;
        border: none;
        text-align: left;
        font-family: inherit;
        color: inherit;
        cursor: pointer;
        padding: 14px 16px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .topic-del-btn {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        color: var(--steel-600);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        border-radius: 4px;
        z-index: 2;
        transition:
          color 0.15s var(--ease),
          background 0.15s var(--ease);
      }
      .topic-del-btn:hover {
        color: var(--r);
        background: rgba(216, 51, 42, 0.12);
      }
      .topic-section-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .topic-section-name {
        font-weight: 600;
        font-size: 15px;
        color: var(--plate);
        line-height: 1.35;
        border-radius: 3px;
        padding: 1px 3px;
        margin: -1px -3px;
      }
      .topic-section-name[contenteditable="true"] {
        cursor: text;
        border-bottom: 1px dashed transparent;
      }
      .topic-section-name[contenteditable="true"]:hover {
        border-bottom: 1px dashed var(--steel-600);
        background: var(--steel-900);
      }
      .topic-section-name[contenteditable="true"]:focus {
        outline: 1px solid var(--amber);
        background: var(--steel-900);
      }
      .topic-section-name.locked {
        cursor: not-allowed;
        opacity: 0.92;
      }
      .topic-section-meta {
        display: flex;
        gap: 14px;
        font-family: var(--font-mono);
        font-size: 13.5px;
        color: var(--steel-300);
      }
      .topic-section-meta .lbl {
        display: block;
        color: var(--steel-600);
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 1px;
      }
      .topic-section-remarks {
        font-size: 13.5px;
        color: var(--steel-500);
        line-height: 1.4;
        border-top: 1px dashed var(--steel-700);
        padding-top: 8px;
      }
      .topic-section-link {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-600);
        padding-top: 8px;
        border-top: 1px dashed var(--steel-700);
        transition: color 0.15s var(--ease);
      }
      .topic-section:hover .topic-section-link {
        color: var(--amber);
      }
      .xlsx-ico {
        font-size: 14px;
      }

      .ryg-dot {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 700;
        flex: 0 0 auto;
      }
      .ryg-dot .d {
        width: 11px;
        height: 11px;
        border-radius: 50%;
      }
      .ryg-dot .d.Y {
        background: var(--y);
        box-shadow: 0 0 8px rgba(240, 162, 2, 0.55);
      }
      .ryg-dot .d.R {
        background: var(--r);
        box-shadow: 0 0 8px rgba(216, 51, 42, 0.55);
      }
      .ryg-dot .d.G {
        background: var(--g);
        box-shadow: 0 0 8px rgba(47, 168, 79, 0.55);
      }
      .ryg-dot .d.NA {
        background: var(--steel-600);
      }
      .ryg-select {
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        color: var(--steel-100);
        font-family: var(--font-mono);
        font-size: 13px;
        border-radius: 4px;
        padding: 3px 6px;
        cursor: pointer;
      }
      .editable-cell {
        cursor: text;
        border-bottom: 1px dashed transparent;
      }
      .editable-cell:hover {
        border-bottom: 1px dashed var(--steel-600);
      }
      .editable-cell:focus {
        outline: 1px solid var(--amber);
        border-radius: 3px;
      }

      /* NCR table */
      .ncr-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14.5px;
        margin-top: 4px;
      }
      .ncr-table th,
      .ncr-table td {
        text-align: center;
        padding: 8px 6px;
        border: 1px solid var(--steel-700);
        font-family: var(--font-mono);
      }
      .ncr-table th {
        background: var(--steel-800);
        color: var(--steel-300);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .ncr-table td:first-child,
      .ncr-table th:first-child {
        text-align: left;
        color: var(--steel-100);
        font-family: var(--font-body);
        font-weight: 600;
      }
      .ncr-table .g-col {
        background: rgba(47, 168, 79, 0.08);
        color: var(--g);
        font-weight: 700;
      }
      .ncr-table .y-col {
        background: rgba(240, 162, 2, 0.07);
        color: var(--y);
      }
      .ncr-table .r-col {
        background: rgba(216, 51, 42, 0.08);
        color: var(--r);
      }
      .ncr-table .total-col {
        background: var(--steel-800);
        color: var(--plate);
        font-weight: 700;
      }
      .ncr-table tfoot td {
        background: var(--steel-800);
        font-weight: 700;
        color: var(--plate);
      }
      .ncr-group-label {
        text-align: center;
        font-size: 14.5px;
        color: var(--steel-500);
        text-transform: uppercase;
        letter-spacing: 1px;
        padding-bottom: 4px;
      }

      /* Facility Tracker matrix */
      .facility-table-wrap {
        overflow-x: auto;
      }
      .facility-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        min-width: 1500px;
      }
      .facility-table th,
      .facility-table td {
        padding: 7px 9px;
        border: 1px solid var(--steel-800);
        white-space: nowrap;
      }
      .facility-table th {
        background: var(--steel-800);
        color: var(--steel-500);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-weight: 600;
        text-align: left;
        position: sticky;
        top: 0;
      }
      .facility-table td {
        color: var(--steel-300);
        font-family: var(--font-mono);
        font-size: 13.5px;
      }
      .facility-table td.ft-op {
        font-family: var(--font-body);
        color: var(--steel-100);
        font-weight: 600;
        white-space: normal;
        min-width: 170px;
      }
      .facility-table td.ft-cost {
        text-align: right;
      }
      .facility-table td.ft-lead {
        text-align: center;
      }
      .facility-table .ft-date-input {
        background: none;
        border: none;
        color: var(--steel-300);
        font-family: var(--font-mono);
        font-size: 13px;
        width: 108px;
        padding: 2px;
        border-radius: 3px;
      }
      .facility-table .ft-date-input:hover {
        background: var(--steel-800);
      }
      .facility-table .ft-date-input:focus {
        outline: 1px solid var(--amber);
        background: var(--steel-900);
      }
      .facility-table .ft-date-input:disabled {
        color: var(--steel-500);
        cursor: not-allowed;
      }
      .facility-table select.ft-select,
      .facility-table select.ft-status-select {
        background: var(--steel-900);
        color: var(--steel-300);
        border: 1px solid var(--steel-700);
        border-radius: 4px;
        font-family: inherit;
        font-size: 13px;
        padding: 3px 5px;
      }
      .facility-table select.ft-select:disabled,
      .facility-table select.ft-status-select:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .facility-status-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-weight: 700;
        font-family: var(--font-mono);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .facility-status-chip.closed {
        color: var(--g);
      }
      .facility-status-chip.open {
        color: var(--r);
      }
      .facility-status-chip.on-track {
        color: var(--y);
      }
      .facility-row-del {
        background: none;
        border: none;
        color: var(--steel-600);
        cursor: pointer;
        font-size: 14.5px;
        padding: 2px 5px;
        border-radius: 4px;
      }
      .facility-row-del:hover {
        color: var(--r);
        background: rgba(216, 51, 42, 0.12);
      }
      .facility-row-del.locked {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .facility-section-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .facility-table-summary {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-500);
        white-space: nowrap;
      }
      .ft-header-filter {
        background: var(--steel-900);
        color: var(--steel-300);
        border: 1px solid var(--steel-600);
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 3px 4px;
        cursor: pointer;
        max-width: 90px;
      }
      .ft-header-filter:hover {
        border-color: var(--amber-deep);
      }
      .facility-filter-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        background: rgba(224, 142, 0, 0.08);
        border: 1px solid var(--amber-deep);
        border-radius: 6px;
        padding: 7px 12px;
        margin-bottom: 10px;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--amber-deep);
      }
      .facility-filter-clear {
        margin-left: auto;
        background: none;
        border: none;
        color: var(--amber-deep);
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: underline;
        padding: 0;
      }
      .facility-filter-clear:hover {
        color: var(--r);
      }

      /* list panels: achievements / upcoming / support */
      .list-panel ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .list-panel li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 15px;
        color: var(--steel-100);
        line-height: 1.5;
      }
      .list-panel li .ico {
        flex: 0 0 auto;
        margin-top: 3px;
      }
      .list-panel.achievements li .ico {
        color: var(--g);
      }
      .list-panel.upcoming li .ico {
        color: var(--amber);
      }
      .list-panel.support li .ico {
        color: var(--r);
      }
      .list-panel li[contenteditable] {
        outline: none;
      }
      .list-panel li[contenteditable]:focus {
        background: var(--steel-800);
        border-radius: 4px;
        padding: 2px 6px;
        margin: -2px -6px;
      }

      .add-row-btn {
        margin-top: 12px;
        font-family: var(--font-mono);
        font-size: 13.5px;
        color: var(--steel-500);
        background: none;
        border: 1px dashed var(--steel-700);
        border-radius: 6px;
        padding: 7px 12px;
        cursor: pointer;
        width: 100%;
        transition:
          color 0.15s var(--ease),
          border-color 0.15s var(--ease),
          background 0.15s var(--ease);
      }
      .add-row-btn:hover {
        color: var(--amber-deep);
        border-color: var(--amber-deep);
        background: rgba(224, 142, 0, 0.06);
      }

      /* extra block (key dates etc) */
      .extra-panel ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .extra-panel li {
        padding: 9px 0;
        border-bottom: 1px dashed var(--steel-800);
        font-size: 14.5px;
        color: var(--steel-200);
        display: flex;
        gap: 8px;
      }
      .extra-panel li:last-child {
        border-bottom: none;
      }
      .extra-panel li::before {
        content: "▸";
        color: var(--amber);
        flex: 0 0 auto;
      }

      /* ---------- toast ---------- */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translate(-50%, 20px);
        background: var(--steel-800);
        border: 1px solid var(--amber-deep);
        color: var(--plate);
        font-family: var(--font-mono);
        font-size: 14.5px;
        padding: 11px 20px;
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s var(--ease),
          transform 0.25s var(--ease);
        z-index: 200;
        box-shadow:
          0 16px 36px -8px rgba(255, 255, 255, 0.25),
          0 4px 12px rgba(255, 255, 255, 0.1);
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }

      /* ---------- responsive helpers ---------- */
      @media (max-width: 680px) {
        .project-row {
          grid-template-columns: auto 1fr;
          row-gap: 8px;
        }
        .project-row-field {
          display: none;
        }
        .project-row-field.always-show {
          display: block;
          text-align: left;
        }
        .meta-strip {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* ============================================================
   CLASS SELECT — count strip + project matrix
   ============================================================ */
      .class-count-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        margin-left: auto;
      }
      .class-count-pill {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-md);
        padding: 8px 16px;
        cursor: pointer;
        min-width: 64px;
        transition:
          border-color 0.15s var(--ease),
          background 0.15s var(--ease),
          transform 0.15s var(--ease-spring);
      }
      .class-count-pill:hover {
        border-color: var(--amber);
        background: var(--steel-800);
        transform: translateY(-2px);
      }
      .class-count-pill.empty {
        opacity: 0.5;
      }
      .class-count-pill-num {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 22px;
        color: var(--amber);
        line-height: 1;
      }
      .class-count-pill-label {
        font-family: var(--font-mono);
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--steel-500);
        margin-top: 3px;
      }

      /* Project matrix */
      .project-matrix-panel {
        margin-bottom: 40px;
      }
      .project-matrix-wrap {
        overflow-x: auto;
      }
      .project-matrix-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 15px;
      }
      .project-matrix-table thead th {
        text-align: left;
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--steel-500);
        padding: 10px 14px;
        border-bottom: 2px solid var(--steel-700);
        background: var(--steel-900);
        white-space: nowrap;
      }
      .project-matrix-table thead th:first-child {
        border-radius: var(--radius-sm) 0 0 0;
      }
      .project-matrix-table thead th:last-child {
        border-radius: 0 var(--radius-sm) 0 0;
      }
      .project-matrix-row {
        cursor: pointer;
        transition: background 0.12s var(--ease);
        border-bottom: 1px solid var(--steel-800);
      }
      .project-matrix-row:hover {
        background: rgba(224, 142, 0, 0.05);
      }
      .project-matrix-row:hover .pmt-name .pmt-vehicle {
        color: var(--amber);
      }
      .project-matrix-row:last-child {
        border-bottom: none;
      }
      .project-matrix-table td {
        padding: 12px 14px;
        vertical-align: middle;
      }
      .pmt-name {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .pmt-vehicle {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 16px;
        color: var(--plate);
        transition: color 0.12s var(--ease);
        white-space: nowrap;
      }
      .pmt-code {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-500);
      }
      .pmt-class {
        white-space: nowrap;
      }
      .pmt-class-badge {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 13px;
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        color: var(--steel-300);
        border-radius: 4px;
        padding: 3px 9px;
      }
      .pmt-change {
        color: var(--steel-200);
        font-size: 14.5px;
        max-width: 360px;
      }
      .pmt-cpm {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--steel-400);
        white-space: nowrap;
      }
      .pmt-status {
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }
      .pmt-status-label {
        font-size: 14px;
        color: var(--steel-400);
        font-family: var(--font-mono);
      }

      /* editable date field with strikethrough history */
      .date-field-input {
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        color: var(--steel-100);
        font-family: var(--font-mono);
        font-size: 14.5px;
        border-radius: 5px;
        padding: 4px 8px;
        cursor: pointer;
        width: 100%;
        transition:
          border-color 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .date-field-input:focus {
        outline: none;
        border-color: var(--amber-deep);
        box-shadow: 0 0 0 3px rgba(224, 142, 0, 0.15);
      }
      .date-history {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 2px;
      }
      .date-history-item {
        font-family: var(--font-mono);
        font-size: 14.5px;
        color: var(--steel-500);
      }
      .date-history-item s {
        text-decoration: line-through;
        text-decoration-color: var(--safety-red);
        opacity: 0.7;
      }
      .date-field-cell .val {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .timeline-wrap::-webkit-scrollbar {
        height: 6px;
      }
      .timeline-wrap::-webkit-scrollbar-thumb {
        background: var(--steel-700);
        border-radius: 4px;
      }
      .timeline-wrap::-webkit-scrollbar-track {
        background: transparent;
      }

      /* focus visibility everywhere */
      a:focus-visible,
      button:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 2px;
      }

      /* ============================================================
   LANDING PAGE — NEW LAYOUT
   ============================================================ */

      /* TOP HALF: 3 charts in a row */
      .landing-charts-section {
        padding: 28px 0 12px;
      }
      .landing-charts-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        align-items: start;
      }
      @media (min-width: 760px) {
        .landing-charts-grid {
          grid-template-columns: 1fr 1fr 1fr;
        }
      }
      .landing-chart-panel {
        min-height: 0;
        height: 280px;
        display: flex;
        flex-direction: column;
      }
      .landing-chart-panel .chart-body {
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 8px 0;
        flex: 1;
        min-height: 0;
      }
      @media (min-width: 900px) {
        .landing-chart-panel .chart-body {
          flex-direction: row;
          align-items: center;
        }
      }
      .landing-chart-panel .chart-legend {
        max-height: 170px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .landing-chart-panel .chart-legend::-webkit-scrollbar {
        width: 5px;
      }
      .landing-chart-panel .chart-legend::-webkit-scrollbar-thumb {
        background: var(--steel-700);
        border-radius: 4px;
      }
      .landing-chart-panel .bar-chart-wrap {
        width: 100%;
        max-width: 320px;
        height: 100%;
      }
      .landing-chart-panel .bar-chart-list {
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 4px;
      }
      .landing-chart-panel .bar-chart-list::-webkit-scrollbar {
        height: 5px;
      }
      .landing-chart-panel .bar-chart-list::-webkit-scrollbar-thumb {
        background: var(--steel-700);
        border-radius: 4px;
      }

      /* Spend by Project — pie chart stays fixed at the top of the panel;
   the project list below it scrolls inside its own contained area so
   a long project list never grows the page or pushes other charts. */
      .spend-by-project-panel {
        min-height: 0;
      }
      .chart-body-scroll {
        flex-direction: column !important;
        align-items: center !important;
        gap: 10px !important;
      }
      .chart-body-scroll .pie-svg {
        flex: 0 0 auto;
      }
      .chart-legend-scroll {
        width: 100%;
        max-width: 100% !important;
        max-height: 150px;
        overflow-y: auto;
        gap: 6px !important;
        padding: 2px 6px 2px 0 !important;
      }
      .chart-legend-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .chart-legend-scroll::-webkit-scrollbar-thumb {
        background: var(--steel-700);
        border-radius: 4px;
      }
      .chart-legend-scroll li {
        font-size: 13.5px !important;
        gap: 7px !important;
      }
      .chart-legend-scroll .legend-label {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chart-legend-scroll .legend-value {
        font-size: 13px !important;
        flex: 0 0 auto;
      }
      .chart-legend-scroll .swatch {
        width: 9px;
        height: 9px;
      }

      /* BOTTOM HALF: Alerts + Support side by side */
      .landing-bottom-section {
        padding: 4px 0 40px;
      }
      .landing-bottom-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
      }
      @media (min-width: 760px) {
        .landing-bottom-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .landing-bottom-panel {
        display: flex;
        flex-direction: column;
        max-height: 420px;
        overflow: hidden;
      }

      /* Alerts list */
      .alerts-list {
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 4px 2px 4px 0;
      }
      .alerts-list::-webkit-scrollbar {
        width: 5px;
      }
      .alerts-list::-webkit-scrollbar-thumb {
        background: var(--steel-700);
        border-radius: 4px;
      }
      .alert-item {
        border-radius: 6px;
        padding: 11px 14px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        animation: fadeRise 0.3s var(--ease);
      }
      .alert-item-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .alert-badge {
        font-family: var(--font-mono);
        font-size: 14.5px;
        font-weight: 700;
        border-radius: 4px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      .alert-project {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-400);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .alert-date {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-600);
        white-space: nowrap;
      }
      .alert-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--plate);
      }
      .alert-detail {
        font-size: 14px;
        color: var(--steel-300);
        line-height: 1.5;
      }

      /* Support panel */
      .support-form-area {
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding-bottom: 12px;
        border-bottom: 1px dashed var(--steel-700);
      }
      .support-new-label {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--steel-500);
        margin-bottom: 2px;
      }
      .support-form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .support-input {
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        color: var(--steel-100);
        font-family: var(--font-body);
        font-size: 14.5px;
        border-radius: 6px;
        padding: 7px 10px;
        transition:
          border-color 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .support-input:focus {
        outline: none;
        border-color: var(--amber-deep);
        box-shadow: 0 0 0 3px rgba(224, 142, 0, 0.15);
      }
      .support-textarea {
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        color: var(--steel-100);
        font-family: var(--font-body);
        font-size: 14.5px;
        border-radius: 6px;
        padding: 8px 10px;
        resize: vertical;
        transition:
          border-color 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .support-textarea:focus {
        outline: none;
        border-color: var(--amber-deep);
        box-shadow: 0 0 0 3px rgba(224, 142, 0, 0.15);
      }
      .support-submit-btn {
        align-self: flex-end;
        padding: 7px 18px;
        font-size: 14px;
      }
      .support-divider {
        height: 10px;
      }
      .support-list {
        overflow-y: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 2px 0;
      }
      .support-list::-webkit-scrollbar {
        width: 5px;
      }
      .support-list::-webkit-scrollbar-thumb {
        background: var(--steel-700);
        border-radius: 4px;
      }
      .support-item {
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        border-radius: 6px;
        padding: 11px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        animation: fadeRise 0.3s var(--ease);
      }
      .support-item-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .support-type-chip {
        font-family: var(--font-mono);
        font-size: 14.5px;
        font-weight: 600;
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        color: var(--steel-300);
        border-radius: 4px;
        padding: 2px 8px;
        white-space: nowrap;
      }
      .support-project {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-400);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .support-status {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .support-date {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-600);
        white-space: nowrap;
      }
      .support-msg {
        font-size: 14.5px;
        color: var(--steel-200);
        line-height: 1.5;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }

      /* ============================================================
   MISSION CONTROL ENHANCEMENT LAYER
   Appended re-skin + motion system for the dark telemetry
   theme. Everything below intentionally overrides matching
   selectors above (same specificity, later in cascade).
   Sections:
     1. Atmosphere (aurora, grid, scrollbar, selection)
     2. Chrome (hazard beam, topbar, footer)
     3. Glass surface system + cursor spotlight
     4. Interactive cards (class / choice / project rows)
     5. Controls (buttons, inputs, selects)
     6. Data displays (tables, rings, gauges, gantt, pies)
     7. Overlays (modal, toast, login)
     8. Landing hero
     9. Motion & accessibility
   ============================================================ */

      /* ---------- 1. atmosphere ---------- */
      html {
        scrollbar-color: #22304d var(--steel-950);
      }
      body {
        background:
          radial-gradient(
            1200px 700px at 80% -10%,
            rgba(228, 48, 43, 0.055),
            transparent 60%
          ),
          radial-gradient(
            1000px 700px at -10% 30%,
            rgba(245, 166, 35, 0.05),
            transparent 60%
          ),
          var(--steel-950);
        overflow-x: hidden;
      }

      /* fine HUD grid, cool-blue on the void */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0) 1px, transparent 1px),
          linear-gradient(rgba(255, 255, 255, 0) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0) 1px, transparent 1px);
        background-size:
          160px 160px,
          160px 160px,
          32px 32px,
          32px 32px;
        background-position: -1px -1px;
        pointer-events: none;
        z-index: 0;
        mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.4) 600px,
          rgba(0, 0, 0, 0.22) 1400px,
          rgba(0, 0, 0, 0.1) 100%
        );
      }

      /* drifting aurora — two slow luminous fields breathing behind the grid */
      body::after {
        content: "";
        position: fixed;
        inset: -20%;
        background:
          radial-gradient(
            42% 34% at 24% 22%,
            rgba(228, 48, 43, 0.075),
            transparent 70%
          ),
          radial-gradient(
            38% 30% at 78% 68%,
            rgba(245, 166, 35, 0.065),
            transparent 70%
          ),
          radial-gradient(
            30% 26% at 62% 12%,
            rgba(255, 178, 36, 0.035),
            transparent 70%
          );
        pointer-events: none;
        z-index: 0;
        filter: blur(30px);
        animation: auroraDrift 26s ease-in-out infinite alternate;
      }
      @keyframes auroraDrift {
        0% {
          transform: translate3d(-2%, -1%, 0) rotate(0.001deg) scale(1);
        }
        50% {
          transform: translate3d(2.5%, 2%, 0) scale(1.06);
        }
        100% {
          transform: translate3d(-1.5%, 3%, 0) scale(1.02);
        }
      }

      /* content sits above atmosphere */
      .topbar,
      main,
      .app-footer,
      .hazard-strip {
        position: relative;
        z-index: 1;
      }
      .topbar {
        z-index: 50;
      }

      /* scrollbar + selection */
      ::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }
      ::-webkit-scrollbar-track {
        background: var(--steel-950);
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #22304d, #1a2540);
        border: 2px solid var(--steel-950);
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #31456e;
      }
      ::selection {
        background: rgba(228, 48, 43, 0.28);
        color: var(--steel-100);
      }

      /* ---------- 2. chrome ---------- */
      /* hazard strip → live telemetry beam */
      .hazard-strip {
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          var(--volt-deep) 12%,
          var(--volt) 28%,
          var(--amber) 50%,
          var(--volt) 72%,
          var(--volt-deep) 88%,
          transparent 100%
        );
        background-size: 220% 100%;
        animation: beamSweep 7s linear infinite;
        box-shadow:
          0 0 18px rgba(228, 48, 43, 0.35),
          0 1px 8px rgba(228, 48, 43, 0.25);
      }
      @keyframes beamSweep {
        from {
          background-position: 0% 0;
        }
        to {
          background-position: -220% 0;
        }
      }

      .topbar {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px) saturate(1.5);
        -webkit-backdrop-filter: blur(18px) saturate(1.5);
        border-bottom: 1px solid var(--steel-700);
        box-shadow: 0 10px 34px -18px rgba(0, 0, 0, 0.12);
      }
      .brand-mark {
        background: none;
        -webkit-background-clip: border-box;
        background-clip: border-box;
        color: var(--volt);
        -webkit-text-fill-color: var(--volt);
        text-shadow: none;
        animation: none;
      }
      @keyframes brandShimmer {
        0%,
        70% {
          background-position: 120% 0;
        }
        85% {
          background-position: -40% 0;
        }
        100% {
          background-position: -120% 0;
        }
      }
      .brand:hover .brand-mark {
        animation-duration: 2.4s;
      }
      .clock {
        color: var(--volt);
        text-shadow: 0 0 14px rgba(228, 48, 43, 0.45);
      }
      .header-line-btn,
      .header-back-btn,
      .header-ctrl-btn {
        border: 1px solid var(--line);
        background: rgba(19, 28, 48, 0.5);
        color: var(--steel-300);
        transition:
          color 0.18s var(--ease),
          border-color 0.18s var(--ease),
          background 0.18s var(--ease),
          box-shadow 0.18s var(--ease),
          transform 0.18s var(--ease-spring);
      }
      .header-line-btn:hover,
      .header-back-btn:hover,
      .header-ctrl-btn:hover {
        color: var(--steel-100);
        border-color: rgba(228, 48, 43, 0.5);
        background: rgba(228, 48, 43, 0.08);
        box-shadow:
          0 0 0 1px rgba(228, 48, 43, 0.15),
          0 6px 20px -8px rgba(228, 48, 43, 0.35);
        transform: translateY(-1px);
      }
      .header-line-btn:active,
      .header-back-btn:active,
      .header-ctrl-btn:active {
        transform: translateY(0) scale(0.97);
      }

      .app-footer {
        border-top: 1px solid var(--line);
        color: var(--steel-500);
        background: #ffffff;
      }

      /* ---------- 3. glass surface system + cursor spotlight ---------- */
      .panel,
      .chart-panel,
      .landing-chart-panel,
      .landing-bottom-panel,
      .compact-panel,
      .topic-detail-panel,
      .budget-panel,
      .list-panel,
      .history-panel,
      .project-matrix-panel,
      .spend-by-project-panel,
      .topic-tracker-panel,
      .extra-panel,
      .cp-class-block,
      .alert-item,
      .support-item,
      .topic-section {
        position: relative;
        background: var(--glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--line);
        box-shadow:
          var(--shadow-md),
          inset 0 1px 0 rgba(255, 255, 255, 0.045);
      }

      /* cursor-tracking specular spotlight — the signature interaction.
   JS feeds --mx / --my per card; visible only while hovered. */
      .panel::after,
      .chart-panel::after,
      .landing-chart-panel::after,
      .landing-bottom-panel::after,
      .compact-panel::after,
      .topic-detail-panel::after,
      .budget-panel::after,
      .list-panel::after,
      .history-panel::after,
      .project-matrix-panel::after,
      .spend-by-project-panel::after,
      .topic-tracker-panel::after,
      .extra-panel::after,
      .class-card::after,
      .choice-card::after,
      .project-row::after,
      .topic-section::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          340px circle at var(--mx, 50%) var(--my, 50%),
          rgba(228, 48, 43, 0.09),
          rgba(228, 48, 43, 0.03) 42%,
          transparent 68%
        );
        opacity: 0;
        transition: opacity 0.35s var(--ease);
        pointer-events: none;
        z-index: 0;
      }
      .panel:hover::after,
      .chart-panel:hover::after,
      .landing-chart-panel:hover::after,
      .landing-bottom-panel:hover::after,
      .compact-panel:hover::after,
      .topic-detail-panel:hover::after,
      .budget-panel:hover::after,
      .list-panel:hover::after,
      .history-panel:hover::after,
      .project-matrix-panel:hover::after,
      .spend-by-project-panel:hover::after,
      .topic-tracker-panel:hover::after,
      .extra-panel:hover::after,
      .class-card:hover::after,
      .choice-card:hover::after,
      .project-row:hover::after,
      .topic-section:hover::after {
        opacity: 1;
      }
      /* keep panel contents above the spotlight film */
      .panel > *,
      .chart-panel > *,
      .compact-panel > *,
      .budget-panel > *,
      .list-panel > *,
      .history-panel > *,
      .topic-section > *,
      .class-card > *,
      .choice-card > *,
      .project-row > * {
        position: relative;
        z-index: 1;
      }

      /* keep GPU load low on screens with many cards: skip blur on repeated items */
      .alert-item,
      .support-item,
      .topic-section,
      .cp-class-block {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .panel-head,
      .cp-class-head,
      .facility-section-head {
        border-bottom: 1px solid var(--line);
      }
      .panel-title,
      .section-title {
        color: var(--steel-100);
      }
      .section-hint {
        color: var(--steel-500);
      }

      /* ---------- 4. interactive cards ---------- */
      .class-card {
        position: relative;
        background: var(--glass);
        border: 1px solid var(--line);
        overflow: hidden;
        transition:
          transform 0.25s var(--ease-spring),
          border-color 0.25s var(--ease),
          box-shadow 0.25s var(--ease);
      }
      .class-card:hover {
        transform: translateY(-5px);
        border-color: rgba(228, 48, 43, 0.45);
        box-shadow:
          var(--shadow-lg),
          0 0 0 1px rgba(228, 48, 43, 0.18),
          0 18px 44px -18px rgba(228, 48, 43, 0.35);
        background: var(--glass);
      }
      .class-card:hover .class-num {
        color: var(--volt);
        text-shadow: 0 0 22px rgba(228, 48, 43, 0.5);
      }
      .class-card:focus-visible {
        outline: 2px solid var(--volt);
        outline-offset: 3px;
      }
      .class-card.empty:hover {
        transform: none;
        border-color: var(--line);
        box-shadow: var(--shadow-md);
      }

      .choice-card {
        background: var(--glass);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--line);
        box-shadow:
          var(--shadow-md),
          inset 0 1px 0 rgba(255, 255, 255, 0.045);
      }
      .choice-card::before {
        background: linear-gradient(90deg, var(--volt), var(--violet));
        box-shadow: 0 0 16px rgba(228, 48, 43, 0.55);
      }
      .choice-card:hover {
        border-color: rgba(228, 48, 43, 0.5);
        transform: translateY(-5px);
        box-shadow:
          var(--shadow-lg),
          0 0 0 1px rgba(228, 48, 43, 0.16),
          0 22px 52px -20px rgba(228, 48, 43, 0.4);
      }
      .choice-card:focus-visible {
        outline: 2px solid var(--volt);
        outline-offset: 3px;
      }
      .choice-tag {
        color: var(--volt);
      }

      .project-row {
        position: relative;
        background: var(--glass);
        border: 1px solid var(--line);
        overflow: hidden;
        transition:
          transform 0.22s var(--ease-spring),
          border-color 0.22s var(--ease),
          box-shadow 0.22s var(--ease);
      }
      .project-row:hover {
        transform: translateY(-3px);
        border-color: rgba(228, 48, 43, 0.4);
        box-shadow:
          var(--shadow-lg),
          0 0 0 1px rgba(228, 48, 43, 0.14);
      }
      .project-row:hover .project-row-arrow {
        color: var(--volt);
        transform: translateX(5px);
        text-shadow: 0 0 14px rgba(228, 48, 43, 0.6);
      }
      .project-row-arrow {
        transition:
          transform 0.22s var(--ease-spring),
          color 0.22s var(--ease);
      }
      .project-row:focus-visible {
        outline: 2px solid var(--volt);
        outline-offset: 3px;
      }

      .cp-proj-row:hover {
        background: rgba(228, 48, 43, 0.05);
      }

      .alert-item,
      .support-item {
        transition:
          transform 0.2s var(--ease),
          border-color 0.2s var(--ease),
          box-shadow 0.2s var(--ease);
      }
      .alert-item:hover,
      .support-item:hover {
        transform: translateY(-2px);
        border-color: var(--line-strong);
      }

      /* ---------- 5. controls ---------- */
      .btn-primary {
        color: #031018;
        background: linear-gradient(135deg, #4fe6ff 0%, #17b6e0 100%);
        font-weight: 700;
        box-shadow:
          0 4px 16px -4px rgba(228, 48, 43, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        text-shadow: none;
      }
      .btn-primary:hover {
        background: linear-gradient(135deg, #72ecff 0%, #23c4ef 100%);
        transform: translateY(-1px);
        box-shadow:
          0 8px 26px -6px rgba(228, 48, 43, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      .btn-primary:active {
        transform: translateY(0) scale(0.98);
      }
      .btn-primary:focus-visible {
        outline: 2px solid var(--volt);
        outline-offset: 2px;
      }

      .btn-ghost {
        border-color: var(--line-strong);
        color: var(--steel-300);
        transition:
          background 0.18s var(--ease),
          color 0.18s var(--ease),
          border-color 0.18s var(--ease),
          transform 0.18s var(--ease-spring);
      }
      .btn-ghost:hover {
        background: rgba(228, 48, 43, 0.09);
        color: var(--steel-100);
        border-color: rgba(228, 48, 43, 0.45);
      }
      .btn-ghost:active {
        transform: scale(0.97);
      }

      .btn-danger:hover {
        background: rgba(255, 93, 79, 0.12);
        border-color: var(--r);
        box-shadow:
          0 0 0 1px rgba(255, 93, 79, 0.2),
          0 6px 20px -8px rgba(255, 93, 79, 0.4);
      }

      .support-input,
      .support-textarea,
      .date-field-input,
      .milestone-date-input,
      .ryg-select,
      .login-field input,
      .modal-field input,
      .modal-field select,
      .modal-field textarea {
        background: #ffffff;
        border: 1px solid var(--line-strong);
        color: var(--steel-100);
        color-scheme: light;
        transition:
          border-color 0.18s var(--ease),
          box-shadow 0.18s var(--ease),
          background 0.18s var(--ease);
      }
      .support-input:focus,
      .support-textarea:focus,
      .date-field-input:focus,
      .milestone-date-input:focus,
      .ryg-select:focus,
      .login-field input:focus,
      .modal-field input:focus,
      .modal-field select:focus,
      .modal-field textarea:focus {
        outline: none;
        border-color: var(--volt);
        box-shadow:
          0 0 0 3px rgba(228, 48, 43, 0.14),
          0 0 18px -6px rgba(228, 48, 43, 0.4);
        background: #ffffff;
      }
      input,
      select,
      textarea {
        color-scheme: light;
      }

      .editable-cell:hover {
        background: rgba(228, 48, 43, 0.06);
      }

      /* ---------- 6. data displays ---------- */
      .detail-table th,
      .facility-table th,
      .ncr-table th,
      .spend-log-table th,
      .project-matrix-table th {
        color: var(--steel-400);
        border-bottom: 1px solid var(--line-strong);
      }
      .detail-table td,
      .facility-table td,
      .ncr-table td,
      .spend-log-table td,
      .project-matrix-table td {
        border-color: var(--line);
      }
      .facility-table tbody tr,
      .spend-log-table tbody tr,
      .ncr-table tbody tr,
      .project-matrix-table tbody tr {
        transition: background 0.15s var(--ease);
      }
      .facility-table tbody tr:hover,
      .spend-log-table tbody tr:hover,
      .ncr-table tbody tr:hover,
      .project-matrix-table tbody tr:hover {
        background: rgba(228, 48, 43, 0.045);
      }

      /* completion rings — glow + slow sweep (JS animates dasharray in) */
      .pct-ring-fg {
        transition: stroke-dasharray 0.9s var(--ease);
      }
      .pct-ring-fg.low {
        filter: drop-shadow(0 0 4px rgba(255, 93, 79, 0.55));
      }
      .pct-ring-fg.mid {
        filter: drop-shadow(0 0 4px rgba(255, 178, 36, 0.55));
      }
      .pct-ring-fg.done {
        filter: drop-shadow(0 0 4px rgba(49, 217, 126, 0.6));
      }
      .pct-ring-bg {
        stroke: rgba(17, 17, 17, 0.14);
      }
      .pct-ring-label {
        color: var(--steel-200);
      }

      /* gauges & spend bars grow in and carry a moving sheen */
      @keyframes growX {
        from {
          transform: scaleX(0);
        }
      }
      .budget-gauge-fill,
      .spend-bar-fill {
        transform-origin: left center;
        animation: growX 0.9s var(--ease) both;
        position: relative;
        overflow: hidden;
      }
      .budget-gauge-fill::after,
      .spend-bar-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          105deg,
          transparent 30%,
          rgba(255, 255, 255, 0.22) 50%,
          transparent 70%
        );
        background-size: 220% 100%;
        animation: sheenSweep 3.6s var(--ease) infinite;
      }
      @keyframes sheenSweep {
        0%,
        55% {
          background-position: 130% 0;
        }
        100% {
          background-position: -130% 0;
        }
      }
      .budget-gauge-wrap,
      .spend-bar-track {
        background: #f2f2f2;
        border: 1px solid var(--line);
      }

      /* gantt segments cascade in; highlighted phase pulses */
      .gatechart-flat-seg {
        animation: fadeRise 0.5s var(--ease) both;
      }
      .gatechart-flat-seg:nth-child(1) {
        animation-delay: 0.02s;
      }
      .gatechart-flat-seg:nth-child(2) {
        animation-delay: 0.05s;
      }
      .gatechart-flat-seg:nth-child(3) {
        animation-delay: 0.08s;
      }
      .gatechart-flat-seg:nth-child(4) {
        animation-delay: 0.11s;
      }
      .gatechart-flat-seg:nth-child(5) {
        animation-delay: 0.14s;
      }
      .gatechart-flat-seg:nth-child(6) {
        animation-delay: 0.17s;
      }
      .gatechart-flat-seg:nth-child(7) {
        animation-delay: 0.2s;
      }
      .gatechart-flat-seg:nth-child(8) {
        animation-delay: 0.23s;
      }
      .gatechart-flat-seg:nth-child(9) {
        animation-delay: 0.26s;
      }
      .gatechart-flat-seg:nth-child(10) {
        animation-delay: 0.29s;
      }
      .gatechart-flat-seg:nth-child(11) {
        animation-delay: 0.32s;
      }
      .gatechart-flat-seg:nth-child(12) {
        animation-delay: 0.35s;
      }
      .gatechart-flat-seg:nth-child(13) {
        animation-delay: 0.38s;
      }
      .gatechart-flat-seg:nth-child(14) {
        animation-delay: 0.41s;
      }
      .gatechart-flat-seg:nth-child(15) {
        animation-delay: 0.44s;
      }
      .gatechart-flat-seg.phase-highlighted {
        animation: phasePulse 1.8s var(--ease) infinite;
      }
      @keyframes phasePulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(228, 48, 43, 0.5);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(228, 48, 43, 0);
        }
      }
      .milestone-chip {
        transition:
          transform 0.18s var(--ease-spring),
          box-shadow 0.18s var(--ease);
      }
      .milestone-chip:hover {
        transform: translateY(-2px);
      }

      /* pies glow softly; slices brighten under the cursor */
      .pie-svg {
        filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.6));
      }
      .pie-svg path {
        transition:
          filter 0.2s var(--ease),
          opacity 0.2s var(--ease);
        cursor: pointer;
      }
      .pie-svg path:hover {
        filter: brightness(1.28) drop-shadow(0 0 10px rgba(228, 48, 43, 0.35));
      }
      .pie-center-num {
        color: var(--steel-100);
        text-shadow: 0 0 22px rgba(228, 48, 43, 0.35);
      }

      /* bars glow softly on hover, matching the pie treatment */
      .bar-fill {
        box-shadow: 0 0 0 rgba(228, 48, 43, 0);
        transition:
          filter 0.2s var(--ease),
          box-shadow 0.2s var(--ease);
      }
      .bar-track:hover .bar-fill {
        box-shadow: 0 0 10px rgba(228, 48, 43, 0.35);
      }
      .bar-chart-total {
        text-shadow: 0 0 22px rgba(228, 48, 43, 0.2);
      }

      .status-banner {
        border-color: var(--line-strong);
      }
      .overbudget-chip {
        animation: phasePulseRed 2s var(--ease) infinite;
      }
      @keyframes phasePulseRed {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(255, 93, 79, 0.4);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(255, 93, 79, 0);
        }
      }

      /* ---------- 7. overlays ---------- */
      .modal-overlay {
        background: rgba(2, 4, 10, 0.72);
        backdrop-filter: blur(10px) saturate(1.2);
        -webkit-backdrop-filter: blur(10px) saturate(1.2);
      }
      .modal-card {
        background: linear-gradient(
          180deg,
          rgba(21, 31, 54, 0.92),
          rgba(10, 16, 30, 0.95)
        );
        border: 1px solid var(--line-strong);
        box-shadow:
          0 40px 100px -20px rgba(0, 0, 0, 0.9),
          0 0 0 1px rgba(228, 48, 43, 0.07),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      /* ---- Control Panel + Login modal: pure white surface ---- */
      .modal-box,
      .login-modal {
        background: #ffffff;
        border: 1px solid #e6e6e6;
        box-shadow:
          0 40px 100px -20px rgba(17, 17, 17, 0.22),
          0 0 0 1px rgba(17, 17, 17, 0.03),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .modal-head {
        border-bottom: 1px solid var(--line);
      }

      .toast {
        background: linear-gradient(
          180deg,
          rgba(21, 31, 54, 0.95),
          rgba(10, 16, 30, 0.96)
        );
        border: 1px solid rgba(228, 48, 43, 0.45);
        box-shadow:
          0 18px 44px -10px rgba(0, 0, 0, 0.8),
          0 0 24px -6px rgba(228, 48, 43, 0.35);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      /* ---------- 8. landing hero ---------- */
      .landing-eyebrow {
        color: var(--volt);
      }
      .landing-eyebrow::before,
      .landing-eyebrow::after {
        background: linear-gradient(90deg, transparent, var(--volt-deep));
        box-shadow: 0 0 10px rgba(228, 48, 43, 0.4);
      }
      .landing-eyebrow::after {
        background: linear-gradient(90deg, var(--volt-deep), transparent);
      }
      .landing-title {
        background: linear-gradient(
          180deg,
          #111111 15%,
          #2f2f2f 70%,
          #565656 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      .landing-title .accent {
        background: linear-gradient(
          92deg,
          var(--volt) 0%,
          #ff6a5f 45%,
          var(--volt) 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: brandShimmer 6s var(--ease) infinite;
        filter: drop-shadow(0 0 26px rgba(228, 48, 43, 0.35));
      }
      .landing-sub {
        color: var(--steel-400);
      }

      /* ---------- 9. motion & accessibility ---------- */
      .screen {
        animation: screenIn 0.5s var(--ease);
      }
      @keyframes screenIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      a:focus-visible,
      button:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--volt);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        body::after {
          animation: none;
        }
        .hazard-strip {
          animation: none;
          background-position: 50% 0;
        }
        .brand-mark,
        .landing-title .accent {
          animation: none;
        }
        .budget-gauge-fill,
        .spend-bar-fill,
        .gatechart-flat-seg,
        .screen {
          animation: none;
        }
        .budget-gauge-fill::after,
        .spend-bar-fill::after {
          animation: none;
          display: none;
        }
        .gatechart-flat-seg.phase-highlighted,
        .overbudget-chip {
          animation: none;
        }
        .panel::after,
        .class-card::after,
        .choice-card::after,
        .project-row::after {
          transition: none;
        }
      }

      /* ============================================================
   FX SIMULATION LAYER
   WebGL nebula canvas, 3D card tilt, ripples, scroll beam,
   boot sequence, and text-decode effects. Injected after the
   Mission Control layer; JS lives in the FX ENGINE script.
   ============================================================ */

      /* GPU nebula — replaces the CSS aurora when WebGL is available */
      #fxCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.2s var(--ease);
      }
      html.has-webgl #fxCanvas {
        opacity: 1;
      }
      html.has-webgl body::after {
        display: none;
      } /* shader supersedes CSS aurora */

      /* 3D tilt — interactive cards respond to the cursor in space */
      .class-card,
      .choice-card,
      .project-row {
        will-change: transform;
        transform-style: preserve-3d;
      }
      .class-card:hover {
        transform: perspective(900px) rotateX(var(--tiltx, 0deg))
          rotateY(var(--tilty, 0deg)) translateY(-5px);
      }
      .choice-card:hover {
        transform: perspective(900px) rotateX(var(--tiltx, 0deg))
          rotateY(var(--tilty, 0deg)) translateY(-5px);
      }
      .project-row:hover {
        transform: perspective(1200px) rotateX(var(--tiltx, 0deg))
          rotateY(var(--tilty, 0deg)) translateY(-3px);
      }

      /* button ripple */
      .btn-primary,
      .btn-ghost,
      .btn-danger,
      .header-line-btn,
      .header-back-btn,
      .header-ctrl-btn,
      .support-submit-btn,
      .add-row-btn,
      .cp-add-proj-btn {
        position: relative;
        overflow: hidden;
      }
      .fx-ripple {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.45) 0%,
          rgba(255, 255, 255, 0) 65%
        );
        transform: scale(0);
        animation: rippleGo 0.55s var(--ease) forwards;
        pointer-events: none;
      }
      @keyframes rippleGo {
        to {
          transform: scale(1);
          opacity: 0;
        }
      }

      /* scroll progress beam */
      #scrollBeam {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 0;
        z-index: 60;
        background: linear-gradient(90deg, var(--volt), var(--violet));
        box-shadow: 0 0 14px rgba(228, 48, 43, 0.65);
        pointer-events: none;
      }

      /* boot sequence — once per session */
      #bootOverlay {
        position: fixed;
        inset: 0;
        z-index: 999;
        background:
          radial-gradient(
            900px 500px at 50% 40%,
            rgba(228, 48, 43, 0.05),
            transparent 70%
          ),
          #04070e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        cursor: pointer;
        transition: opacity 0.5s var(--ease);
      }
      #bootOverlay.done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-logo {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(20px, 4vw, 34px);
        letter-spacing: 6px;
        text-transform: uppercase;
        background: linear-gradient(
          92deg,
          var(--steel-100),
          var(--volt),
          var(--steel-100)
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
        animation: brandShimmer 2.2s var(--ease) infinite;
      }
      .boot-bar {
        width: min(340px, 70vw);
        height: 3px;
        background: rgba(17, 17, 17, 0.12);
        border-radius: 2px;
        overflow: hidden;
      }
      .boot-bar i {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--volt), var(--violet));
        box-shadow: 0 0 16px rgba(228, 48, 43, 0.8);
        transition: width 0.18s var(--ease);
      }
      .boot-line {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 2.5px;
        color: var(--steel-500);
        text-transform: uppercase;
        min-height: 14px;
      }

      @media (prefers-reduced-motion: reduce) {
        #fxCanvas {
          display: none;
        }
        html.has-webgl body::after {
          display: block;
        }
        .class-card:hover,
        .choice-card:hover {
          transform: translateY(-5px);
        }
        .project-row:hover {
          transform: translateY(-3px);
        }
        .fx-ripple {
          display: none;
        }
      }

      /* ============================================================
   HIGHWAY THEME LAYER — Eicher red / asphalt / plate yellow.
   Applied on top of the mission-control skin: same structure,
   new paint job. Anton display type, number-plate code chips,
   hazard-amber lane accents.
   ============================================================ */
      :root {
        --plate-yellow: #f7c948;
      }
      /* Anton is naturally tight & loud — relax tracking vs Space Grotesk */
      .brand-mark,
      .landing-title,
      .boot-logo {
        letter-spacing: 2px;
        font-weight: 400;
      }
      h1,
      h2,
      h3 {
        font-weight: 400;
      }
      .landing-title {
        line-height: 0.98;
      }

      /* hazard strip: cyan-era gradient -> true road hazard chevrons */
      .hazard-strip {
        background: repeating-linear-gradient(
          -45deg,
          var(--amber) 0 16px,
          var(--steel-950) 16px 32px
        ) !important;
        animation: none !important;
        height: 8px;
      }

      /* number-plate treatment for project codes in list rows & meta chips */
      .project-code,
      .meta-chip.code,
      .tc-plate {
        font-family: var(--font-mono);
        background: var(--plate-yellow) !important;
        color: #141414 !important;
        border: 1.5px solid #141414 !important;
        border-radius: 3px;
        font-weight: 600;
      }

      /* primary buttons: red decal cut like a mudflap edge */
      .btn-primary {
        clip-path: polygon(0 0, 100% 0, 96% 100%, 0 100%);
      }

      /* focus ring follows the new accent */
      a:focus-visible,
      button:focus-visible,
      [tabindex]:focus-visible {
        outline-color: var(--amber);
      }

      /* ══════════ WHITE THEME — original colors, white bg, readable type ══════════ */
      body {
        background: #ffffff;
        color: var(--steel-100);
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      .brand-mark,
      .landing-title,
      .boot-logo {
        font-weight: 800;
        letter-spacing: 0.01em;
      }
      td,
      th {
        line-height: 1.5;
      }
      ::selection {
        background: var(--volt);
        color: #fff;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(17, 17, 17, 0.22);
      }
    </style>
  </head>
  <body>
    <!-- Persistent top strip -->
    <div class="hazard-strip"></div>

    <header class="topbar" id="topbar">
      <div class="topbar-inner">
        <button class="brand" id="homeBtn" aria-label="Go to home">
          <span class="brand-mark">ME NPI DASHBOARD</span>
        </button>
        <div class="topbar-actions">
          <span class="clock" id="clock"></span>
          <button
            class="header-line-btn"
            id="headerMhdBtn"
            data-line="MHD"
            title="Go to MHD projects"
          >
            MHD
          </button>
          <button
            class="header-line-btn"
            id="headerHdBtn"
            data-line="HD"
            title="Go to HD projects"
          >
            HD
          </button>
          <button class="header-back-btn" id="topbarBackBtn" title="Go back">
            ← Back
          </button>
          <button
            class="header-ctrl-btn"
            id="controlPanelBtn"
            title="Control Panel"
          >
            ⚙ Control Panel
          </button>
        </div>
      </div>
    </header>

    <main id="app"></main>

    <footer class="app-footer">
      <span>NPI Dashboard · Supervisor View</span>
      <span class="dot">•</span>
      <span id="footerStamp"></span>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Modal overlay (spend entry form, etc.) -->
    <div class="modal-overlay" id="modalOverlay"></div>

    <script>
      /* ============================================================
   NPI DASHBOARD — DATA FILE
   ------------------------------------------------------------
   Edit this file to add / update projects. No other file needs
   to change when you add a new project or update weekly status.

   Structure:
   PROJECT_DATA = {
     MHD: { "1": [...projects], "2": [...], "3": [...] },
     HD:  { "1": [...projects], "2": [...], "3": [...] }
   }

   Each project object follows the same shape as the VECV PPT
   slides: header info, phase timeline, milestone dates, topic
   tracker (Plan/Actual/RYG), NCR table, achievements, upcoming
   activities, support required.
   ============================================================ */

      const PHASES = [
        "PreStudy",
        "Concept Study",
        "Detail Dev.",
        "Final Dev.",
        "Industrialization",
        "Fallow Up",
      ];

      // Department-wide annual ME budget pool. Projects draw their allocation
      // from this single pool — edit totalSanctioned/fyLabel here each year.
      const BUDGET_POOL = {
        fyLabel: "FY26",
        totalSanctioned: 25000000, // ₹ 2.5 Cr for the year — edit to your real figure
      };

      // Fixed spend categories used across every project's spend log.
      // Keep this list short and consistent so the category pie chart stays readable.
      const SPEND_CATEGORIES = [
        "Tooling/Fixture",
        "Facility",
        "Training",
        "Trial/Validation",
        "Other",
      ];

      // Helper to keep project objects short to write by hand
      function project(p) {
        return Object.assign(
          {
            milestones: [], // [{label, weeks:[{week, done}], color}]
            topics: [], // [{group, topic, key, plan, actual, status, remarks}]
            ncrTitle: "NCR Status",
            ncrRows: [], // [{category, G, Y:[p1,p2,p3], R:[p1,p2,p3], total}]
            facilityTracker: [], // [{id, operation, facility, costMINR, leadTimeWeeks,
            //   rfq, ipr, po, mfg, ic, validation, paymentRelease,
            //   handover, wccClosure, status}]
            criticalPoints: [], // editable bullet list shown in the VDFA & NCR Closure section
            achievements: [],
            upcoming: [],
            support: [],
            extra: null, // optional free text block (e.g. timeline comms)
            budget: {
              allocated: 0, // ₹ sanctioned for this project, drawn from BUDGET_POOL
              spendLog: [], // [{ id, date:"YYYY-MM-DD", amount, category, note, type:"spent"|"committed" }]
            },
          },
          p,
        );
      }

      const PROJECT_DATA = {
        /* No project is hardcoded/seeded anymore. The dashboard starts empty
   for every line/class; every project shown comes entirely from what's
   been added through the UI and saved server-side in npi_state.json. */
        HD: {
          1: [],
          2: [],
          3: [],
        },
        MHD: {
          1: [],
          2: [],
          3: [],
        },
      };
    </script>
    <script>
      /* ============================================================
   NPI DASHBOARD — APP LOGIC
   Pure vanilla JS. No build step, no frameworks.
   Screens: landing -> class select -> project list -> project view
   Data persists to localStorage so supervisor edits (Plan/Actual/
   RYG/Remarks, achievements, etc.) survive a refresh, while
   data.js remains the "factory default" seed.
   ============================================================ */

      (function () {
        const STORE_KEY = "npi_dashboard_state_v2";
        const AUTH_KEY = "npi_dashboard_auth_v1";
        // Credentials are NO LONGER stored in the browser. Authentication happens
        // server-side (POST /api/login) and the real session lives in an HttpOnly
        // cookie. These two variables only mirror the server session for display /
        // UI gating — the server is the sole authority on who may save data.
        let SERVER_LOGGED_IN = false;
        let SERVER_OPERATOR = "Control Panel";
        const app = document.getElementById("app");
        const toastEl = document.getElementById("toast");
        const clockEl = document.getElementById("clock");
        const footerStamp = document.getElementById("footerStamp");

        // ---------------- auth ----------------
        // A simple login gate: the Control Panel button opens a username/password
        // prompt. Once authenticated, a flag is persisted in its own storage key
        // (separate from the project data) so the session survives a refresh.
        // Editing anywhere in the app — meta fields, status, NCR numbers,
        // achievement/upcoming/support lists, topic rows, budget/spend entries,
        // adding a project — is gated behind isLoggedIn().
        // isLoggedIn() reflects the cached server session. It is only used to light
        // up editable UI — it is NOT a security control. The server independently
        // rejects any save from a request without a valid session (HTTP 401), so
        // faking this flag in the console gains nothing.
        function isLoggedIn() {
          return SERVER_LOGGED_IN === true;
        }
        function setLoggedIn(val) {
          SERVER_LOGGED_IN = !!val;
        }
        // Real server-side login. Returns a Promise<boolean>.
        async function attemptLogin(user, pass) {
          try {
            const res = await fetch("/api/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: user, pass: pass }),
            });
            const json = await res.json().catch(() => ({}));
            if (res.ok && json && json.success) {
              SERVER_LOGGED_IN = true;
              SERVER_OPERATOR = json.operator || user;
              return true;
            }
          } catch (e) {
            /* network error -> treated as failed login */
          }
          return false;
        }
        function logout() {
          fetch("/api/logout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
          })
            .catch(() => {})
            .finally(() => {
              SERVER_LOGGED_IN = false;
              showToast("Logged out");
              refreshControlPanelBtn();
              render();
            });
        }
        function refreshControlPanelBtn() {
          const btn = document.getElementById("controlPanelBtn");
          if (!btn) return;
          if (isLoggedIn()) {
            btn.textContent = "⚙ " + SERVER_OPERATOR;
            btn.classList.add("logged-in");
            btn.title = "Logged in — click for Control Panel";
          } else {
            btn.textContent = "⚙ Control Panel";
            btn.classList.remove("logged-in");
            btn.title = "Control Panel — log in to edit";
          }
        }
        // Shows the login modal. onSuccess runs after a correct login (e.g. to
        // re-render the current screen so editable controls light up).
        function showLoginModal(onSuccess) {
          const overlay = document.createElement("div");
          overlay.className = "auth-modal-overlay";
          overlay.innerHTML = `
      <div class="modal-box login-modal">
        <div class="modal-title">Control Panel Login</div>
        <p class="login-sub">Sign in to edit project data.</p>
        <label class="login-field">
          <span>ID</span>
          <input type="text" id="loginUserInput" autocomplete="username" />
        </label>
        <label class="login-field">
          <span>Password</span>
          <input type="password" id="loginPassInput" autocomplete="current-password" />
        </label>
        <div class="login-error" id="loginError" style="display:none;">Incorrect ID or password.</div>
        <div class="modal-actions">
          <button class="btn-ghost" id="loginCancelBtn">Cancel</button>
          <button class="btn-primary" id="loginSubmitBtn">Log In</button>
        </div>
      </div>
    `;
          document.body.appendChild(overlay);
          const userInput = overlay.querySelector("#loginUserInput");
          const passInput = overlay.querySelector("#loginPassInput");
          const errorEl = overlay.querySelector("#loginError");
          userInput.focus();

          const submitBtn = overlay.querySelector("#loginSubmitBtn");
          function close() {
            overlay.remove();
          }
          async function submit() {
            if (submitBtn) submitBtn.disabled = true;
            const ok = await attemptLogin(
              userInput.value.trim(),
              passInput.value,
            );
            if (ok) {
              close();
              showToast("Logged in as " + SERVER_OPERATOR);
              refreshControlPanelBtn();
              if (onSuccess) onSuccess();
            } else {
              errorEl.style.display = "block";
              passInput.value = "";
              passInput.focus();
              if (submitBtn) submitBtn.disabled = false;
            }
          }
          overlay
            .querySelector("#loginCancelBtn")
            .addEventListener("click", close);
          overlay
            .querySelector("#loginSubmitBtn")
            .addEventListener("click", submit);
          overlay.addEventListener("click", (e) => {
            if (e.target === overlay) close();
          });
          [userInput, passInput].forEach((inp) => {
            inp.addEventListener("keydown", (e) => {
              if (e.key === "Enter") submit();
            });
          });
        }
        // Call this before any edit action. If logged in, runs `fn` immediately.
        // If not, opens the login modal and runs `fn` automatically on success
        // (so a first click both logs in AND completes the edit in one step).
        function withAuth(fn) {
          if (isLoggedIn()) {
            fn();
            return;
          }
          showLoginModal(fn);
        }

        function openControlPanel() {
          if (isLoggedIn()) {
            const overlay = document.createElement("div");
            overlay.className = "auth-modal-overlay";
            overlay.style.alignItems = "flex-start";
            overlay.style.overflowY = "auto";
            overlay.style.padding = "28px 20px";

            // Build class-wise project list for current line (if we're on a line view), else all
            function buildProjectListHtml() {
              const lines = state.line ? [state.line] : ["HD", "MHD"];
              let html = "";
              lines.forEach((line) => {
                ["1", "2", "3"].forEach((cls) => {
                  const projs = getProjects(line, cls);
                  if (!projs.length && !state.line) return; // hide empty cross-line classes when browsing all
