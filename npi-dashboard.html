<script>
/* ============================================================
   NPI DASHBOARD — APP LOGIC
   Pure vanilla JS. No build step, no frameworks.
   Screens: landing -> class select -> project list -> project view
   Data persists to localStorage so supervisor edits (Plan/Actual/
   RYG/Remarks, achievements, etc.) survive a refresh, while
   data.js remains the "factory default" seed.
   ============================================================ */

(function(){

  const STORE_KEY = "npi_dashboard_state_v2";
  const AUTH_KEY = "npi_dashboard_auth_v1";
  // Credentials are NO LONGER stored in the browser. Authentication happens
  // server-side (POST /api/login) and the real session lives in an HttpOnly
  // cookie. These two variables only mirror the server session for display /
  // UI gating — the server is the sole authority on who may save data.
  let SERVER_LOGGED_IN = false;
  let SERVER_OPERATOR = "Control Panel";
  const app = document.getElementById("app");
  const toastEl = document.getElementById("toast");
  const clockEl = document.getElementById("clock");
  const footerStamp = document.getElementById("footerStamp");

  // ---------------- auth ----------------
  // A simple login gate: the Control Panel button opens a username/password
  // prompt. Once authenticated, a flag is persisted in its own storage key
  // (separate from the project data) so the session survives a refresh.
  // Editing anywhere in the app — meta fields, status, NCR numbers,
  // achievement/upcoming/support lists, topic rows, budget/spend entries,
  // adding a project — is gated behind isLoggedIn().
  // isLoggedIn() reflects the cached server session. It is only used to light
  // up editable UI — it is NOT a security control. The server independently
  // rejects any save from a request without a valid session (HTTP 401), so
  // faking this flag in the console gains nothing.
  function isLoggedIn(){
    return SERVER_LOGGED_IN === true;
  }
  function setLoggedIn(val){
    SERVER_LOGGED_IN = !!val;
  }
  // Real server-side login. Returns a Promise<boolean>.
  async function attemptLogin(user, pass){
    try{
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: user, pass: pass })
      });
      const json = await res.json().catch(()=>({}));
      if(res.ok && json && json.success){
        SERVER_LOGGED_IN = true;
        SERVER_OPERATOR = json.operator || user;
        return true;
      }
    }catch(e){ /* network error -> treated as failed login */ }
    return false;
  }
  function logout(){
    fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" } })
      .catch(()=>{})
      .finally(()=>{
        SERVER_LOGGED_IN = false;
        showToast("Logged out");
        refreshControlPanelBtn();
        render();
      });
  }
  function refreshControlPanelBtn(){
    const btn = document.getElementById("controlPanelBtn");
    if(!btn) return;
    if(isLoggedIn()){
      btn.textContent = "⚙ " + SERVER_OPERATOR;
      btn.classList.add("logged-in");
      btn.title = "Logged in — click for Control Panel";
    } else {
      btn.textContent = "⚙ Control Panel";
      btn.classList.remove("logged-in");
      btn.title = "Control Panel — log in to edit";
    }
  }
  // Shows the login modal. onSuccess runs after a correct login (e.g. to
  // re-render the current screen so editable controls light up).
  function showLoginModal(onSuccess){
    const overlay = document.createElement("div");
    overlay.className = "auth-modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box login-modal">
        <div class="modal-title">Control Panel Login</div>
        <p class="login-sub">Sign in to edit project data.</p>
        <label class="login-field">
          <span>ID</span>
          <input type="text" id="loginUserInput" autocomplete="username" />
        </label>
        <label class="login-field">
          <span>Password</span>
          <input type="password" id="loginPassInput" autocomplete="current-password" />
        </label>
        <div class="login-error" id="loginError" style="display:none;">Incorrect ID or password.</div>
        <div class="modal-actions">
          <button class="btn-ghost" id="loginCancelBtn">Cancel</button>
          <button class="btn-primary" id="loginSubmitBtn">Log In</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const userInput = overlay.querySelector("#loginUserInput");
    const passInput = overlay.querySelector("#loginPassInput");
    const errorEl = overlay.querySelector("#loginError");
    userInput.focus();

    const submitBtn = overlay.querySelector("#loginSubmitBtn");
    function close(){ overlay.remove(); }
    async function submit(){
      if(submitBtn) submitBtn.disabled = true;
      const ok = await attemptLogin(userInput.value.trim(), passInput.value);
      if(ok){
        close();
        showToast("Logged in as " + SERVER_OPERATOR);
        refreshControlPanelBtn();
        if(onSuccess) onSuccess();
      } else {
        errorEl.style.display = "block";
        passInput.value = "";
        passInput.focus();
        if(submitBtn) submitBtn.disabled = false;
      }
    }
    overlay.querySelector("#loginCancelBtn").addEventListener("click", close);
    overlay.querySelector("#loginSubmitBtn").addEventListener("click", submit);
    overlay.addEventListener("click", (e)=>{ if(e.target === overlay) close(); });
    [userInput, passInput].forEach(inp=>{
      inp.addEventListener("keydown", (e)=>{ if(e.key === "Enter") submit(); });
    });
  }
  // Call this before any edit action. If logged in, runs `fn` immediately.
  // If not, opens the login modal and runs `fn` automatically on success
  // (so a first click both logs in AND completes the edit in one step).
  function withAuth(fn){
    if(isLoggedIn()){ fn(); return; }
    showLoginModal(fn);
  }

  function openControlPanel(){
    if(isLoggedIn()){
      const overlay = document.createElement("div");
      overlay.className = "auth-modal-overlay";
      overlay.style.alignItems = "flex-start";
      overlay.style.overflowY = "auto";
      overlay.style.padding = "28px 20px";

      // Build class-wise project list for current line (if we're on a line view), else all
      function buildProjectListHtml(){
        const lines = state.line ? [state.line] : ["HD","MHD"];
        let html = "";
        lines.forEach(line=>{
          ["1","2","3"].forEach(cls=>{
            const projs = getProjects(line, cls);
            if(!projs.length && !state.line) return; // hide empty cross-line classes when browsing all
            html += `
              <div class="cp-class-block">
                <div class="cp-class-head">
                  <span class="cp-class-tag">${line} — Class ${cls}</span>
                  <span class="cp-class-count">${projs.length} project${projs.length!==1?'s':''}</span>
                </div>
                ${projs.length ? `
                <div class="cp-proj-list">
                  ${projs.map(p=>`
                    <div class="cp-proj-row">
                      <span class="status-pill ${p.status}" style="flex:0 0 auto;"></span>
                      <span class="cp-proj-name">${escapeHtml(p.name)}</span>
                      <span class="cp-proj-code">${escapeHtml(p.code||'—')}</span>
                      <span class="cp-proj-cpm">${escapeHtml(p.cpm||'—')}</span>
                    </div>
                  `).join("")}
                </div>` : `<div class="cp-empty-class">No projects in this class yet.</div>`}
                <button class="cp-add-proj-btn" data-cp-line="${line}" data-cp-class="${cls}">+ Add Project to ${line} Class ${cls}</button>
              </div>
            `;
          });
        });
        return html || `<div class="cp-empty-class">No projects found.</div>`;
      }

      overlay.innerHTML = `
        <div class="modal-box login-modal" style="max-width:680px;width:100%;">
          <div class="modal-title" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <span>⚙ Control Panel</span>
            <button id="cpCloseBtn" class="modal-close" style="font-size:17px;">✕</button>
          </div>
          <p class="login-sub">Signed in as <strong>${SERVER_OPERATOR}</strong>. All project fields are editable on the dashboard.</p>

          <div style="border-top:1px solid var(--steel-700);margin:14px 0 16px;"></div>
          <div style="font-family:var(--font-display);font-size:14.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--plate);margin-bottom:14px;">Project Registry</div>

          <div id="cpProjectList">${buildProjectListHtml()}</div>

          <div style="border-top:1px solid var(--steel-700);margin-top:18px;padding-top:14px;display:flex;justify-content:flex-end;">
            <button class="btn-primary" id="cpLogoutBtn">Log Out</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);

      // close
      overlay.querySelector("#cpCloseBtn").addEventListener("click", ()=> overlay.remove());
      overlay.querySelector("#cpLogoutBtn").addEventListener("click", ()=>{
        overlay.remove();
        logout();
      });
      overlay.addEventListener("click", (e)=>{ if(e.target === overlay) overlay.remove(); });

      // Add project buttons inside control panel
      overlay.querySelectorAll(".cp-add-proj-btn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const line = btn.dataset.cpLine;
          const cls = btn.dataset.cpClass;
          overlay.remove();
          openAddProjectModal(line, cls);
        });
      });

    } else {
      showLoginModal(()=> render());
    }
  }

  // ---- Add Project Modal: rich form with live preview ----
  function openAddProjectModal(line, cls){
    const modalEl = document.createElement("div");
    modalEl.className = "auth-modal-overlay";
    modalEl.style.alignItems = "flex-start";
    modalEl.style.overflowY = "auto";
    modalEl.style.padding = "24px 16px";
    modalEl.style.zIndex = "500";

    const PHASES_LABELS = ["PCIG","FeG","CG","B Rel.","DG","B Build","C Rel.","FDG","C Build","P Rel.","FIG","P Build","LG","SOP","RG/EG"];
    const TOPIC_SEED = [
      {group:"D",topic:"Change Detail",key:"Change Detail"},{group:"Q",topic:"PFD PFMEA",key:"PFD PFMEA"},{group:"Q",topic:"QA Matrix",key:"QA Matrix"},
      {group:"Q",topic:"PRQ Sign off",key:"PRQ Sign off"},{group:"D",topic:"L2 plan",key:"L2 plan"},{group:"Q",topic:"Feasibility Study",key:"Feasibility Study"},
      {group:"D",topic:"VDFA & NCR Closure",key:"VDFA"},{group:"D",topic:"Facility Tracker",key:"Facility Tracker"},
      {group:"D",topic:"Build Tracker",key:"Build Tracker"},{group:"Q",topic:"Prodcut Audit Score",key:"Prodcut Audit Score"},{group:"Q",topic:"Gate Audit Score",key:"Gate Audit Score"},
      {group:"D",topic:"Training Doc & Record",key:"Training Doc & Record"},{group:"D",topic:"Station Wise BOM",key:"Station Wise BOM"},
      {group:"D",topic:"Phantom Input & Release",key:"Phantom Input & Release"},{group:"Q",topic:"AOS",key:"AOS"}
    ];

    function buildPreviewHtml(name, cpm, code, sop, status){
      const safeName = name || "Project Name";
      const safeCpm = cpm || "CPM";
      const safeCode = code || "CODE";
      const safeSop = sop || "SOP";
      // mini timeline preview
      const timelineHtml = PHASES_LABELS.map((lbl,i)=>{
        const phaseIdx = Math.min(5, Math.floor((i/PHASES_LABELS.length)*6));
        return `<div class="gatechart-flat-col" style="flex:1;min-width:50px;">
          <div class="gatechart-flat-seg phase-${phaseIdx}" style="font-size:14px;padding:5px 2px;opacity:0.7;">${lbl}</div>
          <div style="font-family:var(--font-mono);font-size:14px;color:var(--steel-500);text-align:center;margin-top:3px;">TBD</div>
        </div>`;
      }).join("");

  // ---------------- state ----------------
  let state = {
    line: null,     // "MHD" | "HD"
    classId: null,  // "1" | "2" | "3"
    projectId: null,
    topicIdx: null  // index into project.topics, when viewing a topic's full detail screen
  };

  let DATA = loadData();

  function loadData(){
    let stored = null;
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) stored = JSON.parse(raw);
    }catch(e){ /* ignore corrupt storage */ }

    const seed = JSON.parse(JSON.stringify(PROJECT_DATA));
    if(!stored) return seed;

    // Self-healing merge, two passes:
    // 1) Any project that exists in the current seed file but is missing
    //    from what's stored (e.g. new sample/dummy projects added in an
    //    update) gets appended.
    // 2) Any project that already exists in storage but is missing a
    //    top-level field the seed has (e.g. older saved state predating
    //    the "budget" feature) gets that field backfilled from the seed.
    //    Only fields that are completely absent are filled in — anything
    //    the supervisor already edited (even to an empty value) is left
    //    untouched, so real edits are never overwritten.
    ["HD","MHD"].forEach(line=>{
      if(!stored[line]) stored[line] = {};
      ["1","2","3"].forEach(cls=>{
        const seedList = (seed[line] && seed[line][cls]) || [];
        if(!stored[line][cls]) stored[line][cls] = [];
        const storedList = stored[line][cls];
        const storedById = {};
        storedList.forEach(p=> storedById[p.id] = p);

        seedList.forEach(seedProj=>{
          const existing = storedById[seedProj.id];
          if(!existing){
            // entirely new project from the seed -> append as-is
            storedList.push(seedProj);
          } else {
            // existing project -> backfill any field that's missing outright
            Object.keys(seedProj).forEach(key=>{
              if(!(key in existing)){
                existing[key] = seedProj[key];
              }
            });
            // "topics" is a controlled tracker structure (the supervisor never
            // hand-edits plan/actual/status on a card — there's no UI for that),
            // so instead of only backfilling when missing, always resync it to
            // the current seed's topic set/order. Topics the supervisor added
            // by hand via "+ Add topic row" are flagged custom:true at creation
            // time, so only those survive the resync — any other leftover
            // topic (e.g. a name from a previous seed version) is dropped.
            // Topics the supervisor explicitly deleted (tracked by stable key
            // in deletedTopics — older saved data may have tracked these by
            // display name instead, so both are honored) are excluded from
            // the reseed so the deletion sticks across reloads, even though
            // new canonical topics added in a future update will still get
            // backfilled in normally. Any section the supervisor renamed
            // (tracked by key -> new label in renamedTopics) gets that label
            // re-applied after the canonical reseed, so a rename also
            // survives reload exactly like a deletion does.
            if(seedProj.topics){
              const deletedKeys = new Set(existing.deletedTopics || []);
              const renamed = existing.renamedTopics || {};
              const customExtras = (existing.topics || []).filter(t=>t.custom);
              existing.topics = seedProj.topics
                .filter(t=> !deletedKeys.has(t.key) && !deletedKeys.has(t.topic))
                .map(t=>{
                  const fresh = {...t};
                  if(renamed[t.key]) fresh.topic = renamed[t.key];
                  return fresh;
                })
                .concat(customExtras);
            }
            // "milestones" is the same story — there's no UI to hand-edit an
            // individual milestone's week/done/active state, so a browser
            // that cached a shorter milestone list (from before the gate
            // chart had its full PCIG-through-RG/EG set) would otherwise
            // keep showing that truncated list forever. Always resync to
            // the seed's current milestone set.
            if(seedProj.milestones){
              existing.milestones = seedProj.milestones.map(m=>({...m}));
            }
          }
        });
      });
    });
    return stored;
  }

  function saveData(){
    // Keep a local cache for instant UI / offline resilience...
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }catch(e){ /* ignore */ }
    // ...but the authoritative, shared copy lives on the server, and the
    // server requires a valid session to accept the write. If the session is
    // missing/expired the server returns 401 and we tell the user.
    try{
      fetch("/api/npi_state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ state: DATA })
      }).then(function(r){
        if(r.status === 401 || r.status === 403){
          SERVER_LOGGED_IN = false;
          if(typeof refreshControlPanelBtn === "function") refreshControlPanelBtn();
          showToast("Session expired — please log in again to save.");
        }
      }).catch(function(){ /* offline: local cache still holds the edit */ });
    }catch(e){ /* fetch unavailable (opened as a file) -> local only */ }
  }

  function resetToFactory(){
    DATA = JSON.parse(JSON.stringify(PROJECT_DATA));
    saveData();
    showToast("Restored factory data");
    render();
  }

  // ---------------- budget helpers ----------------
  // All money helpers are derived from each project's budget.spendLog —
  // spent/committed/remaining are never typed in directly, so the numbers
  // always trace back to an auditable entry (date, amount, category, note).

  function formatINR(n){
    n = Number(n)||0;
    const sign = n<0 ? "-" : "";
    n = Math.abs(Math.round(n));
    return sign + "₹" + n.toLocaleString("en-IN");
  }

  function formatINRShort(n){
    n = Number(n)||0;
    const sign = n<0 ? "-" : "";
    const abs = Math.abs(n);
    if(abs >= 1e7) return sign + "₹" + (abs/1e7).toFixed(2).replace(/\.00$/,"") + " Cr";
    if(abs >= 1e5) return sign + "₹" + (abs/1e5).toFixed(2).replace(/\.00$/,"") + " L";
    return formatINR(n);
  }

  function projectBudgetSummary(p){
    const log = (p.budget && p.budget.spendLog) || [];
    let spent = 0, committed = 0;
    log.forEach(e=>{
      if(e.type === "committed") committed += (e.amount||0);
      else spent += (e.amount||0);
    });
    const allocated = (p.budget && p.budget.allocated) || 0;
    const used = spent + committed;
    const remaining = allocated - used;
    const pctUsed = allocated > 0 ? Math.min(150, Math.round((used/allocated)*100)) : 0;
    return { allocated, spent, committed, used, remaining, pctUsed, overBudget: used > allocated };
  }

  function portfolioBudgetSummary(){
    let allocated=0, spent=0, committed=0;
    ["HD","MHD"].forEach(line=>{
      Object.keys(DATA[line]||{}).forEach(cls=>{
        (DATA[line][cls]||[]).forEach(p=>{
          const s = projectBudgetSummary(p);
          allocated += s.allocated; spent += s.spent; committed += s.committed;
        });
      });
    });
    const pool = BUDGET_POOL.totalSanctioned;
    const unallocated = pool - allocated;
    const poolRemaining = pool - spent - committed;
    return { pool, allocated, spent, committed, unallocated, poolRemaining };
  }

  function categorySpendBreakdown(){
    const counts = {};
    SPEND_CATEGORIES.forEach(c=>counts[c]=0);
    ["HD","MHD"].forEach(line=>{
      Object.keys(DATA[line]||{}).forEach(cls=>{
        (DATA[line][cls]||[]).forEach(p=>{
          (p.budget && p.budget.spendLog || []).forEach(e=>{
            counts[e.category] = (counts[e.category]||0) + (e.amount||0);
          });
        });
      });
    });
    return counts;
  }

  function projectSpendBreakdown(){
    const out = [];
    ["HD","MHD"].forEach(line=>{
      Object.keys(DATA[line]||{}).forEach(cls=>{
        (DATA[line][cls]||[]).forEach(p=>{
          const s = projectBudgetSummary(p);
          if(s.used > 0) out.push({ name:p.name, used:s.used, line, classId:cls, projectId:p.id, overBudget:s.overBudget });
        });
      });
    });
    return out.sort((a,b)=>b.used-a.used);
  }

  // ---------------- helpers ----------------
  const LINE_INFO = {
    MHD:{ full:"Medium & Heavy Duty", desc:"Pro-series trucks, common chassis, cabin & trim projects across the MHD platform family.", tagline:"MHD PLATFORM" },
    HD:{  full:"Heavy Duty", desc:"Chassis, cabin, HVAC and aggregate NPI projects for the Heavy Duty truck range.", tagline:"HD PLATFORM" }
  };
  const CLASS_INFO = {
    "1":{ name:"Class 1", desc:"Major platform / all-new architecture" },
    "2":{ name:"Class 2", desc:"Major change / new system introduction" },
    "3":{ name:"Class 3", desc:"Minor change / variant & feature add" }
  };

  function getProjects(line, classId){
    return (DATA[line] && DATA[line][classId]) || [];
  }
  function findProject(line, classId, id){
    return getProjects(line, classId).find(p=>p.id===id);
  }
  function countAll(line, classId){
    return getProjects(line, classId).length;
  }
  function deleteProject(line, classId, id){
    const list = DATA[line] && DATA[line][classId];
    if(!list) return false;
    const idx = list.findIndex(p=>p.id===id);
    if(idx === -1) return false;
    list.splice(idx,1);
    saveData();
    return true;
  }

  // % complete = average of (done milestones / total milestones) and
  // (green/"G" topics / total topics) — blends schedule progress (gates
  // cleared) with readiness progress (sign-offs achieved) into one figure.
  function percentComplete(p){
    const ms = p.milestones || [];
    const msTotal = ms.length;
    const msDone = ms.filter(m=>m.done).length;
    const msPct = msTotal ? (msDone/msTotal) : 0;

    const tp = p.topics || [];
    const tpTotal = tp.length;
    const tpDone = tp.filter(t=>t.status==="G").length;
    const tpPct = tpTotal ? (tpDone/tpTotal) : 0;

    if(!msTotal && !tpTotal) return 0;
    if(!msTotal) return Math.round(tpPct*100);
    if(!tpTotal) return Math.round(msPct*100);
    return Math.round(((msPct+tpPct)/2)*100);
  }

  // ---------------- edit history ----------------
  // Every edit made anywhere in a project (meta fields, status, NCR
  // numbers, achievement/upcoming/support items, topic rows, spend
  // entries, allocation changes) is appended to that project's own
  // `history` array and persisted via saveData(), so it survives a
  // refresh. Shown on the project's History tab.
  function logChange(p, field, oldVal, newVal){
    if(!p.history) p.history = [];
    // skip no-op edits (e.g. clicking into a field and clicking back out
    // without changing anything) so the history doesn't fill with noise
    if(String(oldVal) === String(newVal)) return;
    p.history.unshift({
      field,
      oldVal: oldVal===undefined||oldVal===null||oldVal==="" ? "—" : String(oldVal),
      newVal: newVal===undefined||newVal===null||newVal==="" ? "—" : String(newVal),
      by: SERVER_OPERATOR,
      at: new Date().toISOString()
    });
    // cap history length per project so storage doesn't grow unbounded
    if(p.history.length > 300) p.history.length = 300;
  }

  function formatHistoryTime(iso){
    try{
      const d = new Date(iso);
      return d.toLocaleString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'});
    }catch(e){ return iso; }
  }

  // History tab — only ever rendered when isLoggedIn() is true (see the
  // call site in renderProjectDashboard), shows this project's own edit
  // history, most recent first.
  function renderHistoryPanel(p){
    const hist = p.history || [];
    return `
      <div class="panel history-panel">
        <div class="panel-head">
          <div class="panel-title">🕘 History <span class="chip">${hist.length} ${hist.length===1?'change':'changes'}</span></div>
        </div>
        ${hist.length ? `
          <div class="history-list">
            ${hist.map(h=>`
              <div class="history-row">
                <div class="history-row-field">${escapeHtml(h.field)}</div>
                <div class="history-row-change">
                  <span class="history-old">${escapeHtml(h.oldVal)}</span>
                  <span class="history-arrow">→</span>
                  <span class="history-new">${escapeHtml(h.newVal)}</span>
                </div>
                <div class="history-row-meta">${escapeHtml(h.by)} · ${formatHistoryTime(h.at)}</div>
              </div>
            `).join("")}
          </div>
        ` : `<div style="color:var(--steel-500);font-size:14.5px;padding:8px 0;">No edits logged yet for this project.</div>`}
      </div>
    `;
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(()=>toastEl.classList.remove("show"), 2200);
  }

  function escapeHtml(str){
    if(str===undefined || str===null) return "";
    return String(str).replace(/[&<>"']/g, c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  // ---------------- timeline date helpers ----------------
  // Week-codes follow the shop-floor convention W{yy}{ww} — e.g. "W2440" is
  // ISO week 40 of 2024. weekCodeToCalendar() turns that into an approximate
  // "Mon 'YY" label for display under the week-code. Anything that isn't a
  // clean W{yy}{ww} (e.g. "Over", "TBD", "NA", "—", or a week RANGE like
  // "W2444~48") is left without a calendar line — we only show derived dates
  // we're confident in, rather than guessing at a range's exact endpoint.
  const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function weekCodeToCalendar(code){
    if(!code) return "";
    const m = /^W(\d{2})(\d{2})$/.exec(code.trim());
    if(!m) return ""; // ranges / "TBD" / "NA" / "Over" / "—" etc. — skip
    const yy = parseInt(m[1],10), ww = parseInt(m[2],10);
    if(ww < 1 || ww > 53) return "";
    const year = 2000 + yy;
    // ISO-ish week-to-date: Jan 1 + (week-1)*7 days, then read off the month
    const approx = new Date(Date.UTC(year,0,1) + (ww-1)*7*86400000);
    return `${MONTH_ABBR[approx.getUTCMonth()]} '${String(year).slice(2)}`;
  }

  // Splits a "/"-joined week string into {old:[...], current} — when a
  // milestone has been revised multiple times, we only keep the very FIRST
  // (original plan) and the LAST (current/latest) date — the in-between
  // revisions are dropped so the timeline stays a consistent height even
  // for milestones with a long slip history. Single-code strings just
  // return that code as current with no old date.
  function splitWeekHistory(week){
    if(!week) return { old:[], current:"" };
    const parts = String(week).split("/").map(s=>s.trim()).filter(Boolean);
    if(parts.length <= 1) return { old:[], current: parts[0] || week };
    const first = parts[0], last = parts[parts.length-1];
    return { old: first===last ? [] : [first], current: last };
  }

  // Maps a milestone's position to one of the 6 PHASES for coloring,
  // distributing the project's milestone list proportionally across phases
  // (mirrors the old chunkMilestones bucketing, but per-item rather than
  // grouped) so a 15-milestone project and a 5-milestone project both span
  // the full grey->red->orange->yellow->green->blue progression.
  function milestonePhaseIdx(i, total){
    if(total <= 1) return 0;
    return Math.min(5, Math.floor((i/total)*6));
  }

  // Computes the 6 phase segments as {idx, startPct, widthPct} for the
  // continuous gate-chart bar — each segment's width is proportional to how
  // many of the project's milestones fall under that phase, so a project
  // whose milestones cluster in "Detail Dev." gets a wider Detail Dev.
  // segment, matching how the reference PPT chart's bar widths vary.
  function computePhaseSegments(total){
    const counts = [0,0,0,0,0,0];
    for(let i=0;i<total;i++) counts[milestonePhaseIdx(i,total)]++;
    let cursor = 0;
    return counts.map((c,idx)=>{
      const widthPct = total ? (c/total)*100 : (100/6);
      const seg = { idx, startPct:cursor, widthPct };
      cursor += widthPct;
      return seg;
    });
  }

  // ============================================================
  //  TOPIC DETAIL CONTENT — each of the 15 Project Readiness Tracker
  //  topics gets a full detail screen when clicked. Rather than hand
  //  authoring unique content for all 35 projects x 15 topics, each
  //  topic NAME maps to one of a handful of detail "shapes" (a
  //  failure-mode table, a checklist, a BOM table, etc.), and the
  //  generator fills that shape with the PROJECT's own real name,
  //  code, CPM, and part-number style so it still reads as genuinely
  //  relevant to that specific project rather than generic filler.
  // ============================================================

  // Derives a short part-number-style prefix from the project's code
  // (e.g. "VE6315" -> "6315"), used to build plausible-looking part/
  // station numbers inside the generated detail tables.
  function projPartPrefix(p){
    const m = /(\d{3,5})/.exec(p.code || "");
    return m ? m[1] : "000";
  }

  function detailHeader(p, t){
    return `
      <div class="topic-detail-header">
        <div class="topic-detail-meta-row">
          <span><span class="lbl">Project</span>${escapeHtml(p.name)}</span>
          <span><span class="lbl">Code</span>${escapeHtml(p.code)}</span>
          <span><span class="lbl">CPM</span>${escapeHtml(p.cpm)}</span>
          <span><span class="lbl">Plan</span>${escapeHtml(t.plan||'—')}</span>
          <span><span class="lbl">Actual</span>${escapeHtml(t.actual||'—')}</span>
          <span class="ryg-dot"><span class="d ${t.status}"></span>${escapeHtml(t.status)}</span>
        </div>
      </div>
    `;
  }

  // ---- shape 1: PFD / PFMEA — process flow + failure mode table ----
  function detailPFD_PFMEA(p){
    const pre = projPartPrefix(p);
    const steps = [
      ["10","Incoming Inspection",`Part mix-up — wrong rev. fitted`,3,2,18],
      ["20","Sub-assembly Fit-up",`Misalignment at weld fixture`,6,3,72],
      ["30","Weld / Joining",`Porosity in weld seam`,7,2,84],
      ["40","Torque & Fastening",`Under-torque on critical joint`,8,2,96],
      ["50","Functional Test",`Sensor signal out of tolerance`,5,3,60],
      ["60","Final Visual / Pack",`Cosmetic defect missed`,2,4,24],
    ];
    const rows = steps.map(([opNo,opName,fm,sev,occ,rpn])=>`
      <tr>
        <td>${pre}-OP${opNo}</td>
        <td>${escapeHtml(opName)}</td>
        <td>${escapeHtml(fm)}</td>
        <td class="num">${sev}</td>
        <td class="num">${occ}</td>
        <td class="num rpn ${rpn>=80?'high':rpn>=40?'med':'low'}">${rpn}</td>
      </tr>
    `).join("");
    return `
      <div class="topic-detail-section">
        <div class="topic-detail-section-title">Process Flow Diagram — ${escapeHtml(p.name)}</div>
        <p class="topic-detail-note">Operation sequence ${pre}-OP10 through ${pre}-OP60, as released for the current build phase.</p>
      </div>
      <div class="topic-detail-section">
        <div class="topic-detail-section-title">PFMEA — Top Failure Modes</div>
        <table class="detail-table">
          <thead><tr><th>Op No.</th><th>Operation</th><th>Potential Failure Mode</th><th>Sev</th><th>Occ</th><th>RPN</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <p class="topic-detail-note">RPN = Severity × Occurrence (Detection factor pending DFMEA cross-check). Items flagged <span class="rpn high">high</span> require a control-plan update before C-Build.</p>
      </div>
    `;
  }

  // ---- shape 2: QA Matrix — characteristic x station inspection matrix ----
  function detailQAMatrix(p){
    const pre = projPartPrefix(p);
    const chars = [
      ["Critical dimension — mounting bore Ø", "CMM", "100%", "G"],
      ["Weld seam strength (pull test)", "Destructive sample", "1/50", "G"],
      ["Torque verification — main joints", "Torque wrench + DataMyte", "100%", "Y"],
      ["Surface finish / paint thickness", "Coating gauge", "1/20", "G"],
      ["Leak test (if applicable)", "Air-leak tester", "100%", "G"],
      ["Final functional check", "Functional test rig", "100%", "Y"],
    ];
    const rows = chars.map(([ch,method,freq,st],i)=>`
      <tr>
        <td>${pre}-QC${String(i+1).padStart(2,'0')}</td>
        <td>${escapeHtml(ch)}</td>
        <td>${escapeHtml(method)}</td>
        <td>${escapeHtml(freq)}</td>
        <td><span class="ryg-dot"><span class="d ${st}"></span>${escapeHtml(st)}</span></td>
      </tr>
    `).join("");
    return `
      <div class="topic-detail-section">
        <div class="topic-detail-section-title">QA Matrix — ${escapeHtml(p.name)}</div>
        <table class="detail-table">
          <thead><tr><th>Char. ID</th><th>Quality Characteristic</th><th>Inspection Method</th><th>Frequency</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <p class="topic-detail-note">Inspection frequencies follow the control plan for ${escapeHtml(p.code)}; any characteristic flagged Yellow is pending gauge R&R sign-off.</p>
      </div>
    `;
  }

  // ---- shape 3: gate sign-off checklist (PRQ Sign off, L2 plan,
  //      Feasibility Study, VDFA, Gate Audit Score, Prodcut Audit
  //      Score, AOS, Phantom Input & Release, Change Detail) ----
  const SIGNOFF_ITEMS = {
    "Change Detail": ["Engineering change request raised", "Impact assessment (cost / timeline / quality) completed", "Cross-functional review sign-off", "Updated drawing/BOM released"],
    "PRQ Sign off": ["Product requirements quality checklist reviewed", "Customer/regulatory requirements mapped", "Design-for-manufacture review completed", "PRQ sign-off by CPM & Quality Head"],
    "L2 plan": ["L2 project schedule baselined", "Resource loading confirmed with ME team", "Critical path milestones identified", "L2 plan published to stakeholders"],
    "Feasibility Study": ["Manufacturing feasibility assessed", "Tooling & fixture feasibility confirmed", "Capacity & cycle-time study completed", "Make-vs-buy decision recorded"],
    "VDFA": ["Vehicle-level DFA checklist completed", "Assembly sequence reviewed with line team", "Ergonomics assessment completed", "VDFA observations logged and closed"],
    "Gate Audit Score": ["Gate audit checklist completed by Quality", "Non-conformances from last audit closed", "Audit score computed and reviewed", "Sign-off by Plant Quality Head"],
    "Prodcut Audit Score": ["Product audit sample plan executed", "Critical-to-quality characteristics verified", "Audit score computed against target", "Corrective actions logged for any miss"],
    "AOS": ["Assembly Operation Sheet drafted", "Standard work time validated on line", "Operator training against AOS completed", "AOS released to production"],
    "Phantom Input & Release": ["Phantom BOM structure created in system", "Engineering release of phantom parts", "ECN cross-check against phantom items", "Phantom-to-real part transition planned"],
  };
  function signoffChecklistHtml(p, topicName){
    const items = SIGNOFF_ITEMS[topicName] || ["Checklist item 1", "Checklist item 2", "Checklist item 3", "Checklist item 4"];
    // deterministic-but-varied completion pattern per project so it doesn't
    // look identical everywhere — based on a simple hash of the project id
    const hash = [...p.id].reduce((s,c)=>s+c.charCodeAt(0),0);
    const rows = items.map((item,i)=>{
      const done = (hash + i) % 4 !== 3; // ~75% checked, last item often pending
      return `
        <li class="signoff-row ${done?'done':'pending'}">
          <span class="signoff-check">${done?'✓':'○'}</span>
          <span>${escapeHtml(item)}</span>
        </li>
      `;
    }).join("");
    return `<ul class="signoff-list">${rows}</ul>`;
  }
  function detailSignoff(p, topicName){
    return `

  // ---- shape 3b: VDFA & NCR Closure — merged section combining the VDFA
  //      sign-off checklist, the editable VDFA/DFA NCR status matrix
  //      (Category x G/Y-P1-3/R-P1-3/Total, matching the reference
  //      PPT-style table), the NCR Closure list (previously its own
  //      separate tracker topic), and an editable Critical Points list.
  //      Cell edits and the Critical Points list are both gated behind
  //      the Control Panel login the same way every other tracker edit
  //      is; see renderNcrTable() for the matrix markup and
  //      bindTopicDetailEvents() for the save/lock wiring. ----
  function detailVDFA(p){
    const locked = !isLoggedIn();

    // NCR Closure list — folded in from the topic that used to live
    // separately; reuses the project's own ncrRows categories so the
    // NCR IDs line up with the matrix above it.
    const pre = projPartPrefix(p);
    const cats = (p.ncrRows && p.ncrRows.length) ? p.ncrRows.map(r=>r.category) : ["Design","Part","Process"];
    const sampleIssues = {
      Design: "Drawing tolerance ambiguity on mating face",
      Part: "Supplier part dimension out of spec",
      Process: "Weld sequence deviation observed on line"
    };
    const hash = [...p.id].reduce((s,c)=>s+c.charCodeAt(0),0);
    const ncrClosureRows = cats.map((cat,i)=>{
      const closed = (hash+i) % 3 !== 0;
      return `
        <tr>
          <td>NCR-${pre}-${String(i+1).padStart(3,'0')}</td>
          <td>${escapeHtml(cat)}</td>
          <td>${escapeHtml(sampleIssues[cat] || "Non-conformance observed during build")}</td>
          <td><span class="ryg-dot"><span class="d ${closed?'G':'R'}"></span>${closed?'Closed':'Open'}</span></td>
        </tr>
      `;
    }).join("");

    // Critical Points list — editable, login-gated, same add/delete
    // pattern as achievements/upcoming/support but namespaced under
    // data-cp-* so its bindings (in bindTopicDetailEvents) stay separate
    // from the project-dashboard list bindings in bindDashboardEvents.
    const cp = p.criticalPoints || [];
    const cpListHtml = !cp.length
      ? `<ul><li style="color:var(--steel-600);font-style:italic;">${locked ? 'Nothing logged yet.' : 'Nothing logged yet — click "add" below.'}</li></ul>`
      : `<ul>
          ${cp.map((txt,i)=>`
            <li data-idx="${i}" ${locked?'class="locked"':''}>
              <span class="ico">⚑</span>
              <span ${locked?'':'contenteditable="true"'} data-cp-field data-idx="${i}">${escapeHtml(txt)}</span>
              ${locked ? '' : `<button class="list-del" data-cp-del data-idx="${i}" title="Remove" style="margin-left:auto;background:none;border:none;color:var(--steel-600);cursor:pointer;font-size:15.5px;">✕</button>`}
            </li>
          `).join("")}
        </ul>`;

    return `

      <div class="topic-detail-section">
        <div class="topic-detail-section-title">NCR Closure — ${escapeHtml(p.name)}</div>
        <table class="detail-table">
          <thead><tr><th>NCR ID</th><th>Category</th><th>Description</th><th>Status</th></tr></thead>
          <tbody>${ncrClosureRows}</tbody>
        </table>
        <p class="topic-detail-note">Cross-references the VDFA Observations log for ${escapeHtml(p.code)}.</p>
      </div>
      <div class="topic-detail-section">
        <div class="topic-detail-section-title">Critical Points</div>
        <div class="list-panel">${cpListHtml}</div>
        ${locked ? '' : `<button class="add-row-btn" data-add-cp>+ Add critical point</button>`}
        <p class="topic-detail-note">${locked ? 'Log in via the Control Panel to add or edit critical points.' : 'Click any point to edit — changes are saved and logged automatically.'}</p>
      </div>
    `;
  }

  const facilityFilterState = {};

        <p class="topic-detail-note">
          Facility/Jig/Fixture/Tools/MHE procurement plan for ${escapeHtml(p.code)} — tracked from RFQ through WCC closure.

  // Generic fallback build tracker data generator (for projects without specific data)
  function generateBuildTrackerRows(p){
    const hash = [...p.id].reduce((s,c)=>s+c.charCodeAt(0),0);
    const pre = projPartPrefix(p);
    const stages = ["B","B","B","B","C","C","C","C","C","P","P","P","SOP"];
    const baseDate = new Date(2024, (hash % 10), 1 + (hash % 28));
    const rows = [];
    let cursor = new Date(baseDate);
    for(let i = 0; i < 13; i++){
      const rollout = new Date(cursor);
      const age = 5 + ((hash + i * 7) % 12);
      const okTag = new Date(rollout.getTime() + age * 86400000);
      const rj = (hash + i * 3) % 4; // 0=part, 1=process, 2=design, 3=ok
      const remark = rj === 0 ? "Part dimension non-conformance" :
                     rj === 1 ? "Process sequence deviation — rework" :
                     rj === 2 ? "Design tolerance update required" :
                                "OK — passed first-off inspection";
      const part    = rj === 0 ? age : 0;
      const process = rj === 1 ? age : (rj === 3 ? Math.floor(age/3) : 0);
      const design  = rj === 2 ? age : (rj === 3 ? Math.floor(age/3) : 0);
      rows.push({
        stage: stages[i] || "SOP",
        rollout: rollout.toISOString().slice(0,10),
        okTag: okTag.toISOString().slice(0,10),
        chassis: `CH-${pre}-${stages[i]||'S'}${String(i+1).padStart(3,'0')}`,
        remark, part, process, design
      });
      cursor = new Date(cursor.getTime() + (age + 3 + (i % 5)) * 86400000);
    }
    return rows;
  }

  function detailBuildTracker(p){
    const rows = BUILD_TRACKER_DATA[p.id] || generateBuildTrackerRows(p);
    // compute age from dates
    function daysBetween(d1, d2){
      try{
        return Math.round((new Date(d2) - new Date(d1)) / 86400000);
      }catch(e){ return "—"; }
    }
    function fmtDate(d){
      if(!d) return "—";
      try{ const dt = new Date(d); return dt.toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}); }
      catch(e){ return d; }
    }
    const tableRows = rows.map((r,i)=>{
      const age = daysBetween(r.rollout, r.okTag);
      const ageNum = typeof age === "number" ? age : 0;
      const ageColor = ageNum <= 7 ? "var(--signal-green)" : ageNum <= 14 ? "var(--amber)" : "var(--safety-red)";
      const isOk = r.remark.toLowerCase().startsWith("ok");
      return `
        <tr style="border-bottom:1px solid var(--steel-800);">
          <td style="padding:8px 10px;white-space:nowrap;">
            <span style="display:inline-block;font-family:var(--font-mono);font-size:13px;font-weight:700;background:var(--steel-800);border:1px solid var(--steel-700);border-radius:4px;padding:2px 8px;">${escapeHtml(r.stage)}</span>
          </td>
          <td style="padding:8px 10px;font-family:var(--font-mono);font-size:13.5px;color:var(--steel-300);white-space:nowrap;">${fmtDate(r.rollout)}</td>
          <td style="padding:8px 10px;font-family:var(--font-mono);font-size:13.5px;color:var(--steel-300);white-space:nowrap;">${fmtDate(r.okTag)}</td>
          <td style="padding:8px 10px;font-family:var(--font-mono);font-size:13.5px;color:var(--steel-400);white-space:nowrap;">${escapeHtml(r.chassis)}</td>
          <td style="padding:8px 10px;text-align:center;">
            <span style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${ageColor};">${ageNum}d</span>
          </td>
          <td style="padding:8px 10px;font-size:14.5px;color:${isOk ? 'var(--signal-green)' : 'var(--steel-300)'};">${escapeHtml(r.remark)}</td>
          <td style="padding:8px 10px;text-align:center;font-family:var(--font-mono);font-size:14px;color:${r.part>0?'var(--safety-red)':'var(--steel-600)'};">${r.part > 0 ? r.part + 'd' : '—'}</td>
          <td style="padding:8px 10px;text-align:center;font-family:var(--font-mono);font-size:14px;color:${r.process>0?'var(--amber)':'var(--steel-600)'};">${r.process > 0 ? r.process + 'd' : '—'}</td>
          <td style="padding:8px 10px;text-align:center;font-family:var(--font-mono);font-size:14px;color:${r.design>0?'var(--info-blue)':'var(--steel-600)'};">${r.design > 0 ? r.design + 'd' : '—'}</td>
        </tr>
      `;
    }).join("");

    return `
      <div class="topic-detail-section">
        <div style="margin-bottom:18px;padding:14px 18px;background:var(--steel-800);border:1px solid var(--steel-700);border-radius:var(--radius-md);border-left:4px solid var(--amber);">
          <div style="font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:0.5px;color:var(--plate);text-transform:uppercase;">${escapeHtml(p.name)}</div>
          <div style="font-family:var(--font-mono);font-size:13.5px;color:var(--steel-400);margin-top:4px;">Build Tracker · ${escapeHtml(p.code)} · CPM: ${escapeHtml(p.cpm)} · ${rows.length} build entries</div>
        </div>
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:14.5px;min-width:880px;">
            <thead>
              <tr style="border-bottom:2px solid var(--steel-700);">
                <th style="text-align:left;padding:9px 10px;font-family:var(--font-mono);font-size:14.5px;letter-spacing:1px;text-transform:uppercase;color:var(--steel-500);">Stage</th>
                <th style="text-align:left;padding:9px 10px;font-family:var(--font-mono);font-size:14.5px;letter-spacing:1px;text-transform:uppercase;color:var(--steel-500);">Rollout</th>
                <th style="text-align:left;padding:9px 10px;font-family:var(--font-mono);font-size:14.5px;letter-spacing:1px;text-transform:uppercase;color:var(--steel-500);">OK Tag</th>
                <th style="text-align:left;padding:9px 10px;font-family:var(--font-mono);font-size:14.5px;letter-spacing:1px;text-transform:uppercase;color:var(--steel-500);">Chassis No.</th>
                <th style="text-align:center;padding:9px 10px;font-family:var(--font-mono);font-size:14.5px;letter-spacing:1px;text-transform:uppercase;color:var(--steel-500);">Age</th>
                <th style="text-align:left;padding:9px 10px;font-family:var(--font-mono);font-size:14.5px;letter-spacing:1px;text-transform:uppercase;color:var(--steel-500);">Remark</th>

  // ---------------- routing ----------------
  function navigate(next){
    state = Object.assign(state, next);
    updateHash();
    render();
    window.scrollTo({top:0, behavior:"smooth"});

  function updateHash(){
    const parts = [];
    if(state.line) parts.push(state.line);
    if(state.classId) parts.push("class-"+state.classId);
    if(state.projectId) parts.push(state.projectId);
    if(state.topicIdx !== null && state.topicIdx !== undefined) parts.push("topic-"+state.topicIdx);
    location.hash = parts.join("/");
  }

  function parseHash(){
    const h = location.hash.replace(/^#/, "");
    if(!h) return {line:null, classId:null, projectId:null, topicIdx:null};
    const parts = h.split("/");
    const line = parts[0] && LINE_INFO[parts[0]] ? parts[0] : null;
    let classId = null, projectId = null, topicIdx = null;
    if(parts[1] && parts[1].startsWith("class-")) classId = parts[1].replace("class-","");
    if(parts[2] && !parts[2].startsWith("topic-")) projectId = parts[2];
    if(parts[3] && parts[3].startsWith("topic-")) topicIdx = parseInt(parts[3].replace("topic-",""),10);
    return {line, classId, projectId, topicIdx};
  }

  function computeDistribution(by){
    const counts = {};
    ["HD","MHD"].forEach(line=>{
      Object.keys(DATA[line]||{}).forEach(cls=>{
        (DATA[line][cls]||[]).forEach(p=>{
          const key = by==="class" ? ("Class "+cls) : (p.cpm || "Unassigned");

        });
      });
    });
    return Object.keys(counts)
      .sort()
      .map((label,i)=>({ label, value:counts[label], color: CHART_PALETTE[i % CHART_PALETTE.length] }));
  }

  function buildPieSlices(dist, cx, cy, r){
    const total = dist.reduce((s,d)=>s+d.value,0);
    if(total===0) return [];

    // Special case: a single category holding 100% share collapses the
    // SVG arc math (start/end angle coincide), so draw a full circle directly.
    if(dist.length === 1){
      return [{
        path: `M${cx-r},${cy} A${r},${r} 0 1 1 ${cx+r},${cy} A${r},${r} 0 1 1 ${cx-r},${cy} Z`,
        color: dist[0].color, label: dist[0].label, value: dist[0].value, pct: 100
      }];
    }

    let angle = -Math.PI/2; // start at top
    return dist.map(d=>{
      const slice = (d.value/total) * Math.PI * 2;
      const x1 = cx + r*Math.cos(angle);
      const y1 = cy + r*Math.sin(angle);
      angle += slice;
      const x2 = cx + r*Math.cos(angle);
      const y2 = cy + r*Math.sin(angle);
      const largeArc = slice > Math.PI ? 1 : 0;
      const path = `M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
      return { path, color:d.color, label:d.label, value:d.value, pct: Math.round((d.value/total)*100) };
    });
  }

  // ============================================================
  //  SCREEN 2 — CLASS SELECT
  // ============================================================
  function renderClassSelect(){
    const info = LINE_INFO[state.line];

    // Build flat list of ALL projects across all classes for this line
    const allProjects = [];
    ["1","2","3"].forEach(cls => {
      (getProjects(state.line, cls)||[]).forEach(p => {
        allProjects.push({ p, cls });
      });
    });

    // Derive "major change" label from topics (first D-group topic) or milestones
    function majorChange(p){
      const dt = (p.topics||[]).find(t=>t.group==="D");
      if(dt) return dt.topic;
      const qt = (p.topics||[]).find(t=>t.group==="Q");
      if(qt) return qt.topic;
      if(p.milestones && p.milestones.length){
        const active = p.milestones.find(m=>m.active);
        return active ? "Active gate: " + active.label : p.milestones[0].label;
      }
      return "—";
    }

    // Extract short vehicle name (before parentheses or descriptor)
    function vehicleName(name){
      return name.replace(/\s*\(.*?\)\s*/g,"").trim() || name;
    }

    app.innerHTML = `
      <section class="screen">
        <div class="section-head" style="align-items:flex-start;">
          <div>
            <h2 class="section-title">${state.line} <span class="accent">— Projects</span></h2>
            <span class="section-hint">${info.full}</span>
          </div>
          <!-- Class count summary pills -->
          <div class="class-count-strip">
            ${["1","2","3"].map(c=>{
              const count = countAll(state.line, c);
              return `<button class="class-count-pill ${count===0?'empty':''}" data-class="${c}">
                <span class="class-count-pill-num">${count}</span>
                <span class="class-count-pill-label">Class ${c}</span>
              </button>`;
            }).join("")}
          </div>
        </div>

        <!-- Project matrix table -->
        <div class="panel project-matrix-panel">
          <div class="panel-head">
            <div class="panel-title">All Projects</div>
            <span class="chip">${allProjects.length} total</span>
          </div>
          <div class="project-matrix-wrap">
            <table class="project-matrix-table">
              <thead>
                <tr>
                  <th>Vehicle / Project</th>
                  <th>Class</th>
                  <th>Major Change / Active Development</th>
                  <th>CPM</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${allProjects.length ? allProjects.map(({p, cls})=>`
                  <tr class="project-matrix-row" data-id="${p.id}" data-class="${cls}" title="Open ${escapeHtml(p.name)}">
                    <td class="pmt-name">
                      <span class="pmt-vehicle">${escapeHtml(vehicleName(p.name))}</span>
                      ${p.code && p.code!=="—" ? `<span class="pmt-code">${escapeHtml(p.code)}</span>` : ""}
                    </td>
                    <td class="pmt-class"><span class="pmt-class-badge">${cls}</span></td>
                    <td class="pmt-change">${escapeHtml(majorChange(p))}</td>
                    <td class="pmt-cpm">${escapeHtml(p.cpm||"—")}</td>
                    <td class="pmt-status"><span class="status-pill ${p.status}" style="display:inline-block;"></span><span class="pmt-status-label">${statusLabel(p.status)}</span></td>
                  </tr>
                `).join("") : `
                  <tr><td colspan="5" style="text-align:center;color:var(--steel-500);font-style:italic;padding:24px;">No projects in ${state.line} yet.</td></tr>
                `}
              </tbody>
            </table>
          </div>
        </div>
      </section>
    `;
    // Class count pills navigate to class filter (go to project list for that class)
    app.querySelectorAll(".class-count-pill[data-class]").forEach(pill=>{
      pill.addEventListener("click", ()=> navigate({classId:pill.dataset.class}));
    });
    // Matrix rows navigate directly into the project
    app.querySelectorAll(".project-matrix-row").forEach(row=>{
      row.addEventListener("click", ()=> navigate({classId:row.dataset.class, projectId:row.dataset.id}));
    });
  }

  //  SCREEN 3 — PROJECT LIST
  // ============================================================

    app.innerHTML = `

  function rowHtml(p){
    const ncrTotal = sumNcr(p.ncrRows);
    const b = projectBudgetSummary(p);
    const pct = percentComplete(p);
    return `
      <div class="project-row" data-id="${p.id}" data-status="${p.status}">
        <span class="status-pill ${p.status}"></span>
        <div>
          <div class="project-row-name">${escapeHtml(p.name)} ${b.overBudget ? '<span class="overbudget-chip">OVER</span>' : ''}</div>
          <div class="project-row-sub">CODE ${escapeHtml(p.code||'—')} · CPM ${escapeHtml(p.cpm||'—')}</div>
        </div>
        <div class="project-row-field"><span class="lbl">Open NCR</span>${ncrTotal.r}/${ncrTotal.total}</div>
        <div class="project-row-field always-show"><span class="lbl">Budget Used</span>${formatINRShort(b.used)} / ${formatINRShort(b.allocated)}</div>
        <div class="project-row-pct" title="${pct}% complete">
          <svg class="pct-ring" viewBox="0 0 36 36" width="34" height="34">
            <circle class="pct-ring-bg" cx="18" cy="18" r="15.5" />
            <circle class="pct-ring-fg ${pct>=100?'done':pct>=50?'mid':'low'}" cx="18" cy="18" r="15.5"
              stroke-dasharray="${(pct/100*97.4).toFixed(1)} 97.4" />
          </svg>
          <span class="pct-ring-label">${pct}%</span>
        </div>
        <span class="project-row-arrow">→</span>
      </div>
    `;

  function sumNcr(rows){
    let total=0, r=0;
    (rows||[]).forEach(row=>{
      total += row.total||0;
      r += (row.R||[]).reduce((a,b)=>a+b,0);
    });
    return {total, r};
  }

  function emptyStateHtml(){
    return `
      <div class="empty-state">
        <div class="empty-state-title">No projects yet</div>
        <div class="empty-state-sub">There are no NPI projects logged for this class. Add one to start tracking its timeline, quality gates and NCRs.</div>
        <button class="btn-ghost" data-add-project>+ Add Project</button>
      </div>
    `;
  }

  function createNewProject(){
    openAddProjectModal(state.line, state.classId);
  }

  // ---------------- modal dialog: add spend entry ----------------
  const modalOverlay = document.getElementById("modalOverlay");

  function closeModal(){
    modalOverlay.classList.remove("show");
    modalOverlay.innerHTML = "";
  }
  modalOverlay.addEventListener("click", (e)=>{
    if(e.target === modalOverlay) closeModal();
  });
  window.addEventListener("keydown", (e)=>{
    if(e.key === "Escape" && modalOverlay.classList.contains("show")) closeModal();
  });

  function openSpendEntryDialog(p){
    const today = new Date().toISOString().slice(0,10);
    modalOverlay.innerHTML = `
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="Add spend entry">
        <div class="modal-head">
          <span>Add Spend Entry</span>
          <button class="modal-close" data-modal-close aria-label="Close">✕</button>
        </div>
        <div class="modal-body">
          <label class="modal-field">
            <span>Date</span>
            <input type="date" id="spendDate" value="${today}">
          </label>
          <label class="modal-field">
            <span>Amount (₹)</span>
            <input type="number" id="spendAmount" min="0" step="1000" placeholder="e.g. 250000">
          </label>
          <label class="modal-field">
            <span>Category</span>
            <select id="spendCategory">
              ${SPEND_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("")}
            </select>
          </label>
          <label class="modal-field">
            <span>Type</span>
            <select id="spendType">
              <option value="spent">Spent (already paid out)</option>
              <option value="committed">Committed (PO raised / promised, not yet paid)</option>
            </select>
          </label>
          <label class="modal-field">
            <span>Note <span class="modal-field-optional">(PO number, vendor, etc.)</span></span>
            <input type="text" id="spendNote" placeholder="e.g. PO #EIC-4471 – fixture tooling">
          </label>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" data-modal-close>Cancel</button>
          <button class="btn-primary" id="spendSaveBtn">Add Entry</button>
        </div>
      </div>
    `;
    modalOverlay.classList.add("show");
    modalOverlay.querySelectorAll("[data-modal-close]").forEach(btn=>{
      btn.addEventListener("click", closeModal);
    });
    document.getElementById("spendSaveBtn").addEventListener("click", ()=>{
      const date = document.getElementById("spendDate").value;
      const amount = parseFloat(document.getElementById("spendAmount").value);
      const category = document.getElementById("spendCategory").value;
      const type = document.getElementById("spendType").value;
      const note = document.getElementById("spendNote").value.trim();

      if(!date){ showToast("Pick a date"); return; }
      if(isNaN(amount) || amount <= 0){ showToast("Enter a valid amount"); return; }

      if(!p.budget) p.budget = { allocated:0, spendLog:[] };
      p.budget.spendLog.push({
        id: "sl-" + Date.now(),
        date, amount: Math.round(amount), category, type, note
      });
      logChange(p, "Spend entry added", "—", `${category} – ${formatINRShort(Math.round(amount))}${note ? ' ('+note+')' : ''}`);
      saveData();
      closeModal();
      renderProjectDashboard(p);
      showToast("Spend entry added");
    });
  }

  // ============================================================
  //  SCREEN 3.5 — TOPIC DETAIL (full-screen takeover, opened from a
  //  Project Readiness Tracker card)
  // ============================================================
  function renderTopicDetail(p, topicIdx){
    const t = p.topics[topicIdx];
    const locked = !isLoggedIn();
    app.innerHTML = `
      <section class="screen topic-detail-screen">
        <div class="dash-header">
          <div class="dash-title-block">
            <div class="eyebrow">${state.line} · Class ${state.classId} · ${escapeHtml(p.code||'—')} · Project Readiness Tracker</div>
            <h2 class="dash-title editable-title ${locked?'locked':''}" ${locked?'':'contenteditable="true"'} data-topic-detail-name title="${locked ? 'Log in to rename' : 'Click to rename'}">${escapeHtml(t.topic)}</h2>
          </div>
          <span class="ryg-dot lg"><span class="d ${t.status}"></span>${escapeHtml(t.status)}</span>
        </div>

        <div class="panel topic-detail-panel">
          ${detailHeader(p, t)}
          ${renderTopicDetailContent(p, t)}
        </div>
      </section>
    `;

    // back handled by topbar back button

    // section name, editable from the full-screen detail header too —
    // mirrors the rename control on the tracker grid card so either entry
    // point keeps the section's display label in sync.
    const detailNameEl = app.querySelector("[data-topic-detail-name]");
    if(detailNameEl){
      if(detailNameEl.classList.contains("locked")){
        detailNameEl.addEventListener("click", ()=>{
          showLoginModal(()=> renderTopicDetail(p, topicIdx));
        });
      } else {
        const before = detailNameEl.textContent.trim();
        detailNameEl.addEventListener("blur", ()=>{
          const newName = detailNameEl.textContent.trim();
          if(newName && newName !== before){
            if(!t.custom){
              if(!p.renamedTopics) p.renamedTopics = {};
              p.renamedTopics[t.key || before] = newName;
            }
            logChange(p, "Section renamed", before, newName);
            t.topic = newName;
            saveData();
            showToast("Section renamed");
            renderTopicDetail(p, topicIdx);
          } else if(!newName){
            detailNameEl.textContent = before;
          }
        });
        detailNameEl.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); detailNameEl.blur(); } });
      }
    }

    bindTopicDetailEvents(p, t, topicIdx);
  }

  // Event bindings for content rendered inside the full-screen topic
  // detail view (renderTopicDetail). Currently wires up the two editable
  // matrices that live there: the VDFA/DFA NCR status table (rendered via
  // renderNcrTable for the VDFA topic) and the Facility Tracker matrix
  // (rendered via detailFacilityTracker). Both follow the same
  // login-gated, history-logged pattern used throughout the rest of the
  // dashboard — re-rendering renderTopicDetail() after each save keeps
  // the screen's own numbers (e.g. NCR totals, facility status counts)
  // in sync immediately.
  function bindTopicDetailEvents(p, t, topicIdx){
    // ---- VDFA / DFA NCR status matrix ----
    app.querySelectorAll('.ncr-table [data-ncr-field]').forEach(el=>{
      if(el.classList.contains("locked")){
        el.addEventListener("click", ()=>{
          showLoginModal(()=> renderTopicDetail(p, topicIdx));
        });
        return;
      }
      el.addEventListener("blur", ()=>{
        const tr = el.closest("tr");
        const idx = parseInt(tr.dataset.ncrIdx,10);
        const field = el.dataset.ncrField;
        const val = parseInt(el.textContent.trim(),10) || 0;
        const row = p.ncrRows[idx];
        const before = field==="G" ? row.G : field.startsWith("Y") ? row.Y[parseInt(field[1],10)] : row.R[parseInt(field[1],10)];
        if(before === val) return;
        if(field==="G") row.G = val;
        else if(field.startsWith("Y")) row.Y[parseInt(field[1],10)] = val;
        else if(field.startsWith("R")) row.R[parseInt(field[1],10)] = val;
        row.total = row.G + row.Y.reduce((a,b)=>a+b,0) + row.R.reduce((a,b)=>a+b,0);
        logChange(p, `NCR ${row.category} ${field}`, before, val);
        saveData();
        showToast("NCR count updated");
        renderTopicDetail(p, topicIdx);
      });
      el.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
    });

    // ---- Critical Points list (inside VDFA & NCR Closure) ----
    app.querySelectorAll('[data-cp-field]').forEach(el=>{
      if(el.closest("li").classList.contains("locked")){
        el.addEventListener("click", ()=> showLoginModal(()=> renderTopicDetail(p, topicIdx)));
        return;
      }
      const idx = parseInt(el.dataset.idx,10);
      const before = el.textContent.trim();
      el.addEventListener("blur", ()=>{
        const newVal = el.textContent.trim();
        if(!p.criticalPoints) p.criticalPoints = [];
        if(newVal && newVal !== before){
          logChange(p, "Critical point", before, newVal);
          p.criticalPoints[idx] = newVal;
          saveData();
          showToast("Critical point updated");
          renderTopicDetail(p, topicIdx);
        } else if(!newVal){
          el.textContent = before;
        }
      });
      el.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
    });
    app.querySelectorAll('[data-cp-del]').forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const idx = parseInt(btn.dataset.idx,10);
        if(!p.criticalPoints) return;
        const removed = p.criticalPoints[idx];
        logChange(p, "Critical point removed", removed, "(removed)");
        p.criticalPoints.splice(idx,1);
        saveData();
        showToast("Critical point removed");
        renderTopicDetail(p, topicIdx);
      });
    });
    const addCpBtn = app.querySelector("[data-add-cp]");
    if(addCpBtn){
      addCpBtn.addEventListener("click", ()=> withAuth(()=>{
        if(!p.criticalPoints) p.criticalPoints = [];
        p.criticalPoints.push("New critical point — click to edit");
        logChange(p, "Critical point added", "—", "New critical point — click to edit");
        saveData();
        showToast("Critical point added");
        renderTopicDetail(p, topicIdx);
      }));
    }

    // ---- Facility Tracker matrix ----
    if(!p.facilityTracker) return;

    // header column filters (Facility / Status) — view-only, never touches
    // the underlying data or history; re-rendering the topic detail screen
    // re-applies the (in-memory) filter state held in facilityFilterState.
    app.querySelectorAll('[data-ft-filter]').forEach(sel=>{
      sel.addEventListener("change", ()=>{
        const filter = getFacilityFilter(p.id);
        filter[sel.dataset.ftFilter] = sel.value;
        renderTopicDetail(p, topicIdx);
      });
      sel.addEventListener("click", e=> e.stopPropagation());
    });
    const clearFilterBtn = app.querySelector("[data-ft-filter-clear]");
    if(clearFilterBtn){
      clearFilterBtn.addEventListener("click", ()=>{
        const filter = getFacilityFilter(p.id);
        filter.facility = ""; filter.status = "";
        renderTopicDetail(p, topicIdx);
      });
    }

    app.querySelectorAll('[data-ft-field].editable-cell').forEach(el=>{
      if(el.classList.contains("locked")){
        el.addEventListener("click", ()=> showLoginModal(()=> renderTopicDetail(p, topicIdx)));
        return;
      }
      el.addEventListener("blur", ()=>{
        const tr = el.closest("tr");
        const idx = parseInt(tr.dataset.ftIdx,10);
        const row = p.facilityTracker[idx];
        if(!row) return;
        const field = el.dataset.ftField;
        let newVal = el.textContent.trim();
        if(field === "costMINR" || field === "leadTimeWeeks"){
          const num = parseFloat(newVal);
          newVal = isNaN(num) ? row[field] : num;
        }
        const before = row[field];
        if(String(before) === String(newVal)) return;
        row[field] = newVal;
        logChange(p, `Facility entry — ${field}`, before, newVal);
        saveData();
        showToast("Facility entry updated");
        renderTopicDetail(p, topicIdx);
      });
      el.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
    });

    app.querySelectorAll('select[data-ft-field]').forEach(sel=>{
      if(sel.disabled){
        sel.addEventListener("click", ()=> showLoginModal(()=> renderTopicDetail(p, topicIdx)));
        return;
      }
      sel.addEventListener("change", ()=>{
        const tr = sel.closest("tr");
        const idx = parseInt(tr.dataset.ftIdx,10);
        const row = p.facilityTracker[idx];
        if(!row) return;
        const field = sel.dataset.ftField;
        const before = row[field];
        if(before === sel.value) return;
        row[field] = sel.value;
        logChange(p, `Facility entry — ${field}`, before, sel.value);
        saveData();
        showToast("Facility entry updated");
        renderTopicDetail(p, topicIdx);
      });
    });

    app.querySelectorAll('input.ft-date-input[data-ft-field]').forEach(inp=>{
      if(inp.disabled){
        inp.addEventListener("click", ()=> showLoginModal(()=> renderTopicDetail(p, topicIdx)));
        return;
      }
      inp.addEventListener("change", ()=>{
        const tr = inp.closest("tr");
        const idx = parseInt(tr.dataset.ftIdx,10);
        const row = p.facilityTracker[idx];
        if(!row) return;
        const field = inp.dataset.ftField;
        const before = row[field] || "";
        if(before === inp.value) return;
        row[field] = inp.value;
        logChange(p, `Facility entry — ${field}`, before||'—', inp.value||'—');
        saveData();
        showToast("Facility entry updated");
        renderTopicDetail(p, topicIdx);
      });
    });

    const addFtBtn = app.querySelector("[data-add-facility-row]");
    if(addFtBtn){
      addFtBtn.addEventListener("click", ()=> withAuth(()=>{
        const pre = projPartPrefix(p);
        const nextNum = p.facilityTracker.length + 1;
        p.facilityTracker.push({
          id: `ft-${pre}-${String(nextNum).padStart(2,'0')}-${Date.now()}`,
          operation: `ST-${nextNum*10} New Operation`,
          facility: "Fixture", costMINR: 0, leadTimeWeeks: 0,
          rfq:"", ipr:"", po:"", mfg:"", ic:"", validation:"",
          paymentRelease:"", handover:"", wccClosure:"", status:"Open",
        });
        logChange(p, "Facility entry added", "—", `Row ${nextNum}`);
        saveData();
        showToast("Facility entry added");
        renderTopicDetail(p, topicIdx);
      }));
    }

    app.querySelectorAll('[data-ft-del-idx]').forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const idx = parseInt(btn.dataset.ftDelIdx,10);
        const row = p.facilityTracker[idx];
        if(!row) return;
        if(!confirm(`Remove the "${row.operation}" facility entry? This cannot be undone.`)) return;
        logChange(p, "Facility entry removed", row.operation, "(removed)");
        p.facilityTracker.splice(idx,1);
        saveData();
        showToast("Facility entry removed");
        renderTopicDetail(p, topicIdx);
      });
    });
  }
