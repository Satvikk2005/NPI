            ${["1", "2", "3"]
              .map((c) => {
                const count = countAll(state.line, c);
                return `<button class="class-count-pill ${count === 0 ? "empty" : ""}" data-class="${c}">
                <span class="class-count-pill-num">${count}</span>
                <span class="class-count-pill-label">Class ${c}</span>
              </button>`;
              })
              .join("")}
          </div>
        </div>

        <!-- Project matrix table -->
        <div class="panel project-matrix-panel">
          <div class="panel-head">
            <div class="panel-title">All Projects</div>
            <span class="chip">${allProjects.length} total</span>
          </div>
          <div class="project-matrix-wrap">
            <table class="project-matrix-table">
              <thead>
                <tr>
                  <th>Vehicle / Project</th>
                  <th>Class</th>
                  <th>Major Change / Active Development</th>
                  <th>CPM</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                ${
                  allProjects.length
                    ? allProjects
                        .map(
                          ({ p, cls }) => `
                  <tr class="project-matrix-row" data-id="${p.id}" data-class="${cls}" title="Open ${escapeHtml(p.name)}">
                    <td class="pmt-name">
                      <span class="pmt-vehicle">${escapeHtml(vehicleName(p.name))}</span>
                      ${p.code && p.code !== "—" ? `<span class="pmt-code">${escapeHtml(p.code)}</span>` : ""}
                    </td>
                    <td class="pmt-class"><span class="pmt-class-badge">${cls}</span></td>
                    <td class="pmt-change">${escapeHtml(majorChange(p))}</td>
                    <td class="pmt-cpm">${escapeHtml(p.cpm || "—")}</td>
                    <td class="pmt-status"><span class="status-pill ${p.status}" style="display:inline-block;"></span><span class="pmt-status-label">${statusLabel(p.status)}</span></td>
                  </tr>
                `,
                        )
                        .join("")
                    : `
                  <tr><td colspan="5" style="text-align:center;color:var(--steel-500);font-style:italic;padding:24px;">No projects in ${state.line} yet.</td></tr>
                `
                }
              </tbody>
            </table>
          </div>
        </div>
      </section>
    `;
          // Class count pills navigate to class filter (go to project list for that class)
          app
            .querySelectorAll(".class-count-pill[data-class]")
            .forEach((pill) => {
              pill.addEventListener("click", () =>
                navigate({ classId: pill.dataset.class }),
              );
            });
          // Matrix rows navigate directly into the project
          app.querySelectorAll(".project-matrix-row").forEach((row) => {
            row.addEventListener("click", () =>
              navigate({
                classId: row.dataset.class,
                projectId: row.dataset.id,
              }),
            );
          });
        }

        // ============================================================
        //  SCREEN 3 — PROJECT LIST
        // ============================================================
        function renderProjectList() {
          const projects = getProjects(state.line, state.classId);
          app.innerHTML = `
      <section class="screen">
        <div class="section-head">
          <h2 class="section-title">${state.line} Class ${state.classId} <span class="accent">— Projects</span></h2>
          <span class="section-hint">${CLASS_INFO[state.classId].desc}</span>
        </div>
        ${projects.length ? `<div class="project-list">${projects.map(rowHtml).join("")}</div>` : emptyStateHtml()}
      </section>
    `;
          app.querySelectorAll(".project-row").forEach((row) => {
            row.addEventListener("click", () =>
              navigate({ projectId: row.dataset.id }),
            );
          });
          const addBtn = app.querySelector("[data-add-project]");
          if (addBtn)
            addBtn.addEventListener("click", () => withAuth(createNewProject));
        }

        function rowHtml(p) {
          const ncrTotal = sumNcr(p.ncrRows);
          const b = projectBudgetSummary(p);
          const pct = percentComplete(p);
          return `
      <div class="project-row" data-id="${p.id}" data-status="${p.status}">
        <span class="status-pill ${p.status}"></span>
        <div>
          <div class="project-row-name">${escapeHtml(p.name)} ${b.overBudget ? '<span class="overbudget-chip">OVER</span>' : ""}</div>
          <div class="project-row-sub">CODE ${escapeHtml(p.code || "—")} · CPM ${escapeHtml(p.cpm || "—")}</div>
        </div>
        <div class="project-row-field"><span class="lbl">Open NCR</span>${ncrTotal.r}/${ncrTotal.total}</div>
        <div class="project-row-field always-show"><span class="lbl">Budget Used</span>${formatMINR(b.used)} / ${formatMINR(b.allocated)}</div>
        <div class="project-row-pct" title="${pct}% complete">
          <svg class="pct-ring" viewBox="0 0 36 36" width="34" height="34">
            <circle class="pct-ring-bg" cx="18" cy="18" r="15.5" />
            <circle class="pct-ring-fg ${pct >= 100 ? "done" : pct >= 50 ? "mid" : "low"}" cx="18" cy="18" r="15.5"
              stroke-dasharray="${((pct / 100) * 97.4).toFixed(1)} 97.4" />
          </svg>
          <span class="pct-ring-label">${pct}%</span>
        </div>
        <span class="project-row-arrow">→</span>
      </div>
    `;
        }

        function sumNcr(rows) {
          let total = 0,
            r = 0;
          (rows || []).forEach((row) => {
            total += row.total || 0;
            r += (row.R || []).reduce((a, b) => a + b, 0);
          });
          return { total, r };
        }

        function emptyStateHtml() {
          return `
      <div class="empty-state">
        <div class="empty-state-title">No projects yet</div>
        <div class="empty-state-sub">There are no NPI projects logged for this class. Add one to start tracking its timeline, quality gates and NCRs.</div>
        <button class="btn-ghost" data-add-project>+ Add Project</button>
      </div>
    `;
        }

        function createNewProject() {
          openAddProjectModal(state.line, state.classId);
        }

        // ---------------- modal dialog: add spend entry ----------------
        const modalOverlay = document.getElementById("modalOverlay");

        function closeModal() {
          modalOverlay.classList.remove("show");
          modalOverlay.innerHTML = "";
        }
        modalOverlay.addEventListener("click", (e) => {
          if (e.target === modalOverlay) closeModal();
        });
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && modalOverlay.classList.contains("show"))
            closeModal();
        });

        function openSpendEntryDialog(p) {
          const today = new Date().toISOString().slice(0, 10);
          modalOverlay.innerHTML = `
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="Add spend entry">
        <div class="modal-head">
          <span>Add Spend Entry</span>
          <button class="modal-close" data-modal-close aria-label="Close">✕</button>
        </div>
        <div class="modal-body">
          <label class="modal-field">
            <span>Date</span>
            <input type="date" id="spendDate" value="${today}">
          </label>
          <label class="modal-field">
            <span>Amount (₹)</span>
            <input type="number" id="spendAmount" min="0" step="1000" placeholder="e.g. 250000">
          </label>
          <label class="modal-field">
            <span>Category</span>
            <select id="spendCategory">
              ${SPEND_CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join("")}
            </select>
          </label>
          <label class="modal-field">
            <span>Type</span>
            <select id="spendType">
              <option value="spent">Spent (already paid out)</option>
              <option value="committed">Committed (PO raised / promised, not yet paid)</option>
            </select>
          </label>
          <label class="modal-field">
            <span>Note <span class="modal-field-optional">(PO number, vendor, etc.)</span></span>
            <input type="text" id="spendNote" placeholder="e.g. PO #EIC-4471 – fixture tooling">
          </label>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" data-modal-close>Cancel</button>
          <button class="btn-primary" id="spendSaveBtn">Add Entry</button>
        </div>
      </div>
    `;
          modalOverlay.classList.add("show");
          modalOverlay.querySelectorAll("[data-modal-close]").forEach((btn) => {
            btn.addEventListener("click", closeModal);
          });
          document
            .getElementById("spendSaveBtn")
            .addEventListener("click", () => {
              const date = document.getElementById("spendDate").value;
              const amount = parseFloat(
                document.getElementById("spendAmount").value,
              );
              const category = document.getElementById("spendCategory").value;
              const type = document.getElementById("spendType").value;
              const note = document.getElementById("spendNote").value.trim();

              if (!date) {
                showToast("Pick a date");
                return;
              }
              if (isNaN(amount) || amount <= 0) {
                showToast("Enter a valid amount");
                return;
              }

              if (!p.budget) p.budget = { allocated: 0, spendLog: [] };
              p.budget.spendLog.push({
                id: "sl-" + Date.now(),
                date,
                amount: Math.round(amount),
                category,
                type,
                note,
              });
              logChange(
                p,
                "Spend entry added",
                "—",
                `${category} – ${formatMINR(Math.round(amount))}${note ? " (" + note + ")" : ""}`,
              );
              saveData();
              closeModal();
              renderProjectDashboard(p);
              showToast("Spend entry added");
            });
        }

        // ============================================================
        //  SCREEN 3.5 — TOPIC DETAIL (full-screen takeover, opened from a
        //  Manufacturing Readiness card)
        // ============================================================
        function renderTopicDetail(p, topicIdx) {
          const t = p.topics[topicIdx];
          const locked = !isLoggedIn();
          app.innerHTML = `
      <section class="screen topic-detail-screen">
        <div class="dash-header">
          <div class="dash-title-block">
            <div class="eyebrow">${state.line} · Class ${state.classId} · ${escapeHtml(p.code || "—")} · Manufacturing Readiness</div>
            <h2 class="dash-title editable-title ${locked ? "locked" : ""}" ${locked ? "" : 'contenteditable="true"'} data-topic-detail-name title="${locked ? "Log in to rename" : "Click to rename"}">${escapeHtml(t.topic)}</h2>
          </div>
          <div class="dash-header-actions">
            <div class="topic-file-btns">
              <button class="btn-ghost" data-add-file>+ Add file</button>
              <button class="btn-danger" data-delete-file ${t.file ? "" : "disabled"}>Delete file</button>
            </div>
            <span class="ryg-dot lg"><span class="d ${t.status}"></span>${escapeHtml(t.status)}</span>
          </div>
          <input type="file" data-file-input style="display:none" />
        </div>

        <div class="panel topic-detail-panel">
          ${detailHeader(p, t)}
          ${renderTopicFileSection(t)}
          ${renderTopicDetailContent(p, t)}
        </div>
      </section>
    `;

          // back handled by topbar back button

          // section name, editable from the full-screen detail header too —
          // mirrors the rename control on the tracker grid card so either entry
          // point keeps the section's display label in sync.
          const detailNameEl = app.querySelector("[data-topic-detail-name]");
          if (detailNameEl) {
            if (detailNameEl.classList.contains("locked")) {
              detailNameEl.addEventListener("click", () => {
                showLoginModal(() => renderTopicDetail(p, topicIdx));
              });
            } else {
              const before = detailNameEl.textContent.trim();
              detailNameEl.addEventListener("blur", () => {
                const newName = detailNameEl.textContent.trim();
                if (newName && newName !== before) {
                  if (!t.custom) {
                    if (!p.renamedTopics) p.renamedTopics = {};
                    p.renamedTopics[t.key || before] = newName;
                  }
                  logChange(p, "Section renamed", before, newName);
                  t.topic = newName;
                  saveData();
                  showToast("Section renamed");
                  renderTopicDetail(p, topicIdx);
                } else if (!newName) {
                  detailNameEl.textContent = before;
                }
              });
              detailNameEl.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  detailNameEl.blur();
                }
              });
            }
          }

          bindTopicDetailEvents(p, t, topicIdx);
        }

        // Event bindings for content rendered inside the full-screen topic
        // detail view (renderTopicDetail). Currently wires up the two editable
        // matrices that live there: the VDFA/DFA NCR status table (rendered via
        // renderNcrTable for the VDFA topic) and the Facility Tracker matrix
        // (rendered via detailFacilityTracker). Both follow the same
        // login-gated, history-logged pattern used throughout the rest of the
        // dashboard — re-rendering renderTopicDetail() after each save keeps
        // the screen's own numbers (e.g. NCR totals, facility status counts)
        // in sync immediately.
        function bindTopicDetailEvents(p, t, topicIdx) {
          // ---- Attached file (Add / Open / Delete) — available on every
          // Manufacturing Readiness section regardless of its content shape;
          // the file itself is stored as a base64 data URL directly on the
          // topic object so it saves/loads through the same path as every
          // other field on the project.
          const fileInput = app.querySelector("[data-file-input]");
          const addFileBtn = app.querySelector("[data-add-file]");
          if (addFileBtn && fileInput) {
            addFileBtn.addEventListener("click", () => {
              withAuth(() => fileInput.click());
            });
            fileInput.addEventListener("change", () => {
              const file = fileInput.files && fileInput.files[0];
              fileInput.value = ""; // allow re-picking the same file later
              if (!file) return;
              if (file.size > 8 * 1024 * 1024) {
                showToast("File too large to attach (max 8 MB)");
                return;
              }
              const reader = new FileReader();
              reader.onload = () => {
                const before = t.file ? t.file.name : "—";
                t.file = {
                  name: file.name,
                  size: file.size,
                  dataUrl: reader.result,
                  addedAt: new Date().toISOString(),
                };
                logChange(p, `${t.topic} file`, before, file.name);
                saveData();
                showToast("File attached");
                renderTopicDetail(p, topicIdx);
              };
              reader.onerror = () => showToast("Couldn't read that file");
              reader.readAsDataURL(file);
            });
          }
          const deleteFileBtn = app.querySelector("[data-delete-file]");
          if (deleteFileBtn) {
            deleteFileBtn.addEventListener("click", () => {
              if (!t.file) return;
              withAuth(() => {
                if (!confirm(`Remove the attached file "${t.file.name}"?`))
                  return;
                logChange(p, `${t.topic} file`, t.file.name, "—");
                t.file = null;
                saveData();
                showToast("File removed");
                renderTopicDetail(p, topicIdx);
              });
            });
          }
          const openFileBtn = app.querySelector("[data-open-file]");
          if (openFileBtn) {
            openFileBtn.addEventListener("click", () => {
              if (!t.file) return;
              const a = document.createElement("a");
              a.href = t.file.dataUrl;
              a.download = t.file.name;
              a.target = "_blank";
              a.rel = "noopener";
              document.body.appendChild(a);
              a.click();
              a.remove();
            });
          }

          // ---- VDFA / DFA NCR status matrix ----
          app.querySelectorAll(".ncr-table [data-ncr-field]").forEach((el) => {
            if (el.classList.contains("locked")) {
              el.addEventListener("click", () => {
                showLoginModal(() => renderTopicDetail(p, topicIdx));
              });
              return;
            }
            el.addEventListener("blur", () => {
              const tr = el.closest("tr");
              const idx = parseInt(tr.dataset.ncrIdx, 10);
              const field = el.dataset.ncrField;
              const val = parseInt(el.textContent.trim(), 10) || 0;
              const row = p.ncrRows[idx];
              const before =
                field === "G"
                  ? row.G
                  : field.startsWith("Y")
                    ? row.Y[parseInt(field[1], 10)]
                    : row.R[parseInt(field[1], 10)];
              if (before === val) return;
              if (field === "G") row.G = val;
              else if (field.startsWith("Y"))
                row.Y[parseInt(field[1], 10)] = val;
              else if (field.startsWith("R"))
                row.R[parseInt(field[1], 10)] = val;
              row.total =
                row.G +
                row.Y.reduce((a, b) => a + b, 0) +
                row.R.reduce((a, b) => a + b, 0);
              logChange(p, `NCR ${row.category} ${field}`, before, val);
              saveData();
              showToast("NCR count updated");
              renderTopicDetail(p, topicIdx);
            });
            el.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                el.blur();
              }
            });
          });

          // ---- Critical Points list (inside VDFA & NCR Closure) ----
          app.querySelectorAll("[data-cp-field]").forEach((el) => {
            if (el.closest("li").classList.contains("locked")) {
              el.addEventListener("click", () =>
                showLoginModal(() => renderTopicDetail(p, topicIdx)),
              );
              return;
            }
            const idx = parseInt(el.dataset.idx, 10);
            const before = el.textContent.trim();
            el.addEventListener("blur", () => {
              const newVal = el.textContent.trim();
              if (!p.criticalPoints) p.criticalPoints = [];
              if (newVal && newVal !== before) {
                logChange(p, "Critical point", before, newVal);
                p.criticalPoints[idx] = newVal;
                saveData();
                showToast("Critical point updated");
                renderTopicDetail(p, topicIdx);
              } else if (!newVal) {
                el.textContent = before;
              }
            });
            el.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                el.blur();
              }
            });
          });
          app.querySelectorAll("[data-cp-del]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const idx = parseInt(btn.dataset.idx, 10);
              if (!p.criticalPoints) return;
              const removed = p.criticalPoints[idx];
              logChange(p, "Critical point removed", removed, "(removed)");
              p.criticalPoints.splice(idx, 1);
              saveData();
              showToast("Critical point removed");
              renderTopicDetail(p, topicIdx);
            });
          });
          const addCpBtn = app.querySelector("[data-add-cp]");
          if (addCpBtn) {
            addCpBtn.addEventListener("click", () =>
              withAuth(() => {
                if (!p.criticalPoints) p.criticalPoints = [];
                p.criticalPoints.push("New critical point — click to edit");
                logChange(
                  p,
                  "Critical point added",
                  "—",
                  "New critical point — click to edit",
                );
                saveData();
                showToast("Critical point added");
                renderTopicDetail(p, topicIdx);
              }),
            );
          }

          // ---- Facility Tracker matrix ----
          if (!p.facilityTracker) return;

          // header column filters (Facility / Status) — view-only, never touches
          // the underlying data or history; re-rendering the topic detail screen
          // re-applies the (in-memory) filter state held in facilityFilterState.
          app.querySelectorAll("[data-ft-filter]").forEach((sel) => {
            sel.addEventListener("change", () => {
              const filter = getFacilityFilter(p.id);
              filter[sel.dataset.ftFilter] = sel.value;
              renderTopicDetail(p, topicIdx);
            });
            sel.addEventListener("click", (e) => e.stopPropagation());
          });
          const clearFilterBtn = app.querySelector("[data-ft-filter-clear]");
          if (clearFilterBtn) {
            clearFilterBtn.addEventListener("click", () => {
              const filter = getFacilityFilter(p.id);
              filter.facility = "";
              filter.status = "";
              renderTopicDetail(p, topicIdx);
            });
          }

          app
            .querySelectorAll("[data-ft-field].editable-cell")
            .forEach((el) => {
              if (el.classList.contains("locked")) {
                el.addEventListener("click", () =>
                  showLoginModal(() => renderTopicDetail(p, topicIdx)),
                );
                return;
              }
              el.addEventListener("blur", () => {
                const tr = el.closest("tr");
                const idx = parseInt(tr.dataset.ftIdx, 10);
                const row = p.facilityTracker[idx];
                if (!row) return;
                const field = el.dataset.ftField;
                let newVal = el.textContent.trim();
                if (field === "costMINR" || field === "leadTimeWeeks") {
                  const num = parseFloat(newVal);
                  newVal = isNaN(num) ? row[field] : num;
                }
                const before = row[field];
                if (String(before) === String(newVal)) return;
                row[field] = newVal;
                logChange(p, `Facility entry — ${field}`, before, newVal);
                saveData();
                showToast("Facility entry updated");
                renderTopicDetail(p, topicIdx);
              });
              el.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  el.blur();
                }
              });
            });

          app.querySelectorAll("select[data-ft-field]").forEach((sel) => {
            if (sel.disabled) {
              sel.addEventListener("click", () =>
                showLoginModal(() => renderTopicDetail(p, topicIdx)),
              );
              return;
            }
            sel.addEventListener("change", () => {
              const tr = sel.closest("tr");
              const idx = parseInt(tr.dataset.ftIdx, 10);
              const row = p.facilityTracker[idx];
              if (!row) return;
              const field = sel.dataset.ftField;
              const before = row[field];
              if (before === sel.value) return;
              row[field] = sel.value;
              logChange(p, `Facility entry — ${field}`, before, sel.value);
              saveData();
              showToast("Facility entry updated");
              renderTopicDetail(p, topicIdx);
            });
          });

          app
            .querySelectorAll("input.ft-date-input[data-ft-field]")
            .forEach((inp) => {
              if (inp.disabled) {
                inp.addEventListener("click", () =>
                  showLoginModal(() => renderTopicDetail(p, topicIdx)),
                );
                return;
              }
              inp.addEventListener("change", () => {
                const tr = inp.closest("tr");
                const idx = parseInt(tr.dataset.ftIdx, 10);
                const row = p.facilityTracker[idx];
                if (!row) return;
                const field = inp.dataset.ftField;
                const before = row[field] || "";
                if (before === inp.value) return;
                row[field] = inp.value;
                logChange(
                  p,
                  `Facility entry — ${field}`,
                  before || "—",
                  inp.value || "—",
                );
                saveData();
                showToast("Facility entry updated");
                renderTopicDetail(p, topicIdx);
              });
            });

          const addFtBtn = app.querySelector("[data-add-facility-row]");
          if (addFtBtn) {
            addFtBtn.addEventListener("click", () =>
              withAuth(() => {
                const pre = projPartPrefix(p);
                const nextNum = p.facilityTracker.length + 1;
                p.facilityTracker.push({
                  id: `ft-${pre}-${String(nextNum).padStart(2, "0")}-${Date.now()}`,
                  operation: `ST-${nextNum * 10} New Operation`,
                  facility: "Fixture",
                  costMINR: 0,
                  leadTimeWeeks: 0,
                  rfq: "",
                  ipr: "",
                  po: "",
                  mfg: "",
                  ic: "",
                  validation: "",
                  paymentRelease: "",
                  handover: "",
                  wccClosure: "",
                  status: "Open",
                });
                logChange(p, "Facility entry added", "—", `Row ${nextNum}`);
                saveData();
                showToast("Facility entry added");
                renderTopicDetail(p, topicIdx);
              }),
            );
          }

          app.querySelectorAll("[data-ft-del-idx]").forEach((btn) => {
            btn.addEventListener("click", () => {
              const idx = parseInt(btn.dataset.ftDelIdx, 10);
              const row = p.facilityTracker[idx];
              if (!row) return;
              if (
                !confirm(
                  `Remove the "${row.operation}" facility entry? This cannot be undone.`,
                )
              )
                return;
              logChange(
                p,
                "Facility entry removed",
                row.operation,
                "(removed)",
              );
              p.facilityTracker.splice(idx, 1);
              saveData();
              showToast("Facility entry removed");
              renderTopicDetail(p, topicIdx);
            });
          });
        }

        // ============================================================
        //  SCREEN 4 — PROJECT DASHBOARD
        // ============================================================
        function renderProjectDashboard(p) {
          app.innerHTML = `
      <section class="screen">
        <div class="dash-header">
          <div class="dash-title-block">
            <div class="eyebrow">${state.line} · Class ${state.classId} · ${escapeHtml(p.code || "—")}</div>
            <h2 class="dash-title editable-title ${isLoggedIn() ? "" : "locked"}" ${isLoggedIn() ? 'contenteditable="true"' : ""} data-field="name" title="${isLoggedIn() ? "Click to rename" : "Log in to rename"}">${escapeHtml(p.name)}</h2>
          </div>
          <div class="dash-header-actions">
            <div class="topic-file-btns">
              <button class="btn-danger" data-delete-project ${isLoggedIn() ? "" : 'title="Log in to delete this project"'}>Delete project</button>
            </div>
            <div class="status-banner ${p.status}"><span class="pulse"></span> ${statusLabel(p.status)}</div>
          </div>
        </div>

        <div class="meta-strip">
          ${metaCell("CPM", p.cpm, "cpm")}
          ${metaCell("Code", p.code, "code")}
          ${metaCell("EPL", p.epl, "epl")}
          ${metaCell("SOP Target", p.sop, "sop")}
          ${metaCellStatusSelect(p.status)}
          ${metaCellPercent(percentComplete(p))}
          ${metaCellBudget(p)}
        </div>

        ${renderTimeline(p)}

        <div class="panel topic-tracker-panel">
          <div class="panel-head">
            <div class="panel-title">Manufacturing Readiness <span class="chip">Q / D</span></div>
          </div>
          <div class="topic-sections-wrap">
            ${renderTopicSections(p)}
          </div>
          <button class="add-row-btn" data-add-topic>+ Add topic row</button>
        </div>

        <div class="dash-grid-trio">
          <div class="panel list-panel achievements compact-panel">
            <div class="panel-head"><div class="panel-title">✓ Achievements</div></div>
            <div class="compact-panel-body">${renderEditableList(p.achievements, "achievements", "✓")}</div>
            <button class="add-row-btn" data-add-list="achievements">+ Add achievement</button>
          </div>
          <div class="panel list-panel upcoming compact-panel">
            <div class="panel-head"><div class="panel-title">→ Upcoming Activities</div></div>
            <div class="compact-panel-body">${renderEditableList(p.upcoming, "upcoming", "→")}</div>
            <button class="add-row-btn" data-add-list="upcoming">+ Add activity</button>
          </div>
          <div class="panel list-panel support compact-panel">
            <div class="panel-head"><div class="panel-title">⚠ Support Required</div></div>
            <div class="compact-panel-body">${renderEditableList(p.support, "support", "⚠")}</div>
            <button class="add-row-btn" data-add-list="support">+ Add support item</button>
          </div>
        </div>

        ${isLoggedIn() ? renderHistoryPanel(p) : ""}
      </section>
    `;

          bindDashboardEvents(p);
        }

        function statusLabel(s) {
          return s === "Y"
            ? "On Track"
            : s === "R"
              ? "At Risk"
              : s === "G"
                ? "Ahead / Complete"
                : s;
        }

        function metaCell(label, value, field) {
          const locked = !isLoggedIn();
          return `<div class="meta-cell editable ${locked ? "locked" : ""}" data-field="${field}">
      <div class="lbl">${label}</div>
      <div class="val" ${locked ? "" : 'contenteditable="true"'} data-field="${field}">${escapeHtml(value || "—")}</div>
    </div>`;
        }

        function metaCellStatusSelect(status) {
          const locked = !isLoggedIn();
          return `<div class="meta-cell ${locked ? "locked" : ""}">
      <div class="lbl">Status</div>
      <div class="val">
        <select class="ryg-select" data-status-select style="font-size:16px;" ${locked ? "disabled" : ""}>
          <option value="Y" ${status === "Y" ? "selected" : ""}>Y · On Track</option>
          <option value="R" ${status === "R" ? "selected" : ""}>R · At Risk</option>
          <option value="G" ${status === "G" ? "selected" : ""}>G · Ahead</option>
        </select>
      </div>
    </div>`;
        }

        function metaCellBudget(p) {
          const locked = !isLoggedIn();
          const s = projectBudgetSummary(p);
          const minr = s.spent / 1e6;
          const displayVal = s.spent > 0 ? minr.toFixed(2) + " MINR" : "—";
          return `<div class="meta-cell ${locked ? "locked" : ""}" title="${locked ? "Log in to add spend" : "Click to add spend (amount in MINR = Million INR)"}">
      <div class="lbl">Budget</div>
      <div class="val" data-budget-quick-add style="${locked ? "" : "cursor:pointer;"}">${displayVal}${locked ? "" : ' <span style="font-size:12px;color:var(--steel-500);">＋</span>'}</div>
    </div>`;
        }

        function metaCellPercent(pct) {
          const tier = pct >= 100 ? "done" : pct >= 50 ? "mid" : "low";
          return `<div class="meta-cell" title="Average of milestones cleared and readiness sign-offs achieved">
      <div class="lbl">% Complete</div>
      <div class="val meta-pct-val ${tier}">${pct}%</div>
    </div>`;
        }

        function renderDateField(p) {
          const history = p.dateHistory || [];
          const current = p.targetDate || "";
          const histHtml = history.length
            ? `
      <div class="date-history">
        ${history.map((d) => `<span class="date-history-item"><s>${escapeHtml(d)}</s></span>`).join("")}
      </div>`
            : "";
          return `<div class="meta-cell date-field-cell" style="min-width:180px;">
      <div class="lbl">Target Date <span style="font-size:13.5px;color:var(--steel-600);">(editable)</span></div>
      <div class="val" style="display:flex;flex-direction:column;gap:4px;">
        <input type="date" class="date-field-input" data-date-field value="${escapeHtml(current)}" title="Click to change target date">
        ${histHtml}
      </div>
    </div>`;
        }

        // ---- project budget panel ----
        function renderProjectBudgetPanel(p) {
          const s = projectBudgetSummary(p);
          const log = (p.budget && p.budget.spendLog) || [];
          const pctSpent = s.allocated
            ? Math.min(100, (s.spent / s.allocated) * 100)
            : 0;
          const pctCommitted = s.allocated
            ? Math.min(100 - pctSpent, (s.committed / s.allocated) * 100)
            : 0;

          return `
      <div class="panel budget-panel">
        <div class="panel-head">
          <div class="panel-title">💰 Allocation Budget ${s.overBudget ? '<span class="overbudget-chip">OVER BUDGET</span>' : ""}</div>
          <button class="panel-action" data-edit-allocated>Edit allocation</button>
        </div>

        <div class="proj-budget-strip">
          <div class="budget-cell">
            <div class="lbl">Allocated</div>
            <div class="val">${formatINR(s.allocated)}</div>
          </div>
          <div class="budget-cell spent">
            <div class="lbl">Spent</div>
            <div class="val">${formatINR(s.spent)}</div>
          </div>
          <div class="budget-cell committed">
            <div class="lbl">Committed</div>
            <div class="val">${formatINR(s.committed)}</div>
          </div>
          <div class="budget-cell remaining ${s.remaining < 0 ? "negative" : ""}">
            <div class="lbl">Remaining</div>
            <div class="val">${formatINR(s.remaining)}</div>
          </div>
        </div>

        <div class="budget-gauge-wrap">
          <div class="budget-gauge">
            <div class="budget-gauge-fill spent" style="width:${pctSpent}%"></div>
            <div class="budget-gauge-fill committed" style="width:${pctCommitted}%; left:${pctSpent}%"></div>
          </div>
          <div class="budget-gauge-legend">
            <span><span class="dot spent"></span> Spent (${s.pctUsed > 100 ? 100 : Math.round(pctSpent)}%)</span>
            <span><span class="dot committed"></span> Committed</span>
            <span><span class="dot free"></span> Free</span>
            ${s.overBudget ? `<span class="overbudget-text">Exceeds allocation by ${formatINR(Math.abs(s.remaining))}</span>` : ""}
          </div>
        </div>

        <div class="spend-log-head">
          <span class="spend-log-title">Spend Log</span>
          <span class="spend-log-count">${log.length} ${log.length === 1 ? "entry" : "entries"}</span>
        </div>
        <div class="spend-log-table-wrap">
          ${
            log.length
              ? `
          <table class="spend-log-table">
            <thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Type</th><th>Amount</th><th></th></tr></thead>
            <tbody>
              ${log
                .slice()
                .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
                .map(
                  (e) => `
                <tr data-spend-id="${e.id}">
                  <td class="spend-date">${escapeHtml(e.date || "—")}</td>
                  <td><span class="spend-cat-chip">${escapeHtml(e.category)}</span></td>
                  <td class="spend-note">${escapeHtml(e.note || "")}</td>
                  <td><span class="spend-type-chip ${e.type}">${e.type === "committed" ? "Committed" : "Spent"}</span></td>
                  <td class="spend-amount">${formatINR(e.amount)}</td>
                  <td><button class="spend-del-btn" data-del-spend="${e.id}" title="Remove entry">✕</button></td>
                </tr>
              `,
                )
                .join("")}
            </tbody>
          </table>
          `
              : `<div style="color:var(--steel-600);font-style:italic;padding:14px 0;font-size:14.5px;">No spend logged yet — add the first entry below.</div>`
          }
        </div>
        <button class="add-row-btn" data-add-spend>+ Add spend entry</button>
      </div>
    `;
        }

        // ---- timeline ----
        function renderTimeline(p) {
          const ms = p.milestones || [];
          const total = ms.length;
          // Find the last done index so all segments up to that index are highlighted
          let lastDoneIdx = -1;
          ms.forEach((m, i) => {
            if (m.done) lastDoneIdx = i;
          });

          return `
      <div class="timeline-wrap">
        <div class="timeline-title">Project Phase Timeline <span style="font-family:var(--font-mono);font-size:13px;color:var(--steel-500);font-weight:400;margin-left:8px;">${isLoggedIn() ? "— click a phase to mark progress" : ""}</span></div>
        <div class="timeline-gatechart-flat" style="grid-template-columns:repeat(${Math.max(total, 1)}, minmax(82px,1fr));">
          ${
            total
              ? ms
                  .map((m, i) => {
                    const phaseIdx = milestonePhaseIdx(i, total);
                    const hist = splitWeekHistory(m.week);
                    const isHighlighted = i <= lastDoneIdx;
                    const isMajorGate = ["DG", "FDG", "FIG", "LG"].includes(
                      m.label,
                    );
                    return `
            <div class="gatechart-flat-col timeline-phase-col" data-phase-idx="${i}">
              <div class="gatechart-flat-seg phase-${phaseIdx} ${isMajorGate ? "gate-highlight" : ""} ${m.active ? "active" : ""} ${isHighlighted ? "phase-highlighted" : ""} ${isLoggedIn() ? "phase-clickable" : ""}" data-phase="${i}" title="${escapeHtml(m.label)} — ${isLoggedIn() ? "click to toggle progress" : ""}">
              
                ${escapeHtml(m.label)}
                ${isHighlighted ? '<span class="phase-done-tick">✓</span>' : ""}
              </div>
              <div class="milestone-week-block">
                <div class="milestone-week-old ${hist.old[0] ? "" : "week-placeholder"} ${isLoggedIn() ? "timeline-week-editable" : ""}" data-week-slot="first" data-week-idx="${i}" ${isLoggedIn() ? 'contenteditable="true"' : ""}>${escapeHtml(hist.old[0] || "Week 1")}</div>
                <div class="milestone-week ${m.done ? "done" : ""} ${m.risk ? "risk" : ""} ${m.go ? "go" : ""} ${m.active ? "active-week" : ""} ${hist.current ? "" : "week-placeholder"} ${isLoggedIn() ? "timeline-week-editable" : ""}" data-week-slot="second" data-week-idx="${i}" ${isLoggedIn() ? 'contenteditable="true"' : ""}>${escapeHtml(hist.current || "Week 2")}</div>
              </div>
            </div>`;
                  })
                  .join("")
              : `<div style="grid-column:1/-1;text-align:center;color:var(--steel-500);font-size:14.5px;padding:18px 0;">No milestones logged yet.</div>`
          }
        </div>
      </div>
    `;
        }

        function chunkMilestones(ms, n) {
          const buckets = Array.from({ length: n }, () => []);
          if (!ms.length) return buckets;
          const per = Math.ceil(ms.length / n);
          ms.forEach((m, i) => {
            const idx = Math.min(n - 1, Math.floor(i / per));
            buckets[idx].push(m);
          });
          return buckets;
        }

        // ---- topic table ----
        function renderTopicSections(p) {
          if (!p.topics.length) {
            return `<div style="color:var(--steel-500);font-size:14.5px;padding:18px 0;">No topics logged yet.</div>`;
          }
          const locked = !isLoggedIn();
          // Flat grid of all topics (no Quality/Development grouping) — 8 columns x 2
          // rows so all 15 entries are visible at a glance without extra scroll.
          return `
      <div class="topic-section-grid-flat">
        ${p.topics
          .map(
            (t, idx) => `
          <div class="topic-section compact-topic" data-topic-idx="${idx}">
            ${locked ? "" : `<button class="topic-del-btn" data-del-topic-idx="${idx}" title="Delete this section">✕</button>`}
            <div class="topic-section-open" data-topic-idx="${idx}" data-action="open-topic" title="Open ${escapeHtml(t.topic)} details">
              <div class="topic-section-top">
                <span class="topic-section-name ${locked ? "locked" : ""}" ${locked ? "" : 'contenteditable="true"'} data-topic-name-idx="${idx}" title="${locked ? "Log in to rename" : "Click to rename"}">${escapeHtml(t.topic)}</span>
                <span class="ryg-dot" title="${t.file ? "Document uploaded" : "No document uploaded yet"}"><span class="d ${t.file ? "G" : "R"}"></span></span>
              </div>
            </div>
          </div>
        `,
          )
          .join("")}
      </div>
    `;
        }

        // ---- NCR table ----
        function renderNcrTable(p, locked) {
          const rows = p.ncrRows || [];
          const totals = { G: 0, Y: [0, 0, 0], R: [0, 0, 0], total: 0 };
          rows.forEach((r) => {
            totals.G += r.G || 0;
            totals.total += r.total || 0;
            (r.Y || []).forEach((v, i) => (totals.Y[i] += v));
            (r.R || []).forEach((v, i) => (totals.R[i] += v));
          });
          const cellAttrs = (field) =>
            locked
              ? `class="editable-cell locked" data-ncr-field="${field}"`
              : `class="editable-cell" contenteditable="true" data-ncr-field="${field}"`;
          return `
      <table class="ncr-table">
        <thead>
          <tr>
            <th rowspan="2">Category</th>
            <th rowspan="2">G</th>
            <th colspan="3">Y</th>
            <th colspan="3">R</th>
            <th rowspan="2">Total</th>
          </tr>
          <tr>
            <th>P1</th><th>P2</th><th>P3</th>
            <th>P1</th><th>P2</th><th>P3</th>
          </tr>
        </thead>
        <tbody>
          ${rows
            .map(
              (r, i) => `
            <tr data-ncr-idx="${i}">
              <td>${escapeHtml(r.category)}</td>
              <td class="g-col" ${cellAttrs("G")}>${r.G}</td>
              ${[0, 1, 2].map((j) => `<td class="y-col" ${cellAttrs("Y" + j)}>${r.Y[j]}</td>`).join("")}
              ${[0, 1, 2].map((j) => `<td class="r-col" ${cellAttrs("R" + j)}>${r.R[j]}</td>`).join("")}
              <td class="total-col">${r.total}</td>
            </tr>
          `,
            )
            .join("")}
        </tbody>
        <tfoot>
          <tr>
            <td>Total</td>
            <td class="g-col">${totals.G}</td>
            ${totals.Y.map((v) => `<td class="y-col">${v}</td>`).join("")}
            ${totals.R.map((v) => `<td class="r-col">${v}</td>`).join("")}
            <td class="total-col">${totals.total}</td>
          </tr>
        </tfoot>
      </table>
    `;
        }

        // ---- editable lists ----
        function renderEditableList(items, key, ico) {
          const locked = !isLoggedIn();
          if (!items || !items.length) {
            return `<ul><li style="color:var(--steel-600);font-style:italic;">${locked ? "Nothing logged yet." : 'Nothing logged yet — click "add" below.'}</li></ul>`;
          }
          return `<ul>
      ${items
        .map(
          (txt, i) => `
        <li data-list="${key}" data-idx="${i}" ${locked ? 'class="locked"' : ""}>
          <span class="ico">${ico}</span>
          <span ${locked ? "" : 'contenteditable="true"'} data-list-field="${key}" data-idx="${i}">${escapeHtml(txt)}</span>
          ${locked ? "" : `<button class="list-del" data-list-del="${key}" data-idx="${i}" title="Remove" style="margin-left:auto;background:none;border:none;color:var(--steel-600);cursor:pointer;font-size:15.5px;">✕</button>`}
        </li>
      `,
        )
        .join("")}
    </ul>`;
        }

        // ============================================================
        //  EVENT BINDING for project dashboard (editing & persistence)
        // ============================================================
        function bindDashboardEvents(p) {
          const deleteBtn = app.querySelector("[data-delete-project]");
          if (deleteBtn) {
            deleteBtn.addEventListener("click", () => {
              withAuth(() => {
                const confirmed = confirm(
                  `Delete "${p.name}" permanently? This cannot be undone.`,
                );
                if (!confirmed) return;
                const ok = deleteProject(state.line, state.classId, p.id);
                if (ok) {
                  showToast("Project deleted");
                  navigate({ projectId: null, topicIdx: null });
                }
              });
            });
          }

          // project name (dashboard title)
          const titleEl = app.querySelector(".editable-title");
          if (titleEl) {
            if (titleEl.classList.contains("locked")) {
              titleEl.addEventListener("click", () => {
                showLoginModal(() => renderProjectDashboard(p));
              });
            } else {
              const beforeName = titleEl.textContent.trim();
              titleEl.addEventListener("blur", () => {
                const newName = titleEl.textContent.trim();
                if (newName && newName !== beforeName) {
                  logChange(p, "Project name", beforeName, newName);
                  p.name = newName;
                  saveData();
                  showToast("Project renamed");
                  renderProjectDashboard(p);
                } else if (!newName) {
                  titleEl.textContent = beforeName; // don't allow blanking the name
                }
              });
              titleEl.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  titleEl.blur();
                }
              });
            }
          }

          // meta fields
          app.querySelectorAll(".meta-cell.editable").forEach((cell) => {
            if (cell.classList.contains("locked")) {
              cell.addEventListener("click", () => {
                showLoginModal(() => renderProjectDashboard(p));
              });
              return;
            }
            const el = cell.querySelector(".val[contenteditable]");
            const before = el.textContent.trim();
            el.addEventListener("blur", () => {
              const field = el.dataset.field;
              const newVal = el.textContent.trim();
              if (newVal !== before) {
                logChange(p, field, before, newVal);
                p[field] = newVal;
                saveData();
                showToast("Saved");
              }
            });
            el.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                el.blur();
              }
            });
          });

          const statusSelect = app.querySelector("[data-status-select]");
          if (statusSelect) {
            if (statusSelect.disabled) {
              statusSelect
                .closest(".meta-cell")
                .addEventListener("click", () => {
                  showLoginModal(() => renderProjectDashboard(p));
                });
            } else {
              statusSelect.addEventListener("change", () => {
                const oldVal = p.status;
                logChange(
                  p,
                  "Status",
                  statusLabel(oldVal),
                  statusLabel(statusSelect.value),
                );
                p.status = statusSelect.value;
                saveData();
                renderProjectDashboard(p); // re-render to update banner colors
                showToast("Status updated");
              });
            }
          }

          // editable date field with history
          const dateInput = app.querySelector("[data-date-field]");
          if (dateInput) {
            dateInput.addEventListener("change", () => {
              const newDate = dateInput.value;
              if (!newDate) return;
              const old = p.targetDate || "";
              if (old && old !== newDate) {
                if (!p.dateHistory) p.dateHistory = [];
                p.dateHistory.push(old);
              }
              p.targetDate = newDate;
              saveData();
              renderProjectDashboard(p);
              showToast("Target date updated");
            });
          }

          // budget: quick add spend (compact meta-strip button, amount in MINR)
          const budgetQuickBtn = app.querySelector("[data-budget-quick-add]");
          if (budgetQuickBtn) {
            budgetQuickBtn.addEventListener("click", () =>
              withAuth(() => {
                const input = prompt(
                  `Add spend for "${p.name}" — amount in MINR (Million INR)\ne.g. 2.5 = ₹25,00,000:`,
                );
                if (input === null) return;
                const minrVal = parseFloat(input.replace(/[^\d.]/g, ""));
                if (isNaN(minrVal) || minrVal < 0) {
                  showToast("Enter a valid amount");
                  return;
                }
                const rupees = Math.round(minrVal * 1e6);
                if (!p.budget) p.budget = { allocated: 0, spendLog: [] };
                if (!p.budget.spendLog) p.budget.spendLog = [];
                p.budget.spendLog.push({
                  id:
                    "sp" + Date.now() + Math.random().toString(36).slice(2, 6),
                  date: new Date().toISOString().slice(0, 10),
                  category: "Other",
                  type: "spent",
                  amount: rupees,
                  note: "",
                });
                logChange(
                  p,
                  "Spend added",
                  null,
                  `${minrVal} MINR (${formatINR(rupees)})`,
                );
                saveData();
                renderProjectDashboard(p);
                showToast(`Added ${minrVal} MINR spend`);
              }),
            );
          }

          // Timeline week slots are directly editable after login.
          app.querySelectorAll("[data-week-slot]").forEach((weekEl) => {
            if (!isLoggedIn()) {
              weekEl.addEventListener("click", () =>
                showLoginModal(() => renderProjectDashboard(p)),
              );
              return;
            }
            const idx = parseInt(weekEl.dataset.weekIdx, 10);
            const slot = weekEl.dataset.weekSlot;
            const placeholder = slot === "first" ? "Week 1" : "Week 2";
            weekEl.addEventListener("focus", () => {
              if (weekEl.textContent.trim() === placeholder)
                weekEl.textContent = "";
            });
            weekEl.addEventListener("blur", () => {
              const milestone = p.milestones && p.milestones[idx];
              if (!milestone) return;
              const before = milestone.week || "";
              const history = splitWeekHistory(before);
              const entered = weekEl.textContent.trim();
              const first = slot === "first" ? entered : history.old[0] || "";
              const second =
                slot === "second" ? entered : history.current || "";
              const next =
                first && second && first !== second
                  ? `${first} / ${second}`
                  : second || first;
              if (next !== before) {
                logChange(p, `Milestone ${milestone.label} week`, before, next);
                milestone.week = next;
                saveData();
                showToast(`${milestone.label} week saved`);
              }
              renderProjectDashboard(p);
            });
            weekEl.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                weekEl.blur();
              }
            });
          });

          // phase click -> mark all phases up to this one as done (visual progress update)
          app
            .querySelectorAll(".timeline-phase-col .phase-clickable")
            .forEach((el) => {
              el.addEventListener("click", () =>
                withAuth(() => {
                  const clickedIdx = parseInt(el.dataset.phase, 10);
                  const ms = p.milestones || [];
                  // Toggle: if everything up to this point is already done, undo back to previous
                  const alreadyAllDone = ms
                    .slice(0, clickedIdx + 1)
                    .every((m) => m.done);
                  ms.forEach((m, i) => {
                    if (alreadyAllDone) {

                    } else {

                  });

                  ms.forEach((m) => {

                      foundActive = true;

                      m.active = false;

                    "Timeline progress",

            btn.addEventListener("click", () =>
              withAuth(() => {
                const key = btn.dataset.addList;

                  p,
                  key + " item added",
                  "—",
                  "New item — click to edit",
                );
                saveData();
                renderProjectDashboard(p);
              }),
            );
          });

          const addExtraBtn = app.querySelector("[data-add-extra]");
          if (addExtraBtn) {

                saveData();

        window.addEventListener("keydown", (e) => {

        state = parseHash();
        refreshControlPanelBtn();
        render();

        // Boot renders instantly from local cache/seed (above); then we sync with
        // the server: (1) restore the real login session, (2) pull the authoritative
        // shared state. Both are wrapped so that opening the file without a backend
        // (file://) still works purely on localStorage — nothing here can break the
        // dashboard if the server is absent.
        async function syncFromServer() {
          try {
            const s = await fetch("/api/session", { cache: "no-store" }).then(
              (r) => r.json(),
            );
            SERVER_LOGGED_IN = !!(s && s.logged_in);
            if (s && s.operator) SERVER_OPERATOR = s.operator;
          } catch (e) {
            /* no backend -> stay logged out */
          }

          try {
            const res = await fetch("/api/npi_state", { cache: "no-store" });
            if (res.ok) {
              const body = await res.json();
              if (body && body.success && body.state) {

                // loadData() uses, so schema back-fills behave identically.
                const before = JSON.stringify(DATA);

                  localStorage.setItem(STORE_KEY, JSON.stringify(body.state));
                } catch (e) {}
                DATA = loadData();

              }

          } catch (e) {
            /* no backend -> keep local DATA */
          }

          return false;
        }

          if (modalOverlay && modalOverlay.classList.contains("show"))
            return true;

          if (!active) return false;
          const tag = active.tagName;
          return (

            tag === "INPUT" ||
            tag === "TEXTAREA" ||
            tag === "SELECT"

        (async function boot() {
          await syncFromServer();
          refreshControlPanelBtn();
          render();

          // open screens without anyone having to manually refresh. Skipped
          // while the person is mid-edit (typing, or a modal is open) so a
          // poll landing mid-keystroke can never overwrite unsaved input.
          setInterval(async () => {
            if (isUserMidEdit() || pendingSaveCount > 0) return;
            const changed = await syncFromServer();
            refreshControlPanelBtn();
            if (changed) render();
          }, 15000);
        })();
      })();

    <script>
      /* ============================================================
   MISSION CONTROL MOTION ENGINE
   Purely presentational: cursor spotlight on glass surfaces,
   ring draw-in sweeps, and numeric count-ups. Never touches
   app state, data, or render logic; every hook is wrapped so
   a failure here can never break the dashboard.
   ============================================================ */
      (function () {
        "use strict";

        var reduceMotion = false;

          ".compact-panel, .topic-detail-panel, .budget-panel, .list-panel, .history-panel, " +
          ".project-matrix-panel, .spend-by-project-panel, .topic-tracker-panel, .extra-panel, " +
          ".class-card, .choice-card, .project-row, .topic-section";

                  "--my",
                  spotEvent.clientY - r.top + "px",

          { passive: true },

            rings = root.querySelectorAll(".pct-ring-fg:not([data-swept])");
          } catch (e) {

            (function (el) {

        /* ---- 3. count-up: percentage labels tick from 0 to their value ---- */
        function countUps(root) {

            nodes = root.querySelectorAll(
              ".pct-ring-label:not([data-counted]), .pie-center-num:not([data-counted]), .meta-pct-val:not([data-counted])",
            );

            return;

          for (var i = 0; i < nodes.length; i++) {
            (function (el) {
              el.setAttribute("data-counted", "1");
              if (reduceMotion) return;

              var m = /^(\d{1,4})(%?)$/.exec(text);
              if (!m) return;

                suffix = m[2] || "";

                textNode.nodeValue = Math.round(end * eased) + suffix;
                if (p < 1) requestAnimationFrame(tick);
              }
              textNode.nodeValue = "0" + suffix;
              requestAnimationFrame(tick);

          }
        }

        function enhance() {

            var app = document.getElementById("app") || document.body;
            sweepRings(app);
            countUps(app);
          } catch (e) {}
        }

        try {
          var app = document.getElementById("app");

        } else {
          enhance();
        }
      })();

    <script>
      /* ============================================================

     · Button ripples

      (function () {
        "use strict";

        var reduceMotion = false;

                  : null;
              if (!btn) return;
              var r = btn.getBoundingClientRect();
              var d = Math.max(r.width, r.height) * 2;
              var span = document.createElement("span");
              span.className = "fx-ripple";
              span.style.width = span.style.height = d + "px";
              span.style.left = e.clientX - r.left - d / 2 + "px";
              span.style.top = e.clientY - r.top - d / 2 + "px";
              btn.appendChild(span);
              span.addEventListener("animationend", function () {
                span.remove();
              });
              setTimeout(function () {
                if (span.parentNode) span.remove();
              }, 800);
            } catch (err) {}
          },
          { passive: true },
        );

        /* ================= 4. scroll progress beam ================= */
        try {
          var beam = document.createElement("div");
          beam.id = "scrollBeam";
          beam.setAttribute("aria-hidden", "true");
          document.body.appendChild(beam);
          var beamPending = false;
          function updateBeam() {
            beamPending = false;
            var doc = document.documentElement;
            var max = doc.scrollHeight - doc.clientHeight;
            var p =
              max > 0
                ? (doc.scrollTop || document.body.scrollTop || 0) / max
                : 0;
            beam.style.width = (p * 100).toFixed(2) + "%";
          }
          window.addEventListener(
            "scroll",
            function () {
              if (beamPending) return;
              beamPending = true;
              requestAnimationFrame(updateBeam);
            },
            { passive: true },
          );
          updateBeam();
        } catch (e) {}

        /* ================= 5. boot sequence (once per session) ================= */
        function boot() {
          if (reduceMotion) return;
          var seen = false;
          try {
            seen = sessionStorage.getItem("npi_boot_v1") === "1";
          } catch (e) {}
          if (seen) return;
          try {
            sessionStorage.setItem("npi_boot_v1", "1");
          } catch (e) {}
          try {
            var ov = document.createElement("div");
            ov.id = "bootOverlay";
            ov.innerHTML =
              '<div class="boot-logo">ME NPI Dashboard</div>' +
              '<div class="boot-bar"><i></i></div>' +
              '<div class="boot-line"></div>';
            document.body.appendChild(ov);
            var bar = ov.querySelector(".boot-bar i");
            var line = ov.querySelector(".boot-line");
            var steps = [
              [10, "loading project registry"],
              [34, "syncing milestone gantt"],
              [58, "calibrating budget gauges"],
              [82, "linking facility trackers"],
              [100, "telemetry online"],
            ];
            var i = 0,
              killed = false;
            function finish() {
              if (killed) return;
              killed = true;
              ov.classList.add("done");
              setTimeout(function () {
                ov.remove();
              }, 550);
            }
            function step() {
              if (killed) return;
              if (i >= steps.length) {
                setTimeout(finish, 260);
                return;
              }
              bar.style.width = steps[i][0] + "%";
              line.textContent = steps[i][1];
              i++;
              setTimeout(step, 240);
            }
            ov.addEventListener("click", finish);
            setTimeout(step, 60);
            setTimeout(finish, 3000); /* hard cap — never trap the user */
          } catch (e) {}
        }
        boot();

        /* ================= 6. text decode / scramble ================= */
        var DECODE_SEL =
          ".dash-title:not([data-decoded]), .section-title:not([data-decoded]), " +
          ".landing-title:not([data-decoded]), .panel-title:not([data-decoded])";
        var GLYPHS = "!<>-_/[]{}=+*^?#";
        function decode(el) {
          el.setAttribute("data-decoded", "1");
          if (reduceMotion) return;
          var node = el.firstChild;
          if (!node || node.nodeType !== 3) return; /* single text node only */
          if (el.childNodes.length !== 1) return;
          var target = node.nodeValue || "";
          if (!target.trim() || target.length > 48) return;
          var frames = 14,
            f = 0;
          function tick() {
            f++;
            var reveal = Math.floor((f / frames) * target.length);
            var out = "";
            for (var i = 0; i < target.length; i++) {
              var ch = target.charAt(i);
              if (i < reveal || ch === " ") {
                out += ch;
              } else {
                out += GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
              }
            }
            node.nodeValue = out;
            if (f < frames) {
              requestAnimationFrame(tick);
            } else {
              node.nodeValue = target;
            }
          }
          requestAnimationFrame(tick);
        }
        function decodeAll() {
          try {
            var els = document.querySelectorAll(DECODE_SEL);
            for (var i = 0; i < els.length && i < 8; i++) decode(els[i]);
            /* mark any overflow so they don't scramble later mid-view */
            for (var j = 8; j < els.length; j++)
              els[j].setAttribute("data-decoded", "1");
          } catch (e) {}
        }
        try {
          var app = document.getElementById("app");
          if (app && typeof MutationObserver === "function") {
            var queued = false;
            new MutationObserver(function () {
              if (queued) return;
              queued = true;
              requestAnimationFrame(function () {
                queued = false;
                decodeAll();
              });
            }).observe(app, { childList: true, subtree: true });
          }
        } catch (e) {}
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", decodeAll);
        } else {
          decodeAll();
        }
      })();
    </script>
  </body>
</html>
