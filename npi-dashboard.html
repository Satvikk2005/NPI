<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPI Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NPI DASHBOARD — STYLES
   Design language: night-shift mission control.
   Deep carbon-blue telemetry console: glass panels on a void
   background with a drifting aurora, electric-cyan (--volt)
   system accent, hazard-amber reserved for caution, safety-red
   for risk, signal-green for go. Space Grotesk display type,
   monospace for week-codes / data, clean sans for body copy.
   The base layout rules below are inherited from earlier
   builds; the "MISSION CONTROL ENHANCEMENT LAYER" at the end
   of this style block re-skins every surface for the dark
   telemetry theme and adds the motion system.
   ============================================================ */

:root{
  /* ---- palette — "night-shift mission control" mode ----
     Deep carbon-blue telemetry console. Same variable names as
     every previous build; the tonal ramp is dark-first again so
     --steel-950 is the void background and --steel-100 is the
     light ink. Every existing var(--steel-*) reference keeps
     working with correct contrast.
     New in this build: --volt (electric cyan) is the system /
     interaction accent; --amber stays reserved for caution
     semantics so G/Y/R status meaning is untouched. ---- */
  --steel-950:#ffffff;   /* page background — void */
  --steel-900:#ffffff;   /* secondary background / hero wash */
  --steel-850:#ffffff;   /* card surface (glass base) */
  --steel-800:#ffffff;   /* subtle fill / hover surface */
  --steel-700:#e6e6e6;   /* borders, dividers */
  --steel-600:#d5d5d5;   /* faint borders, disabled */
  --steel-500:#6f6f6f;   /* muted text, captions */
  --steel-400:#565656;   /* muted text, slightly stronger */
  --steel-300:#3e3e3e;   /* secondary ink */
  --steel-200:#2a2a2a;   /* secondary ink, stronger */
  --steel-100:#111111;   /* primary ink */
  --plate:#111111;

  --amber:#f5a623;
  --amber-deep:#c07f10;
  --safety-red:#ff5d4f;
  --safety-red-deep:#c93a2e;
  --signal-green:#31d97e;
  --signal-green-deep:#1fa35c;
  --info-blue:#57a8ff;

  --g:#31d97e;
  --y:#ffb224;
  --r:#ff5d4f;
  --na:#6e7ea3;

  /* system accent — electric cyan telemetry */
  --volt:#e4302b;
  --volt-deep:#b31f1c;
  --violet:#f5a623;
  --line:rgba(17,17,17,0.10);
  --line-strong:rgba(17,17,17,0.22);
  --glass:linear-gradient(180deg, rgba(255,255,255,0.96), rgba(255,255,255,0.98));

  /* surface elevation — deep space + luminous edge */
  --shadow-sm:0 1px 2px rgba(0,0,0,0.07), inset 0 1px 0 rgba(255,255,255,0.9);
  --shadow-md:0 10px 26px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.05);
  --shadow-lg:0 28px 64px rgba(0,0,0,0.12), 0 6px 18px rgba(0,0,0,0.07);
  --shadow-amber:0 8px 28px rgba(255,178,36,0.22);
  --shadow-volt:0 8px 28px rgba(228,48,43,0.30);

  --radius-sm:4px;
  --radius-md:8px;
  --radius-lg:14px;

  --font-display:'Archivo', sans-serif;
  --font-body:'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;

  --ease:cubic-bezier(.2,.8,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}

body{
  background:var(--steel-950);
  color:var(--steel-100);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

/* ---------- signature texture: faint engineering blueprint grid ----------
   A fine graph-paper cross-hatch plus a slightly heavier line every 5th
   cell, the way a real drafting sheet is ruled. Sits at ~3% opacity so
   it reads as material, not decoration. */
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:160px 160px, 160px 160px, 32px 32px, 32px 32px;
  background-position:-1px -1px;
  pointer-events:none;
  z-index:0;
  mask-image:linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.35) 600px, rgba(0,0,0,0.18) 1400px, rgba(0,0,0,0.08) 100%);
}

button{font-family:inherit;}

/* ---------- page-load choreography ---------- */
@keyframes fadeRise{
  from{ opacity:0; transform:translateY(14px); }
  to{ opacity:1; transform:translateY(0); }
}
.stagger-in{ animation:fadeRise .6s var(--ease) both; }
.stagger-in:nth-child(1){ animation-delay:.02s; }
.stagger-in:nth-child(2){ animation-delay:.08s; }
.stagger-in:nth-child(3){ animation-delay:.14s; }
.stagger-in:nth-child(4){ animation-delay:.2s; }
.stagger-in:nth-child(5){ animation-delay:.26s; }
.stagger-in:nth-child(6){ animation-delay:.32s; }

/* ---------- hazard strip ---------- */
.hazard-strip{
  height:5px;
  width:100%;
  background:repeating-linear-gradient(
    -45deg,
    var(--amber) 0 14px,
    var(--steel-950) 14px 28px
  );
}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:rgba(251,251,250,0.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--steel-700);
}
.topbar-inner{
  max-width:1280px;
  margin:0 auto;
  padding:14px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}
.brand{
  display:flex; align-items:baseline; gap:10px;
  background:none; border:none; cursor:pointer;
  padding:0;
}
.brand-mark{
  font-family:var(--font-display);
  font-weight:700;
  font-size:22px;
  letter-spacing:0.5px;
  color:var(--amber);
  border:2px solid var(--amber);
  padding:6px 16px;
  border-radius:var(--radius-sm);
  line-height:1;
  white-space:nowrap;
  transition:transform .2s var(--ease-spring), box-shadow .2s var(--ease);
}
.brand:hover .brand-mark{ transform:translateY(-1px); box-shadow:var(--shadow-amber); }
.brand-name{
  font-family:var(--font-display);
  font-weight:500;
  font-size:14.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--steel-300);
  display:none;
}
@media(min-width:640px){ .brand-name{display:inline;} }

.topbar-actions{ display:flex; align-items:center; gap:10px; margin-left:auto; }
.clock{
  font-family:var(--font-mono);
  font-size:14px;
  color:var(--steel-500);
  display:none;
}
@media(min-width:480px){ .clock{display:inline;} }

/* Header MHD / HD buttons */
.header-line-btn{
  font-family:var(--font-display);
  font-weight:700;
  font-size:18px;
  letter-spacing:1px;
  color:var(--steel-200);
  background:var(--steel-800);
  border:1px solid var(--steel-700);
  border-radius:var(--radius-sm);
  padding:9px 22px;
  cursor:pointer;
  transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease-spring);
}
.header-line-btn:hover{
  background:var(--amber);
  color:#ffffff;
  border-color:var(--amber);
  transform:translateY(-1px);
}
.header-line-btn.active{
  background:var(--amber);
  color:#ffffff;
  border-color:var(--amber-deep);
}

/* Header Back button — shown only on topic detail screen */
.header-back-btn{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:13.5px;
  letter-spacing:0.5px;
  color:var(--steel-300);
  background:var(--steel-850);
  border:1px solid var(--steel-700);
  border-radius:var(--radius-sm);
  padding:5px 14px;
  cursor:pointer;
  display:none; align-items:center; gap:5px;
  transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.header-back-btn.visible{
  display:flex;
}
.header-back-btn:hover{
  background:var(--steel-800);
  color:var(--amber);
  border-color:var(--amber);
}

/* Header Control Panel button */
.header-ctrl-btn{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:13.5px;
  letter-spacing:0.5px;
  color:var(--steel-300);
  background:var(--steel-850);
  border:1px solid var(--steel-700);
  border-radius:var(--radius-sm);
  padding:5px 14px;
  cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transition:background .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease);
}
.header-ctrl-btn:hover{
  background:var(--steel-800);
  color:var(--plate);
  border-color:var(--steel-600);
}
.header-ctrl-btn.logged-in{
  color:var(--g);
  border-color:rgba(47,168,79,0.4);
}
.header-ctrl-btn.logged-in:hover{
  border-color:var(--g);
}

/* ---------- footer ---------- */
.app-footer{
  position:relative; z-index:1;
  max-width:1280px; margin:0 auto;
  padding:28px 24px 40px;
  display:flex; align-items:center; gap:10px;
  font-size:14px; color:var(--steel-600);
  font-family:var(--font-mono);
}
.app-footer .dot{ color:var(--steel-700); }

main#app{ position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:0 24px; min-height:60vh; }

/* ============================================================
   SCREEN: LANDING
   ============================================================ */
.screen{
  position:relative;
  animation:screenIn .38s var(--ease);
}
@keyframes screenIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.landing{
  min-height:72vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center;
  padding:48px 0 32px;
}
.landing-eyebrow{
  font-family:var(--font-mono);
  font-size:14.5px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--amber);
  margin-bottom:18px;
  display:flex; align-items:center; gap:10px;
}
.landing-eyebrow::before, .landing-eyebrow::after{
  content:"";
  width:28px; height:1px;
  background:var(--amber-deep);
}
.landing-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(48px, 9vw, 96px);
  letter-spacing:1px;
  line-height:0.95;
  margin:0;
  color:var(--plate);
  text-transform:uppercase;
}
.landing-title .accent{ color:var(--amber); }
.landing-sub{
  margin:18px 0 56px;
  font-size:16.5px;
  color:var(--steel-300);
  max-width:480px;
  line-height:1.6;
}

.choice-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
  width:100%;
  max-width:780px;
}
@media(min-width:640px){ .choice-grid{ grid-template-columns:1fr 1fr; } }

.choice-card{
  position:relative;
  background:linear-gradient(160deg, var(--steel-850), var(--steel-900));
  border:1px solid var(--steel-700);
  border-radius:var(--radius-lg);
  padding:36px 28px;
  cursor:pointer;
  text-align:left;
  overflow:hidden;
  transition:border-color .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
}
.choice-card::before{
  content:"";
  position:absolute; top:0; left:0; right:0; height:3px;
  background:var(--amber);
  transform:scaleX(0); transform-origin:left;
  transition:transform .25s var(--ease);
}
.choice-card:hover{
  border-color:var(--amber-deep);
  transform:translateY(-4px);
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(224,142,0,0.12);
}
.choice-card:hover::before{ transform:scaleX(1); }
.choice-card:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; }

.choice-tag{
  font-family:var(--font-mono);
  font-size:13px; letter-spacing:2px;
  color:var(--steel-500);
  text-transform:uppercase;
}
.choice-label{
  font-family:var(--font-display);
  font-weight:700;
  font-size:42px;
  color:var(--plate);
  margin:6px 0 10px;
  letter-spacing:0.5px;
}
.choice-desc{
  font-size:15px;
  color:var(--steel-300);
  line-height:1.55;
  margin-bottom:18px;
}
.choice-meta{
  display:flex; gap:16px;
  font-family:var(--font-mono);
  font-size:13.5px;
  color:var(--steel-500);
  padding-top:14px;
  border-top:1px dashed var(--steel-700);
}
.choice-meta b{ color:var(--amber); font-weight:600; }

/* ---------- landing analytics: pie charts ---------- */
.analytics-section{
  max-width:920px;
  margin:0 auto 64px;
  padding-top:8px;
}
.analytics-section .section-head{ justify-content:center; text-align:center; flex-direction:column; gap:4px; margin-bottom:32px; }
.analytics-section .section-title{ font-size:clamp(22px,3.4vw,30px); }

.chart-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:20px;
}
@media(min-width:760px){ .chart-grid{ grid-template-columns:1fr 1fr; } }

.chart-panel{ display:flex; flex-direction:column; }
.chart-body{
  display:flex;
  align-items:center;
  gap:24px;
  flex-wrap:wrap;
  justify-content:center;
}
.pie-svg{ flex:0 0 auto; }
.pie-svg path{
  transition:opacity .15s var(--ease), transform .15s var(--ease);
  transform-origin:center;
  cursor:pointer;
  animation:wedgeIn .55s var(--ease-spring) both;
}
.pie-svg path:hover{ opacity:0.82; transform:scale(1.035); }
@keyframes wedgeIn{
  from{ opacity:0; transform:scale(0.4) rotate(-50deg); }
  to{ opacity:1; transform:scale(1) rotate(0deg); }
}
.pie-center-num{
  font-family:var(--font-display); font-weight:700; font-size:30px;
  fill:var(--plate);
  animation:fadeRise .4s var(--ease) .3s both;
}
.pie-center-lbl{
  font-family:var(--font-mono); font-size:14px; letter-spacing:1px;
  text-transform:uppercase; fill:var(--steel-500);
}

.chart-legend{
  list-style:none; margin:0; padding:0;
  display:flex; flex-direction:column; gap:9px;
  flex:1 1 160px; min-width:150px;
}
.chart-legend li{
  display:flex; align-items:center; gap:9px;
  font-size:14.5px; color:var(--steel-200);
  animation:fadeRise .4s var(--ease) both;
}
.chart-legend li:nth-child(1){ animation-delay:.08s; }
.chart-legend li:nth-child(2){ animation-delay:.14s; }
.chart-legend li:nth-child(3){ animation-delay:.2s; }
.chart-legend li:nth-child(4){ animation-delay:.26s; }
.chart-legend li:nth-child(5){ animation-delay:.32s; }
.chart-legend .swatch{
  width:11px; height:11px; border-radius:3px; flex:0 0 auto;
  transition:transform .15s var(--ease-spring);
}
.chart-legend li:hover .swatch{ transform:scale(1.3); }
.chart-legend .legend-label{ flex:1; }
.chart-legend .legend-value{
  font-family:var(--font-mono); font-weight:600; color:var(--plate);
  font-size:14.5px;
}

/* ============================================================
   BUDGET — pool strip (landing) + project budget panel
   ============================================================ */
.budget-section{
  max-width:920px;
  margin:0 auto 56px;
}
.budget-section .section-head{ margin-bottom:20px; }

.budget-strip{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:1px;
  background:var(--steel-700);
  border:1px solid var(--steel-700);
  border-radius:var(--radius-lg);
  overflow:hidden;
  margin-bottom:14px;
}
.budget-cell{
  background:var(--steel-850);
  padding:18px 18px;
  transition:background .2s var(--ease);
  animation:fadeRise .5s var(--ease) both;
}
.budget-strip .budget-cell:nth-child(1){ animation-delay:.04s; }
.budget-strip .budget-cell:nth-child(2){ animation-delay:.09s; }
.budget-strip .budget-cell:nth-child(3){ animation-delay:.14s; }
.budget-strip .budget-cell:nth-child(4){ animation-delay:.19s; }
.budget-strip .budget-cell:nth-child(5){ animation-delay:.24s; }
.budget-cell:hover{ background:var(--steel-800); }
.budget-cell .lbl{
  font-family:var(--font-mono); font-size:13px; letter-spacing:1.2px;
  text-transform:uppercase; color:var(--steel-500); margin-bottom:6px;
}
.budget-cell .val{
  font-family:var(--font-display); font-weight:700; font-size:22px;
  color:var(--plate);
}
.budget-cell .sub{
  font-family:var(--font-mono); font-size:13px; color:var(--steel-600);
  margin-top:4px;
}
.budget-cell.spent .val{ color:var(--info-blue); }
.budget-cell.committed .val{ color:var(--amber); }
.budget-cell.remaining .val{ color:var(--g); }
.budget-cell.remaining.negative .val{ color:var(--r); }

.budget-gauge-wrap{ padding:0 2px; }
.budget-gauge{
  position:relative;
  height:14px;
  background:var(--steel-800);
  border-radius:7px;
  overflow:hidden;
  border:1px solid var(--steel-700);
}
.budget-gauge-fill{
  position:absolute; top:0; bottom:0; left:0;
  transition:width .3s var(--ease);
  animation:gaugeFillIn .9s var(--ease) both;
  transform-origin:left;
}
@keyframes gaugeFillIn{
  from{ transform:scaleX(0); }
  to{ transform:scaleX(1); }
}
.budget-gauge-fill.spent{ background:linear-gradient(90deg, var(--info-blue), #5aa6dd); z-index:2; }
.budget-gauge-fill.committed{ background:repeating-linear-gradient(45deg, var(--amber) 0 6px, var(--amber-deep) 6px 12px); z-index:1; animation-delay:.15s; }
.budget-gauge-legend{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  margin-top:10px;
  font-family:var(--font-mono); font-size:13px; color:var(--steel-400);
}
.budget-gauge-legend .dot{
  display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px;
  vertical-align:middle;
}
.budget-gauge-legend .dot.spent{ background:var(--info-blue); }
.budget-gauge-legend .dot.committed{ background:var(--amber); }
.budget-gauge-legend .dot.free{ background:var(--steel-700); border:1px solid var(--steel-600); }
.budget-gauge-legend .overbudget-text{
  color:var(--r); font-weight:600; margin-left:auto;
}

.overbudget-chip{
  display:inline-flex; align-items:center;
  font-family:var(--font-mono); font-size:14.5px; font-weight:700;
  letter-spacing:0.5px;
  background:rgba(216,51,42,0.15); color:var(--r);
  border:1px solid rgba(216,51,42,0.4);
  border-radius:4px; padding:2px 7px;
  margin-left:8px;
}

/* per-project budget panel (sits full-width above timeline) */
.budget-panel{ margin-bottom:32px; }
.proj-budget-strip{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
  gap:1px;
  background:var(--steel-700);
  border:1px solid var(--steel-700);
  border-radius:var(--radius-md);
  overflow:hidden;
  margin-bottom:16px;
}
.proj-budget-strip .budget-cell{ padding:14px 16px; }
.proj-budget-strip .budget-cell .val{ font-size:18px; }

.spend-log-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin:22px 0 10px;
}
.spend-log-title{
  font-family:var(--font-mono); font-size:13px; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--steel-500);
}
.spend-log-count{
  font-family:var(--font-mono); font-size:13px; color:var(--steel-600);
}
.spend-log-table-wrap{ overflow-x:auto; }
.spend-log-table{ width:100%; border-collapse:collapse; font-size:14.5px; min-width:560px; }
.spend-log-table th{
  text-align:left; font-family:var(--font-mono); font-size:14.5px;
  letter-spacing:1px; text-transform:uppercase; color:var(--steel-500);
  padding:7px 8px; border-bottom:1px solid var(--steel-700);
}
.spend-log-table td{
  padding:9px 8px; border-bottom:1px solid var(--steel-800);
  color:var(--steel-100); vertical-align:middle;
}
.spend-log-table tr:last-child td{ border-bottom:none; }
.spend-date{ font-family:var(--font-mono); font-size:13.5px; color:var(--steel-400); white-space:nowrap; }
.spend-note{ color:var(--steel-400); font-size:14px; }
.spend-amount{ font-family:var(--font-mono); font-weight:600; color:var(--plate); white-space:nowrap; text-align:right; }
.spend-cat-chip{
  font-family:var(--font-mono); font-size:13px;
  background:var(--steel-800); color:var(--steel-300);
  border:1px solid var(--steel-700);
  border-radius:4px; padding:2px 7px; white-space:nowrap;
}
.spend-type-chip{

/* spend-by-project bar chart (landing page) */

/* ============================================================

/* ---- control panel: project list ---- */
.cp-class-block{

/* ---- keep modal-box a wider-friendly class ---- */

/* ============================================================
   SCREEN: CLASS SELECT
   ============================================================ */
.section-head{

}
.section-title{

  font-weight:700;

}
.section-title .accent{ color:var(--amber); }

  font-size:14.5px; color:var(--steel-500);

}
.back-link{

.class-grid{

}

}
.class-grid .class-card:nth-child(1){ animation-delay:.03s; }
.class-grid .class-card:nth-child(2){ animation-delay:.09s; }
.class-grid .class-card:nth-child(3){ animation-delay:.15s; }
.class-card:hover{

}

.class-name{

.class-count{

}

.class-card.empty{ opacity:0.55; }
.class-card.empty:hover{ transform:none; border-color:var(--steel-700); background:var(--steel-850); }

/* ============================================================
   SCREEN: PROJECT LIST
   ============================================================ */
.project-list{ display:flex; flex-direction:column; gap:14px; margin-bottom:48px; }
.project-row{
  display:grid;
  grid-template-columns:auto 1fr auto auto auto auto;
  align-items:center;
  gap:18px;
  background:var(--steel-850);
  border:1px solid var(--steel-700);
  border-left:4px solid var(--steel-600);
  border-radius:var(--radius-md);
  padding:18px 22px;
  cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:border-color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease), box-shadow .2s var(--ease);
  animation:fadeRise .45s var(--ease) both;
}
.project-list .project-row:nth-child(1){ animation-delay:.03s; }
.project-list .project-row:nth-child(2){ animation-delay:.08s; }

.project-row:hover{ background:var(--steel-800); transform:translateX(3px); box-shadow:var(--shadow-md); }
.project-row[data-status="Y"]{ border-left-color:var(--g); }

.project-row[data-status="G"]{ border-left-color:var(--g); }

.status-pill{

}
.status-pill.Y{ background:var(--y); box-shadow:0 0 12px rgba(240,162,2,0.6);}
.status-pill.R{ background:var(--r); box-shadow:0 0 12px rgba(216,51,42,0.65);}
.status-pill.G{ background:var(--g); box-shadow:0 0 12px rgba(47,168,79,0.6);}

.project-row-name{

  font-weight:600; font-size:18px;

}

}
.project-row-field{

  font-size:14px;
  color:var(--steel-300);

}
.project-row-field .lbl{ display:block; color:var(--steel-600); font-size:14.5px; letter-spacing:1px; text-transform:uppercase; margin-bottom:2px;}
.project-row-arrow{ color:var(--steel-600); font-size:20px; transition:transform .2s var(--ease), color .2s var(--ease); }
.project-row:hover .project-row-arrow{ color:var(--amber); transform:translateX(3px); }

.project-row-pct{

}

.pct-ring-bg{

.pct-ring-fg{

.pct-ring-fg.low{ stroke:var(--r); }

.pct-ring-label{

.empty-state{

.btn-ghost{

/* ============================================================
   PROJECT DASHBOARD
   ============================================================ */

.status-banner{

.meta-strip{

.meta-pct-val.done{ color:var(--g); }

  font-family:var(--font-mono); font-size:13px; letter-spacing:2px;
  text-transform:uppercase; color:var(--steel-500); margin-bottom:20px;
}
.timeline-track{
  position:relative;
  display:grid;
  grid-template-columns:repeat(6, minmax(120px,1fr));
  min-width:760px;
}
.timeline-phase{
  position:relative;
  padding:0 4px 28px;
  text-align:center;
}
.timeline-phase .bar{
  height:34px;
  border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:600; font-size:14.5px;
  text-transform:uppercase; letter-spacing:0.4px;
  color:rgba(0,0,0,0.55);
  position:relative;
  z-index:1;
}
.timeline-phase:nth-child(1) .bar{ background:linear-gradient(90deg,#8e98a3,#a7afb8); }
.timeline-phase:nth-child(2) .bar{ background:linear-gradient(90deg,#d8332a,#e8584f); color:#fff; }
.timeline-phase:nth-child(3) .bar{ background:linear-gradient(90deg,#e8843a,#f0a202); }
.timeline-phase:nth-child(4) .bar{ background:linear-gradient(90deg,#f0d202,#f4e24a); }
.timeline-phase:nth-child(5) .bar{ background:linear-gradient(90deg,#3fae5e,#2fa84f); color:#fff;}
.timeline-phase:nth-child(6) .bar{ background:linear-gradient(90deg,#3a8fd1,#5aa6dd); color:#fff;}
.timeline-phase.active .bar{
  outline:3px solid var(--amber);
  outline-offset:2px;
  box-shadow:0 0 18px rgba(240,162,2,0.5);
}
.timeline-rail{
  position:absolute; left:0; right:0; top:17px;
  height:2px; background:var(--steel-700); z-index:0;
}
.timeline-milestones{
  display:flex; flex-direction:column; gap:4px; margin-top:10px;
  align-items:center;
}
.milestone-chip{
  font-family:var(--font-mono); font-size:13px;
  color:var(--steel-300);
  background:var(--steel-800);
  border:1px solid var(--steel-700);
  border-radius:4px;
  padding:3px 7px;
  white-space:normal;
  line-height:1.4;
}
.milestone-chip.done{ color:var(--steel-600); text-decoration:line-through; border-color:var(--steel-700); background:transparent;}
.milestone-chip.risk{ color:var(--r); border-color:rgba(216,51,42,0.4); background:rgba(216,51,42,0.08); font-weight:600;}
.milestone-chip.go{ color:var(--g); border-color:rgba(47,168,79,0.4); background:rgba(47,168,79,0.08); font-weight:600;}
.milestone-name{
  font-family:var(--font-mono); font-size:14px; color:var(--steel-500);
  text-transform:uppercase; letter-spacing:0.5px; margin-top:6px;
}

/* ---- per-milestone gate-chart timeline — each milestone gets its own
   colored bar segment (colored by which of the 6 phases it falls under:
   PreStudy/Concept/Detail/Final/Industrialization/Follow-up), with the
   MILESTONE's own name (PCIG, FeG, CG...) printed on that segment, and
   the milestone's date(s) shown directly below. ---- */
.timeline-gatechart-flat{
  display:grid;
  gap:6px;
  min-width:1080px;
}
.gatechart-flat-col{
  display:flex; flex-direction:column; align-items:center;
  gap:8px;
}
.gatechart-flat-seg{
  width:100%;
  min-height:36px;
  border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  text-align:center;
  padding:5px 4px;
  font-family:var(--font-display); font-weight:600; font-size:13px;
  text-transform:uppercase; letter-spacing:0.3px;
  color:rgba(0,0,0,0.6);
  line-height:1.2;
}
.gatechart-flat-seg.phase-0{ background:linear-gradient(160deg,#8e98a3,#a7afb8); }
.gatechart-flat-seg.phase-1{ background:linear-gradient(160deg,#d8332a,#e8584f); color:#fff; }
.gatechart-flat-seg.phase-2{ background:linear-gradient(160deg,#e8843a,#f0a202); }
.gatechart-flat-seg.phase-3{ background:linear-gradient(160deg,#f0d202,#f4e24a); }
.gatechart-flat-seg.phase-4{ background:linear-gradient(160deg,#3fae5e,#2fa84f); color:#fff; }
.gatechart-flat-seg.phase-5{ background:linear-gradient(160deg,#3a8fd1,#5aa6dd); color:#fff; }
.gatechart-flat-seg.active{
  outline:3px solid var(--amber);
  outline-offset:2px;
  box-shadow:0 0 18px rgba(240,162,2,0.5);
}

.milestone-week-block{ display:flex; flex-direction:column; align-items:center; gap:1px; }
.milestone-week-old{
  font-family:var(--font-mono); font-size:13.5px; line-height:1.4;
  color:var(--steel-600);
  text-decoration:line-through;
  white-space:nowrap;
}
.milestone-week{
  font-family:var(--font-mono); font-size:13px; font-weight:600; line-height:1.5;
  color:var(--steel-300);
  white-space:nowrap;
  padding:1px 5px;
  border-radius:3px;
}
.milestone-week.done{ color:var(--steel-600); text-decoration:line-through; font-weight:400; }
.milestone-week.risk{ color:#fff; background:var(--safety-red); font-weight:700; text-decoration:none; }
.milestone-week.go{ color:#fff; background:var(--signal-green); font-weight:700; }
.milestone-week.active-week{
  color:#ffffff; background:#5fe089;
  box-shadow:0 0 0 1px rgba(31,143,72,0.4);
}

/* ---- timeline: clickable phases & dual dates ---- */
.phase-clickable{
  cursor:pointer;
  position:relative;
}
.phase-clickable:hover{
  filter:brightness(1.08);
  transform:translateY(-2px) scale(1.01);
  box-shadow:0 6px 18px rgba(255,255,255,0.14);
}
.phase-highlighted{
  box-shadow:0 0 0 2.5px rgba(31,143,72,0.7), 0 4px 14px rgba(31,143,72,0.25) !important;
  opacity:1 !important;
}
.phase-highlighted::after{
  content:"";
  position:absolute; bottom:-3px; left:50%; transform:translateX(-50%);
  width:80%; height:2px;
  background:var(--signal-green);
  border-radius:2px;
}
.phase-done-tick{
  position:absolute;
  top:3px; right:5px;
  font-size:13.5px;
  color:rgba(255,255,255,0.85);
  font-weight:700;
  line-height:1;
}
/* Phase segments that are NOT highlighted get a slight dim */
.gatechart-flat-seg:not(.phase-highlighted):not(.active){
  opacity:0.72;
}
.gatechart-flat-seg.active:not(.phase-highlighted){
  opacity:1;
}

/* Dual dates row under each milestone */
.milestone-dual-dates{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:4px 2px 2px;
  margin-top:2px;
}
.milestone-date-row{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
}

.milestone-date-input{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--steel-400);
  background:transparent;
  border:none;
  border-bottom:1px dashed var(--steel-700);
  border-radius:0;
  padding:1px 2px;
  width:100%;
  text-align:center;
  cursor:pointer;
  transition:border-color .15s var(--ease), color .15s var(--ease);
  -webkit-appearance:none;
}
.milestone-date-row.revised .milestone-date-input{
  color:var(--amber);
  border-bottom-color:rgba(224,142,0,0.4);
}
/* When a revised date is present, the planned date is "cut over" —
   struck through to show it has been superseded by the revised date below it. */
.milestone-date-row.planned.has-revision .milestone-date-input{
  text-decoration:line-through;
  text-decoration-color:var(--safety-red);
  text-decoration-thickness:1.4px;
  color:var(--steel-600);
  opacity:0.8;
}
.milestone-date-input:focus{
  outline:none;
  border-bottom-color:var(--amber-deep);
  color:var(--plate);
}
.milestone-date-input:disabled{
  cursor:default;
  opacity:0.6;
}
.milestone-date-input::-webkit-calendar-picker-indicator{
  display:none;
}
.milestone-date-input::-webkit-inner-spin-button{ display:none; }

/* ---- grid layout for content blocks ---- */
.dash-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:24px;
  margin-bottom:32px;
  align-items:start;
}
@media(max-width:920px){ .dash-grid{ grid-template-columns:1fr; } }

/* compact 4-up grid for Achievements / Upcoming / Support / Notes —
   keeps these four lower-priority panels to a single dense row so
   the dashboard doesn't need extra scroll to reach them. */
.dash-grid-quad{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:16px;
  margin-bottom:32px;
  align-items:start;
}
@media(max-width:1080px){ .dash-grid-quad{ grid-template-columns:repeat(2, 1fr); } }
@media(max-width:560px){ .dash-grid-quad{ grid-template-columns:1fr; } }

.compact-panel{ padding:16px 16px; display:flex; flex-direction:column; }
.compact-panel .panel-head{ margin-bottom:10px; }
.compact-panel .panel-title{ font-size:14.5px; }
.compact-panel-body{
  max-height:170px;
  overflow-y:auto;
  padding-right:4px;
}
.compact-panel-body::-webkit-scrollbar{ width:5px; }
.compact-panel-body::-webkit-scrollbar-thumb{ background:var(--steel-700); border-radius:4px; }
.compact-panel .list-panel ul, .compact-panel-body ul{ gap:7px; }
.compact-panel .list-panel li, .compact-panel-body li{ font-size:14.5px; line-height:1.4; }
.compact-panel .add-row-btn{ margin-top:10px; padding:5px 10px; font-size:13px; }

.panel{
  background:var(--steel-850);
  border:1px solid var(--steel-700);
  border-radius:var(--radius-lg);
  padding:22px 24px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .25s var(--ease), transform .25s var(--ease);
}
.panel:hover{
  box-shadow:var(--shadow-md);
  transform:translateY(-2px);
}
.panel-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px;
  gap:10px; flex-wrap:wrap;
}
.panel-title{
  font-family:var(--font-display); font-weight:600; font-size:16px;
  text-transform:uppercase; letter-spacing:0.6px;
  color:var(--plate);
  display:flex; align-items:center; gap:8px;
}
.panel-title .chip{
  font-family:var(--font-mono); font-size:14.5px;
  color:var(--steel-500); border:1px solid var(--steel-700);
  padding:1px 6px; border-radius:4px;
}
.panel-action{
  font-family:var(--font-mono); font-size:13px;
  color:var(--steel-500); background:none; border:1px solid var(--steel-700);
  border-radius:5px; padding:5px 10px; cursor:pointer;
  transition:border-color .15s, color .15s;
}
.panel-action:hover{ border-color:var(--amber-deep); color:var(--amber); }

/* topic tracker — grouped sections, each card links out to an Excel sheet */
.topic-sections-wrap{ display:flex; flex-direction:column; gap:22px; }
.topic-group-head{
  display:flex; align-items:center; gap:10px;
  margin-bottom:12px;
}
.topic-group-name{
  font-family:var(--font-mono); font-size:13px; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--steel-500);
}
.grp-tag{
  display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:20px; border-radius:4px;
  font-family:var(--font-mono); font-weight:700; font-size:13px;
  background:var(--steel-800); color:var(--steel-300);
}
.topic-section-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:12px;
}

/* flat 7-column x 2-row topic tracker grid — all 13 entries visible at
   once without the old Quality/Development sub-grouping. */
.topic-section-grid-flat{
  display:grid;
  grid-template-columns:repeat(8, 1fr);
  gap:10px;
}
@media(max-width:1200px){ .topic-section-grid-flat{ grid-template-columns:repeat(4, 1fr); } }
@media(max-width:760px){ .topic-section-grid-flat{ grid-template-columns:repeat(2, 1fr); } }
@media(max-width:460px){ .topic-section-grid-flat{ grid-template-columns:1fr; } }

.compact-topic .topic-section-open{
  padding:10px 11px;
  gap:6px;
}
.compact-topic .topic-section-name{
  font-size:13.5px;
  line-height:1.25;
}
.compact-topic .topic-section-meta{
  gap:8px;
  font-size:14.5px;
}
.compact-topic .topic-section-meta .lbl{
  font-size:13px;
}
.compact-topic .ryg-dot{ gap:0; }

.topic-tracker-panel{ margin-bottom:32px; }

/* ---- topic detail full-screen view ---- */
.topic-detail-panel{ padding:26px 28px; }
.topic-detail-header{
  padding-bottom:18px; margin-bottom:20px;
  border-bottom:1px solid var(--steel-700);
}
.topic-detail-meta-row{
  display:flex; flex-wrap:wrap; gap:22px;
  font-size:14.5px; color:var(--steel-300);
}
.topic-detail-meta-row .lbl{
  display:block; font-size:14.5px; text-transform:uppercase; letter-spacing:0.5px;
  color:var(--steel-500); margin-bottom:2px;
}
.topic-detail-section{ margin-bottom:26px; }
.topic-detail-section:last-child{ margin-bottom:0; }
.topic-detail-section-title{
  font-family:var(--font-display); font-weight:700; font-size:15.5px;
  color:var(--plate); margin-bottom:12px;
}
.topic-detail-note{
  font-size:14.5px; color:var(--steel-500); margin-top:10px; line-height:1.5;
}
.ryg-dot.lg{ font-size:14.5px; gap:6px; }
.ryg-dot.lg .d{ width:10px; height:10px; }

.detail-table{
  width:100%; border-collapse:collapse; font-size:14.5px;
}
.detail-table th{
  text-align:left; font-size:13px; text-transform:uppercase; letter-spacing:0.4px;
  color:var(--steel-500); font-weight:600;
  padding:8px 10px; border-bottom:1px solid var(--steel-700);
}
.detail-table td{
  padding:9px 10px; border-bottom:1px solid var(--steel-800);
  color:var(--steel-300);
}
.detail-table td.num{ text-align:right; font-family:var(--font-mono); }
.detail-table tr:last-child td{ border-bottom:none; }
.detail-table .rpn{ font-weight:700; border-radius:4px; }
.detail-table .rpn.high{ color:var(--r); }
.detail-table .rpn.med{ color:var(--amber-deep); }
.detail-table .rpn.low{ color:var(--g); }


/* bottom trio: Achievements / Upcoming / Support, single full-width row */
.dash-grid-trio{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:16px;
  margin-bottom:32px;
  align-items:start;
}
@media(max-width:880px){ .dash-grid-trio{ grid-template-columns:1fr 1fr; } }
@media(max-width:560px){ .dash-grid-trio{ grid-template-columns:1fr; } }

/* ---- per-project History tab ---- */
.history-panel{ margin-bottom:32px; }
.history-list{
  display:flex; flex-direction:column; gap:8px;
  max-height:420px; overflow-y:auto;
  padding-right:4px;
}
.history-list::-webkit-scrollbar{ width:5px; }
.history-list::-webkit-scrollbar-thumb{ background:var(--steel-700); border-radius:4px; }
.history-row{
  display:grid;
  grid-template-columns:1fr 1.4fr auto;
  gap:14px;
  align-items:center;
  padding:10px 12px;
  background:var(--steel-800);
  border:1px solid var(--steel-700);
  border-radius:var(--radius-sm);
  font-size:14.5px;
}
@media(max-width:760px){ .history-row{ grid-template-columns:1fr; gap:4px; } }
.history-row-field{
  font-family:var(--font-display); font-weight:600;
  color:var(--steel-200);
}
.history-row-change{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:14px;
  overflow:hidden;
}
.history-old{ color:var(--steel-500); text-decoration:line-through; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.history-new{ color:var(--g); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.history-arrow{ color:var(--steel-600); flex:0 0 auto; }
.history-row-meta{
  font-family:var(--font-mono); font-size:13px;
  color:var(--steel-500); white-space:nowrap;
}

.topic-section{
  position:relative;
  text-align:left;
  background:var(--steel-800);
  border:1px solid var(--steel-700);
  border-radius:var(--radius-md);
  padding:0;
  font-family:inherit;
  color:inherit;
  display:flex; flex-direction:column;
  transition:border-color .18s var(--ease), background .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
  animation:fadeRise .4s var(--ease) both;
}
.topic-section-grid .topic-section:nth-child(1){ animation-delay:.02s; }
.topic-section-grid .topic-section:nth-child(2){ animation-delay:.06s; }
.topic-section-grid .topic-section:nth-child(3){ animation-delay:.1s; }
.topic-section-grid .topic-section:nth-child(4){ animation-delay:.14s; }
.topic-section-grid .topic-section:nth-child(5){ animation-delay:.18s; }
.topic-section-grid .topic-section:nth-child(6){ animation-delay:.22s; }
.topic-section:hover{
  border-color:var(--amber-deep);
  background:var(--steel-700);
  transform:translateY(-3px);
  box-shadow:var(--shadow-md);
}
.topic-section-open{
  appearance:none;
  background:none; border:none;
  text-align:left; font-family:inherit; color:inherit;
  cursor:pointer;
  padding:14px 16px;
  width:100%;
  display:flex; flex-direction:column; gap:8px;
}
.topic-del-btn{
  position:absolute; top:5px; right:5px;
  width:18px; height:18px;
  display:flex; align-items:center; justify-content:center;
  background:none; border:none;
  color:var(--steel-600);
  font-size:13px; line-height:1;
  cursor:pointer;
  border-radius:4px;
  z-index:2;
  transition:color .15s var(--ease), background .15s var(--ease);
}
.topic-del-btn:hover{ color:var(--r); background:rgba(216,51,42,0.12); }
.topic-section-top{
  display:flex; align-items:flex-start; justify-content:space-between; gap:8px;
}
.topic-section-name{
  font-weight:600; font-size:15px; color:var(--plate); line-height:1.35;
  border-radius:3px; padding:1px 3px; margin:-1px -3px;
}
.topic-section-name[contenteditable="true"]{ cursor:text; border-bottom:1px dashed transparent; }
.topic-section-name[contenteditable="true"]:hover{ border-bottom:1px dashed var(--steel-600); background:var(--steel-900); }
.topic-section-name[contenteditable="true"]:focus{ outline:1px solid var(--amber); background:var(--steel-900); }
.topic-section-name.locked{ cursor:not-allowed; opacity:0.92; }
.topic-section-meta{
  display:flex; gap:14px;
  font-family:var(--font-mono); font-size:13.5px; color:var(--steel-300);
}
.topic-section-meta .lbl{
  display:block; color:var(--steel-600); font-size:14px; letter-spacing:1px;
  text-transform:uppercase; margin-bottom:1px;
}
.topic-section-remarks{
  font-size:13.5px; color:var(--steel-500); line-height:1.4;
  border-top:1px dashed var(--steel-700); padding-top:8px;
}
.topic-section-link{
  margin-top:auto;
  display:flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:13px;
  color:var(--steel-600);
  padding-top:8px;
  border-top:1px dashed var(--steel-700);
  transition:color .15s var(--ease);
}
.topic-section:hover .topic-section-link{ color:var(--amber); }
.xlsx-ico{ font-size:14px; }

.ryg-dot{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:13px; font-weight:700;
  flex:0 0 auto;
}
.ryg-dot .d{ width:11px; height:11px; border-radius:50%; }
.ryg-dot .d.Y{ background:var(--y); box-shadow:0 0 8px rgba(240,162,2,.55);}
.ryg-dot .d.R{ background:var(--r); box-shadow:0 0 8px rgba(216,51,42,.55);}
.ryg-dot .d.G{ background:var(--g); box-shadow:0 0 8px rgba(47,168,79,.55);}
.ryg-dot .d.NA{ background:var(--steel-600); }
.ryg-select{
  background:var(--steel-800); border:1px solid var(--steel-700);
  color:var(--steel-100); font-family:var(--font-mono); font-size:13px;
  border-radius:4px; padding:3px 6px; cursor:pointer;
}
.editable-cell{ cursor:text; border-bottom:1px dashed transparent; }
.editable-cell:hover{ border-bottom:1px dashed var(--steel-600); }
.editable-cell:focus{ outline:1px solid var(--amber); border-radius:3px; }

/* NCR table */
.ncr-table{ width:100%; border-collapse:collapse; font-size:14.5px; margin-top:4px;}
.ncr-table th, .ncr-table td{
  text-align:center; padding:8px 6px;
  border:1px solid var(--steel-700);
  font-family:var(--font-mono);
}
.ncr-table th{
  background:var(--steel-800); color:var(--steel-300);
  font-size:13px; text-transform:uppercase; letter-spacing:0.5px;
}
.ncr-table td:first-child, .ncr-table th:first-child{ text-align:left; color:var(--steel-100); font-family:var(--font-body); font-weight:600;}
.ncr-table .g-col{ background:rgba(47,168,79,0.08); color:var(--g); font-weight:700;}
.ncr-table .y-col{ background:rgba(240,162,2,0.07); color:var(--y); }
.ncr-table .r-col{ background:rgba(216,51,42,0.08); color:var(--r); }
.ncr-table .total-col{ background:var(--steel-800); color:var(--plate); font-weight:700;}
.ncr-table tfoot td{ background:var(--steel-800); font-weight:700; color:var(--plate); }
.ncr-group-label{
  text-align:center; font-size:14.5px; color:var(--steel-500);
  text-transform:uppercase; letter-spacing:1px; padding-bottom:4px;
}

/* Facility Tracker matrix */
.facility-table-wrap{ overflow-x:auto; }
.facility-table{ width:100%; border-collapse:collapse; font-size:14px; min-width:1500px; }
.facility-table th, .facility-table td{
  padding:7px 9px; border:1px solid var(--steel-800); white-space:nowrap;
}
.facility-table th{
  background:var(--steel-800); color:var(--steel-500);
  font-size:14px; text-transform:uppercase; letter-spacing:0.4px; font-weight:600;
  text-align:left; position:sticky; top:0;
}
.facility-table td{ color:var(--steel-300); font-family:var(--font-mono); font-size:13.5px; }
.facility-table td.ft-op{ font-family:var(--font-body); color:var(--steel-100); font-weight:600; white-space:normal; min-width:170px; }
.facility-table td.ft-cost{ text-align:right; }
.facility-table td.ft-lead{ text-align:center; }
.facility-table .ft-date-input{
  background:none; border:none; color:var(--steel-300); font-family:var(--font-mono);
  font-size:13px; width:108px; padding:2px; border-radius:3px;
}
.facility-table .ft-date-input:hover{ background:var(--steel-800); }
.facility-table .ft-date-input:focus{ outline:1px solid var(--amber); background:var(--steel-900); }
.facility-table .ft-date-input:disabled{ color:var(--steel-500); cursor:not-allowed; }
.facility-table select.ft-select, .facility-table select.ft-status-select{
  background:var(--steel-900); color:var(--steel-300); border:1px solid var(--steel-700);
  border-radius:4px; font-family:inherit; font-size:13px; padding:3px 5px;
}
.facility-table select.ft-select:disabled, .facility-table select.ft-status-select:disabled{
  opacity:0.7; cursor:not-allowed;
}
.facility-status-chip{
  display:inline-flex; align-items:center; gap:5px; font-weight:700;
  font-family:var(--font-mono); font-size:13px; text-transform:uppercase; letter-spacing:0.3px;
}
.facility-status-chip.closed{ color:var(--g); }
.facility-status-chip.open{ color:var(--r); }
.facility-status-chip.on-track{ color:var(--y); }
.facility-row-del{
  background:none; border:none; color:var(--steel-600); cursor:pointer; font-size:14.5px;
  padding:2px 5px; border-radius:4px;
}
.facility-row-del:hover{ color:var(--r); background:rgba(216,51,42,0.12); }
.facility-row-del.locked{ opacity:0.4; cursor:not-allowed; }
.facility-section-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:16px; flex-wrap:wrap; margin-bottom:10px;
}
.facility-table-summary{
  display:flex; gap:16px; flex-wrap:wrap;
  font-family:var(--font-mono); font-size:13px; color:var(--steel-500);
  white-space:nowrap;
}
.ft-header-filter{
  background:var(--steel-900); color:var(--steel-300); border:1px solid var(--steel-600);
  border-radius:4px; font-family:var(--font-mono); font-size:14px; text-transform:uppercase;
  letter-spacing:0.4px; padding:3px 4px; cursor:pointer; max-width:90px;
}
.ft-header-filter:hover{ border-color:var(--amber-deep); }
.facility-filter-banner{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:rgba(224,142,0,0.08); border:1px solid var(--amber-deep);
  border-radius:6px; padding:7px 12px; margin-bottom:10px;
  font-family:var(--font-mono); font-size:13px; color:var(--amber-deep);
}
.facility-filter-clear{
  margin-left:auto; background:none; border:none; color:var(--amber-deep);
  font-family:inherit; font-size:13px; font-weight:700; cursor:pointer;
  text-decoration:underline; padding:0;
}
.facility-filter-clear:hover{ color:var(--r); }

/* list panels: achievements / upcoming / support */
.list-panel ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.list-panel li{
  display:flex; gap:10px; align-items:flex-start;
  font-size:15px; color:var(--steel-100); line-height:1.5;
}
.list-panel li .ico{ flex:0 0 auto; margin-top:3px; }
.list-panel.achievements li .ico{ color:var(--g); }
.list-panel.upcoming li .ico{ color:var(--amber); }
.list-panel.support li .ico{ color:var(--r); }
.list-panel li[contenteditable]{ outline:none; }
.list-panel li[contenteditable]:focus{ background:var(--steel-800); border-radius:4px; padding:2px 6px; margin:-2px -6px; }

.add-row-btn{
  margin-top:12px;
  font-family:var(--font-mono); font-size:13.5px;
  color:var(--steel-500); background:none; border:1px dashed var(--steel-700);
  border-radius:6px; padding:7px 12px; cursor:pointer; width:100%;
  transition:color .15s var(--ease), border-color .15s var(--ease), background .15s var(--ease);
}
.add-row-btn:hover{ color:var(--amber-deep); border-color:var(--amber-deep); background:rgba(224,142,0,0.06); }

/* extra block (key dates etc) */
.extra-panel ul{ list-style:none; margin:0; padding:0; }
.extra-panel li{
  padding:9px 0; border-bottom:1px dashed var(--steel-800);
  font-size:14.5px; color:var(--steel-200); display:flex; gap:8px;
}
.extra-panel li:last-child{ border-bottom:none; }
.extra-panel li::before{ content:"▸"; color:var(--amber); flex:0 0 auto; }

/* ---------- toast ---------- */
.toast{
  position:fixed; bottom:24px; left:50%;
  transform:translate(-50%, 20px);
  background:var(--steel-800);
  border:1px solid var(--amber-deep);
  color:var(--plate);
  font-family:var(--font-mono); font-size:14.5px;
  padding:11px 20px;
  border-radius:8px;
  opacity:0; pointer-events:none;
  transition:opacity .25s var(--ease), transform .25s var(--ease);
  z-index:200;
  box-shadow:0 16px 36px -8px rgba(255,255,255,0.25), 0 4px 12px rgba(255,255,255,0.1);
}
.toast.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }

/* ---------- responsive helpers ---------- */
@media(max-width:680px){
  .project-row{ grid-template-columns:auto 1fr; row-gap:8px; }
  .project-row-field{ display:none; }
  .project-row-field.always-show{ display:block; text-align:left; }
  .meta-strip{ grid-template-columns:repeat(2,1fr); }
}

/* ============================================================
   CLASS SELECT — count strip + project matrix
   ============================================================ */
.class-count-strip{
  display:flex; align-items:center; gap:8px; flex-shrink:0;
  margin-left:auto;
}
.class-count-pill{
  display:flex; flex-direction:column; align-items:center;
  background:var(--steel-850);
  border:1px solid var(--steel-700);
  border-radius:var(--radius-md);
  padding:8px 16px;
  cursor:pointer; min-width:64px;
  transition:border-color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease-spring);
}
.class-count-pill:hover{
  border-color:var(--amber);
  background:var(--steel-800);
  transform:translateY(-2px);
}
.class-count-pill.empty{ opacity:0.5; }
.class-count-pill-num{
  font-family:var(--font-display); font-weight:700; font-size:22px;
  color:var(--amber); line-height:1;
}
.class-count-pill-label{
  font-family:var(--font-mono); font-size:14px; letter-spacing:1px;
  text-transform:uppercase; color:var(--steel-500); margin-top:3px;
}

/* Project matrix */
.project-matrix-panel{ margin-bottom:40px; }
.project-matrix-wrap{ overflow-x:auto; }
.project-matrix-table{
  width:100%; border-collapse:collapse;
  font-size:15px;
}
.project-matrix-table thead th{
  text-align:left;
  font-family:var(--font-mono); font-size:13px;
  letter-spacing:1px; text-transform:uppercase;
  color:var(--steel-500);
  padding:10px 14px;
  border-bottom:2px solid var(--steel-700);
  background:var(--steel-900);
  white-space:nowrap;
}
.project-matrix-table thead th:first-child{ border-radius:var(--radius-sm) 0 0 0; }
.project-matrix-table thead th:last-child{ border-radius:0 var(--radius-sm) 0 0; }
.project-matrix-row{

  border-bottom:1px solid var(--steel-800);
}
.project-matrix-row:hover{ background:rgba(224,142,0,0.05); }
.project-matrix-row:hover .pmt-name .pmt-vehicle{ color:var(--amber); }
.project-matrix-row:last-child{ border-bottom:none; }
.project-matrix-table td{
  padding:12px 14px; vertical-align:middle;
}
.pmt-name{ display:flex; flex-direction:column; gap:2px; }
.pmt-vehicle{
  font-family:var(--font-display); font-weight:700; font-size:16px;
  color:var(--plate);

}
.pmt-code{

}
.pmt-class{ white-space:nowrap; }
.pmt-class-badge{
  font-family:var(--font-mono); font-weight:700; font-size:13px;

}
.pmt-change{

}
.pmt-cpm{

.pmt-status{

/* editable date field with strikethrough history */
.date-field-input{
  background:var(--steel-800); border:1px solid var(--steel-700);

}
.date-field-input:focus{
  outline:none; border-color:var(--amber-deep);

}
.date-history{
  display:flex; flex-direction:column; gap:2px;

}
.date-history-item{
  font-family:var(--font-mono); font-size:14.5px; color:var(--steel-500);
}
.date-history-item s{

}
.date-field-cell .val{ display:flex; flex-direction:column; gap:3px; }
.timeline-wrap::-webkit-scrollbar{ height:6px; }
.timeline-wrap::-webkit-scrollbar-thumb{ background:var(--steel-700); border-radius:4px; }

   LANDING PAGE — NEW LAYOUT
   ============================================================ */

/* TOP HALF: 3 charts in a row */
.landing-charts-section{

}
.landing-charts-grid{
  display:grid;
  grid-template-columns:1fr;

@media(min-width:760px){

}
.landing-chart-panel{

  flex-direction:column;
}
.landing-chart-panel .chart-body{

  align-items:center;
  justify-content:center;

}
.landing-bottom-grid{

.support-form-area{

.support-form-row{

}
.support-input{

  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.support-textarea:focus{

  box-shadow:0 0 0 3px rgba(224,142,0,0.15);
}
.support-submit-btn{
  align-self:flex-end; padding:7px 18px; font-size:14px;
}
.support-divider{ height:10px; }
.support-list{
  overflow-y:auto; flex:1;
  display:flex; flex-direction:column; gap:10px;
  padding:2px 0;
}
.support-list::-webkit-scrollbar{ width:5px; }
.support-list::-webkit-scrollbar-thumb{ background:var(--steel-700); border-radius:4px; }
.support-item{
  background:var(--steel-800);
  border:1px solid var(--steel-700);
  border-radius:6px; padding:11px 14px;
  display:flex; flex-direction:column; gap:6px;

}

}
.support-status{
  font-family:var(--font-mono); font-size:13px; font-weight:700;
  white-space:nowrap;
}
.support-date{

.support-msg{

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}


/* ============================================================
   MISSION CONTROL ENHANCEMENT LAYER
   Appended re-skin + motion system for the dark telemetry
   theme. Everything below intentionally overrides matching
   selectors above (same specificity, later in cascade).
   Sections:
     1. Atmosphere (aurora, grid, scrollbar, selection)
     2. Chrome (hazard beam, topbar, footer)
     3. Glass surface system + cursor spotlight
     4. Interactive cards (class / choice / project rows)
     5. Controls (buttons, inputs, selects)
     6. Data displays (tables, rings, gauges, gantt, pies)
     7. Overlays (modal, toast, login)
     8. Landing hero
     9. Motion & accessibility
   ============================================================ */

/* ---------- 1. atmosphere ---------- */
html{ scrollbar-color:#22304d var(--steel-950); }
body{
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(228,48,43,0.055), transparent 60%),
    radial-gradient(1000px 700px at -10% 30%, rgba(245,166,35,0.05), transparent 60%),
    var(--steel-950);
  overflow-x:hidden;
}

/* fine HUD grid, cool-blue on the void */
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,0) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0) 1px, transparent 1px);
  background-size:160px 160px, 160px 160px, 32px 32px, 32px 32px;
  background-position:-1px -1px;
  pointer-events:none;
  z-index:0;
  mask-image:linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 600px, rgba(0,0,0,0.22) 1400px, rgba(0,0,0,0.1) 100%);
}

/* drifting aurora — two slow luminous fields breathing behind the grid */
body::after{
  content:"";
  position:fixed; inset:-20%;
  background:
    radial-gradient(42% 34% at 24% 22%, rgba(228,48,43,0.075), transparent 70%),
    radial-gradient(38% 30% at 78% 68%, rgba(245,166,35,0.065), transparent 70%),
    radial-gradient(30% 26% at 62% 12%, rgba(255,178,36,0.035), transparent 70%);
  pointer-events:none;
  z-index:0;
  filter:blur(30px);
  animation:auroraDrift 26s ease-in-out infinite alternate;
}
@keyframes auroraDrift{
  0%  { transform:translate3d(-2%, -1%, 0) rotate(0.001deg) scale(1); }
  50% { transform:translate3d(2.5%, 2%, 0) scale(1.06); }
  100%{ transform:translate3d(-1.5%, 3%, 0) scale(1.02); }
}

/* content sits above atmosphere */
.topbar, main, .app-footer, .hazard-strip{ position:relative; z-index:1; }
.topbar{ z-index:50; }

/* scrollbar + selection */
::-webkit-scrollbar{ width:11px; height:11px; }
::-webkit-scrollbar-track{ background:var(--steel-950); }
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#22304d,#1a2540);
  border:2px solid var(--steel-950);
  border-radius:8px;
}
::-webkit-scrollbar-thumb:hover{ background:#31456e; }
::selection{ background:rgba(228,48,43,0.28); color:var(--steel-100); }

/* ---------- 2. chrome ---------- */
/* hazard strip → live telemetry beam */
.hazard-strip{
  height:3px;
  background:linear-gradient(90deg,
    transparent 0%, var(--volt-deep) 12%, var(--volt) 28%,
    var(--amber) 50%, var(--volt) 72%, var(--volt-deep) 88%, transparent 100%);
  background-size:220% 100%;
  animation:beamSweep 7s linear infinite;
  box-shadow:0 0 18px rgba(228,48,43,0.35), 0 1px 8px rgba(228,48,43,0.25);
}
@keyframes beamSweep{
  from{ background-position:0% 0; }
  to  { background-position:-220% 0; }
}

.topbar{
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(18px) saturate(1.5);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid var(--steel-700);
  box-shadow:0 10px 34px -18px rgba(0,0,0,0.12);
}
.brand-mark{
  background:none;
  -webkit-background-clip:border-box;
  background-clip:border-box;
  color:var(--volt);
  -webkit-text-fill-color:var(--volt);
  text-shadow:none;
  animation:none;
}
@keyframes brandShimmer{
  0%, 70%{ background-position:120% 0; }
  85%    { background-position:-40% 0; }
  100%   { background-position:-120% 0; }
}
.brand:hover .brand-mark{ animation-duration:2.4s; }
.clock{
  color:var(--volt);
  text-shadow:0 0 14px rgba(228,48,43,0.45);
}
.header-line-btn, .header-back-btn, .header-ctrl-btn{
  border:1px solid var(--line);
  background:rgba(19,28,48,0.5);
  color:var(--steel-300);
  transition:color .18s var(--ease), border-color .18s var(--ease),
             background .18s var(--ease), box-shadow .18s var(--ease),
             transform .18s var(--ease-spring);
}
.header-line-btn:hover, .header-back-btn:hover, .header-ctrl-btn:hover{
  color:var(--steel-100);
  border-color:rgba(228,48,43,0.5);
  background:rgba(228,48,43,0.08);
  box-shadow:0 0 0 1px rgba(228,48,43,0.15), 0 6px 20px -8px rgba(228,48,43,0.35);
  transform:translateY(-1px);
}
.header-line-btn:active, .header-back-btn:active, .header-ctrl-btn:active{ transform:translateY(0) scale(0.97); }

.app-footer{
  border-top:1px solid var(--line);
  color:var(--steel-500);
  background:#ffffff;
}

/* ---------- 3. glass surface system + cursor spotlight ---------- */
.panel, .chart-panel, .landing-chart-panel, .landing-bottom-panel,
.compact-panel, .topic-detail-panel, .budget-panel, .list-panel,
.history-panel, .project-matrix-panel, .spend-by-project-panel,
.topic-tracker-panel, .extra-panel, .cp-class-block,
.alert-item, .support-item, .topic-section{
  position:relative;
  background:var(--glass);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);
  box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.045);
}

/* cursor-tracking specular spotlight — the signature interaction.
   JS feeds --mx / --my per card; visible only while hovered. */
.panel::after, .chart-panel::after, .landing-chart-panel::after,
.landing-bottom-panel::after, .compact-panel::after,
.topic-detail-panel::after, .budget-panel::after, .list-panel::after,
.history-panel::after, .project-matrix-panel::after,
.spend-by-project-panel::after, .topic-tracker-panel::after,
.extra-panel::after, .class-card::after, .choice-card::after,
.project-row::after, .topic-section::after{
  content:"";
  position:absolute; inset:0;
  border-radius:inherit;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),
    rgba(228,48,43,0.09), rgba(228,48,43,0.03) 42%, transparent 68%);
  opacity:0;
  transition:opacity .35s var(--ease);
  pointer-events:none;
  z-index:0;
}
.panel:hover::after, .chart-panel:hover::after, .landing-chart-panel:hover::after,
.landing-bottom-panel:hover::after, .compact-panel:hover::after,
.topic-detail-panel:hover::after, .budget-panel:hover::after, .list-panel:hover::after,
.history-panel:hover::after, .project-matrix-panel:hover::after,
.spend-by-project-panel:hover::after, .topic-tracker-panel:hover::after,
.extra-panel:hover::after, .class-card:hover::after, .choice-card:hover::after,
.project-row:hover::after, .topic-section:hover::after{
  opacity:1;
}
/* keep panel contents above the spotlight film */
.panel > *, .chart-panel > *, .compact-panel > *, .budget-panel > *,
.list-panel > *, .history-panel > *, .topic-section > *,
.class-card > *, .choice-card > *, .project-row > *{
  position:relative; z-index:1;
}

/* keep GPU load low on screens with many cards: skip blur on repeated items */
.alert-item, .support-item, .topic-section, .cp-class-block{
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}

.panel-head, .cp-class-head, .facility-section-head{
  border-bottom:1px solid var(--line);
}
.panel-title, .section-title{ color:var(--steel-100); }
.section-hint{ color:var(--steel-500); }

/* ---------- 4. interactive cards ---------- */
.class-card{
  position:relative;
  background:var(--glass);
  border:1px solid var(--line);
  overflow:hidden;
  transition:transform .25s var(--ease-spring), border-color .25s var(--ease),
             box-shadow .25s var(--ease);
}
.class-card:hover{
  transform:translateY(-5px);
  border-color:rgba(228,48,43,0.45);
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(228,48,43,0.18),
             0 18px 44px -18px rgba(228,48,43,0.35);
  background:var(--glass);
}
.class-card:hover .class-num{ color:var(--volt); text-shadow:0 0 22px rgba(228,48,43,0.5); }
.class-card:focus-visible{ outline:2px solid var(--volt); outline-offset:3px; }
.class-card.empty:hover{ transform:none; border-color:var(--line); box-shadow:var(--shadow-md); }

.choice-card{
  background:var(--glass);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);
  box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,0.045);
}
.choice-card::before{
  background:linear-gradient(90deg, var(--volt), var(--violet));
  box-shadow:0 0 16px rgba(228,48,43,0.55);
}
.choice-card:hover{
  border-color:rgba(228,48,43,0.5);
  transform:translateY(-5px);
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(228,48,43,0.16),
             0 22px 52px -20px rgba(228,48,43,0.4);
}
.choice-card:focus-visible{ outline:2px solid var(--volt); outline-offset:3px; }
.choice-tag{ color:var(--volt); }

.project-row{
  position:relative;
  background:var(--glass);
  border:1px solid var(--line);
  overflow:hidden;
  transition:transform .22s var(--ease-spring), border-color .22s var(--ease),
             box-shadow .22s var(--ease);
}
.project-row:hover{
  transform:translateY(-3px);
  border-color:rgba(228,48,43,0.4);
  box-shadow:var(--shadow-lg), 0 0 0 1px rgba(228,48,43,0.14);
}
.project-row:hover .project-row-arrow{
  color:var(--volt);
  transform:translateX(5px);
  text-shadow:0 0 14px rgba(228,48,43,0.6);
}
.project-row-arrow{ transition:transform .22s var(--ease-spring), color .22s var(--ease); }
.project-row:focus-visible{ outline:2px solid var(--volt); outline-offset:3px; }

.cp-proj-row:hover{ background:rgba(228,48,43,0.05); }

.alert-item, .support-item{
  transition:transform .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.alert-item:hover, .support-item:hover{
  transform:translateY(-2px);
  border-color:var(--line-strong);
}

/* ---------- 5. controls ---------- */
.btn-primary{
  color:#031018;
  background:linear-gradient(135deg, #4fe6ff 0%, #17b6e0 100%);
  font-weight:700;
  box-shadow:0 4px 16px -4px rgba(228,48,43,0.45), inset 0 1px 0 rgba(255,255,255,0.35);
  text-shadow:none;
}
.btn-primary:hover{
  background:linear-gradient(135deg, #72ecff 0%, #23c4ef 100%);
  transform:translateY(-1px);
  box-shadow:0 8px 26px -6px rgba(228,48,43,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
}
.btn-primary:active{ transform:translateY(0) scale(0.98); }
.btn-primary:focus-visible{ outline:2px solid var(--volt); outline-offset:2px; }

.btn-ghost{
  border-color:var(--line-strong);
  color:var(--steel-300);
  transition:background .18s var(--ease), color .18s var(--ease),
             border-color .18s var(--ease), transform .18s var(--ease-spring);
}
.btn-ghost:hover{
  background:rgba(228,48,43,0.09);
  color:var(--steel-100);
  border-color:rgba(228,48,43,0.45);
}
.btn-ghost:active{ transform:scale(0.97); }

.btn-danger:hover{
  background:rgba(255,93,79,0.12);
  border-color:var(--r);
  box-shadow:0 0 0 1px rgba(255,93,79,0.2), 0 6px 20px -8px rgba(255,93,79,0.4);
}

.support-input, .support-textarea, .date-field-input, .milestone-date-input,
.ryg-select, .login-field input, .modal-field input, .modal-field select,
.modal-field textarea{
  background:#ffffff;
  border:1px solid var(--line-strong);
  color:var(--steel-100);
  color-scheme:light;
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
}
.support-input:focus, .support-textarea:focus, .date-field-input:focus,
.milestone-date-input:focus, .ryg-select:focus, .login-field input:focus,
.modal-field input:focus, .modal-field select:focus, .modal-field textarea:focus{
  outline:none;
  border-color:var(--volt);
  box-shadow:0 0 0 3px rgba(228,48,43,0.14), 0 0 18px -6px rgba(228,48,43,0.4);
  background:#ffffff;
}
input, select, textarea{ color-scheme:light; }

.editable-cell:hover{ background:rgba(228,48,43,0.06); }

/* ---------- 6. data displays ---------- */
.detail-table th, .facility-table th, .ncr-table th,
.spend-log-table th, .project-matrix-table th{
  color:var(--steel-400);
  border-bottom:1px solid var(--line-strong);
}
.detail-table td, .facility-table td, .ncr-table td,
.spend-log-table td, .project-matrix-table td{
  border-color:var(--line);
}
.facility-table tbody tr, .spend-log-table tbody tr,
.ncr-table tbody tr, .project-matrix-table tbody tr{
  transition:background .15s var(--ease);
}
.facility-table tbody tr:hover, .spend-log-table tbody tr:hover,
.ncr-table tbody tr:hover, .project-matrix-table tbody tr:hover{
  background:rgba(228,48,43,0.045);
}

/* completion rings — glow + slow sweep (JS animates dasharray in) */
.pct-ring-fg{
  transition:stroke-dasharray .9s var(--ease);
}
.pct-ring-fg.low{  filter:drop-shadow(0 0 4px rgba(255,93,79,0.55)); }
.pct-ring-fg.mid{  filter:drop-shadow(0 0 4px rgba(255,178,36,0.55)); }
.pct-ring-fg.done{ filter:drop-shadow(0 0 4px rgba(49,217,126,0.6)); }
.pct-ring-bg{ stroke:rgba(17,17,17,0.14); }
.pct-ring-label{ color:var(--steel-200); }

/* gauges & spend bars grow in and carry a moving sheen */
@keyframes growX{ from{ transform:scaleX(0); } }
.budget-gauge-fill, .spend-bar-fill{
  transform-origin:left center;
  animation:growX .9s var(--ease) both;
  position:relative;
  overflow:hidden;
}
.budget-gauge-fill::after, .spend-bar-fill::after{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);
  background-size:220% 100%;
  animation:sheenSweep 3.6s var(--ease) infinite;
}
@keyframes sheenSweep{
  0%, 55%{ background-position:130% 0; }
  100%   { background-position:-130% 0; }
}
.budget-gauge-wrap, .spend-bar-track{
  background:#f2f2f2;
  border:1px solid var(--line);
}

/* gantt segments cascade in; highlighted phase pulses */
.gatechart-flat-seg{ animation:fadeRise .5s var(--ease) both; }
.gatechart-flat-seg:nth-child(1){ animation-delay:.02s; }
.gatechart-flat-seg:nth-child(2){ animation-delay:.05s; }
.gatechart-flat-seg:nth-child(3){ animation-delay:.08s; }
.gatechart-flat-seg:nth-child(4){ animation-delay:.11s; }
.gatechart-flat-seg:nth-child(5){ animation-delay:.14s; }
.gatechart-flat-seg:nth-child(6){ animation-delay:.17s; }
.gatechart-flat-seg:nth-child(7){ animation-delay:.2s; }
.gatechart-flat-seg:nth-child(8){ animation-delay:.23s; }
.gatechart-flat-seg:nth-child(9){ animation-delay:.26s; }
.gatechart-flat-seg:nth-child(10){ animation-delay:.29s; }
.gatechart-flat-seg:nth-child(11){ animation-delay:.32s; }
.gatechart-flat-seg:nth-child(12){ animation-delay:.35s; }
.gatechart-flat-seg:nth-child(13){ animation-delay:.38s; }
.gatechart-flat-seg:nth-child(14){ animation-delay:.41s; }
.gatechart-flat-seg:nth-child(15){ animation-delay:.44s; }
.gatechart-flat-seg.phase-highlighted{
  animation:phasePulse 1.8s var(--ease) infinite;
}
@keyframes phasePulse{
  0%, 100%{ box-shadow:0 0 0 0 rgba(228,48,43,0.5); }
  50%     { box-shadow:0 0 0 5px rgba(228,48,43,0); }
}
.milestone-chip{
  transition:transform .18s var(--ease-spring), box-shadow .18s var(--ease);
}
.milestone-chip:hover{ transform:translateY(-2px); }

/* pies glow softly; slices brighten under the cursor */
.pie-svg{ filter:drop-shadow(0 10px 30px rgba(0,0,0,0.6)); }
.pie-svg path{ transition:filter .2s var(--ease), opacity .2s var(--ease); cursor:pointer; }
.pie-svg path:hover{ filter:brightness(1.28) drop-shadow(0 0 10px rgba(228,48,43,0.35)); }
.pie-center-num{ color:var(--steel-100); text-shadow:0 0 22px rgba(228,48,43,0.35); }

.status-banner{ border-color:var(--line-strong); }
.overbudget-chip{
  animation:phasePulseRed 2s var(--ease) infinite;
}
@keyframes phasePulseRed{
  0%, 100%{ box-shadow:0 0 0 0 rgba(255,93,79,0.4); }
  50%     { box-shadow:0 0 0 5px rgba(255,93,79,0); }
}

/* ---------- 7. overlays ---------- */
.modal-overlay{
  background:rgba(2,4,10,0.72);
  backdrop-filter:blur(10px) saturate(1.2);
  -webkit-backdrop-filter:blur(10px) saturate(1.2);
}
.modal-card{
  background:linear-gradient(180deg, rgba(21,31,54,0.92), rgba(10,16,30,0.95));
  border:1px solid var(--line-strong);
  box-shadow:0 40px 100px -20px rgba(0,0,0,0.9),
             0 0 0 1px rgba(228,48,43,0.07),
             inset 0 1px 0 rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
/* ---- Control Panel + Login modal: pure white surface ---- */
.modal-box, .login-modal{
  background:#ffffff;
  border:1px solid #e6e6e6;
  box-shadow:0 40px 100px -20px rgba(17,17,17,0.22),
             0 0 0 1px rgba(17,17,17,0.03),
             inset 0 1px 0 rgba(255,255,255,0.6);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.modal-head{ border-bottom:1px solid var(--line); }

.toast{
  background:linear-gradient(180deg, rgba(21,31,54,0.95), rgba(10,16,30,0.96));
  border:1px solid rgba(228,48,43,0.45);
  box-shadow:0 18px 44px -10px rgba(0,0,0,0.8), 0 0 24px -6px rgba(228,48,43,0.35);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

/* ---------- 8. landing hero ---------- */
.landing-eyebrow{ color:var(--volt); }
.landing-eyebrow::before, .landing-eyebrow::after{
  background:linear-gradient(90deg, transparent, var(--volt-deep));
  box-shadow:0 0 10px rgba(228,48,43,0.4);
}
.landing-eyebrow::after{ background:linear-gradient(90deg, var(--volt-deep), transparent); }
.landing-title{
  background:linear-gradient(180deg, #111111 15%, #2f2f2f 70%, #565656 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
}
.landing-title .accent{
  background:linear-gradient(92deg, var(--volt) 0%, #ff6a5f 45%, var(--volt) 100%);
  background-size:200% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  animation:brandShimmer 6s var(--ease) infinite;
  filter:drop-shadow(0 0 26px rgba(228,48,43,0.35));
}
.landing-sub{ color:var(--steel-400); }

/* ---------- 9. motion & accessibility ---------- */
.screen{ animation:screenIn .5s var(--ease); }
@keyframes screenIn{
  from{ opacity:0; transform:translateY(12px); }
  to  { opacity:1; transform:translateY(0); }
}

a:focus-visible, button:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--volt);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  body::after{ animation:none; }
  .hazard-strip{ animation:none; background-position:50% 0; }
  .brand-mark, .landing-title .accent{ animation:none; }
  .budget-gauge-fill, .spend-bar-fill, .gatechart-flat-seg, .screen{ animation:none; }
  .budget-gauge-fill::after, .spend-bar-fill::after{ animation:none; display:none; }
  .gatechart-flat-seg.phase-highlighted, .overbudget-chip{ animation:none; }
  .panel::after, .class-card::after, .choice-card::after, .project-row::after{ transition:none; }
}


/* ============================================================
   FX SIMULATION LAYER
   WebGL nebula canvas, 3D card tilt, ripples, scroll beam,
   boot sequence, and text-decode effects. Injected after the
   Mission Control layer; JS lives in the FX ENGINE script.
   ============================================================ */

/* GPU nebula — replaces the CSS aurora when WebGL is available */
#fxCanvas{
  position:fixed; inset:0;
  width:100vw; height:100vh;
  z-index:0;
  pointer-events:none;
  opacity:0;
  transition:opacity 1.2s var(--ease);
}
html.has-webgl #fxCanvas{ opacity:1; }
html.has-webgl body::after{ display:none; }   /* shader supersedes CSS aurora */

/* 3D tilt — interactive cards respond to the cursor in space */
.class-card, .choice-card, .project-row{
  will-change:transform;
  transform-style:preserve-3d;
}
.class-card:hover{
  transform:perspective(900px)
    rotateX(var(--tiltx,0deg)) rotateY(var(--tilty,0deg))
    translateY(-5px);
}
.choice-card:hover{
  transform:perspective(900px)
    rotateX(var(--tiltx,0deg)) rotateY(var(--tilty,0deg))
    translateY(-5px);
}
.project-row:hover{
  transform:perspective(1200px)
    rotateX(var(--tiltx,0deg)) rotateY(var(--tilty,0deg))
    translateY(-3px);
}

/* button ripple */
.btn-primary, .btn-ghost, .btn-danger,
.header-line-btn, .header-back-btn, .header-ctrl-btn,
.support-submit-btn, .add-row-btn, .cp-add-proj-btn{
  position:relative;
  overflow:hidden;
}
.fx-ripple{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 65%);
  transform:scale(0);
  animation:rippleGo .55s var(--ease) forwards;
  pointer-events:none;
}
@keyframes rippleGo{
  to{ transform:scale(1); opacity:0; }
}

/* scroll progress beam */
#scrollBeam{
  position:fixed; top:0; left:0;
  height:2px; width:0;
  z-index:60;
  background:linear-gradient(90deg, var(--volt), var(--violet));
  box-shadow:0 0 14px rgba(228,48,43,0.65);
  pointer-events:none;
}

/* boot sequence — once per session */
#bootOverlay{
  position:fixed; inset:0; z-index:999;
  background:
    radial-gradient(900px 500px at 50% 40%, rgba(228,48,43,0.05), transparent 70%),
    #04070e;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px;
  cursor:pointer;
  transition:opacity .5s var(--ease);
}
#bootOverlay.done{ opacity:0; pointer-events:none; }
.boot-logo{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(20px, 4vw, 34px);
  letter-spacing:6px;
  text-transform:uppercase;
  background:linear-gradient(92deg, var(--steel-100), var(--volt), var(--steel-100));
  background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
  animation:brandShimmer 2.2s var(--ease) infinite;
}
.boot-bar{
  width:min(340px, 70vw); height:3px;
  background:rgba(17,17,17,0.12);
  border-radius:2px; overflow:hidden;
}
.boot-bar i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg, var(--volt), var(--violet));
  box-shadow:0 0 16px rgba(228,48,43,0.8);
  transition:width .18s var(--ease);
}
.boot-line{
  font-family:var(--font-mono);
  font-size:13px; letter-spacing:2.5px;
  color:var(--steel-500);
  text-transform:uppercase;
  min-height:14px;
}

@media (prefers-reduced-motion: reduce){
  #fxCanvas{ display:none; }
  html.has-webgl body::after{ display:block; }
  .class-card:hover, .choice-card:hover{ transform:translateY(-5px); }
  .project-row:hover{ transform:translateY(-3px); }
  .fx-ripple{ display:none; }
}


/* ============================================================
   HIGHWAY THEME LAYER — Eicher red / asphalt / plate yellow.
   Applied on top of the mission-control skin: same structure,
   new paint job. Anton display type, number-plate code chips,
   hazard-amber lane accents.
   ============================================================ */
:root{
  --plate-yellow:#f7c948;
}
/* Anton is naturally tight & loud — relax tracking vs Space Grotesk */
.brand-mark, .landing-title, .boot-logo{ letter-spacing:2px; font-weight:400; }
h1,h2,h3{ font-weight:400; }
.landing-title{ line-height:.98; }

/* hazard strip: cyan-era gradient -> true road hazard chevrons */
.hazard-strip{
  background:repeating-linear-gradient(-45deg,
    var(--amber) 0 16px, var(--steel-950) 16px 32px) !important;
  animation:none !important;
  height:8px;
}

/* number-plate treatment for project codes in list rows & meta chips */
.project-code, .meta-chip.code, .tc-plate{
  font-family:var(--font-mono);
  background:var(--plate-yellow) !important;
  color:#141414 !important;
