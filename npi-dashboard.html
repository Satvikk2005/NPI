<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPI Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
   NPI DASHBOARD — STYLES
   Design language: night-shift mission control.
   Deep carbon-blue telemetry console: glass panels on a void
   background with a drifting aurora, electric-cyan (--volt)
   system accent, hazard-amber reserved for caution, safety-red
   for risk, signal-green for go. Space Grotesk display type,
   monospace for week-codes / data, clean sans for body copy.
   The base layout rules below are inherited from earlier
   builds; the "MISSION CONTROL ENHANCEMENT LAYER" at the end
   of this style block re-skins every surface for the dark
   telemetry theme and adds the motion system.
   ============================================================ */

      :root {
        /* ---- palette — "night-shift mission control" mode ----
     Deep carbon-blue telemetry console. Same variable names as
     every previous build; the tonal ramp is dark-first again so
     --steel-950 is the void background and --steel-100 is the
     light ink. Every existing var(--steel-*) reference keeps
     working with correct contrast.
     New in this build: --volt (electric cyan) is the system /
     interaction accent; --amber stays reserved for caution
     semantics so G/Y/R status meaning is untouched. ---- */
        --steel-950: #ffffff; /* page background — void */
        --steel-900: #ffffff; /* secondary background / hero wash */
        --steel-850: #ffffff; /* card surface (glass base) */
        --steel-800: #ffffff; /* subtle fill / hover surface */
        --steel-700: #e6e6e6; /* borders, dividers */
        --steel-600: #d5d5d5; /* faint borders, disabled */
        --steel-500: #6f6f6f; /* muted text, captions */
        --steel-400: #565656; /* muted text, slightly stronger */
        --steel-300: #3e3e3e; /* secondary ink */
        --steel-200: #2a2a2a; /* secondary ink, stronger */
        --steel-100: #111111; /* primary ink */
        --plate: #111111;

        --amber: #f5a623;
        --amber-deep: #c07f10;
        --safety-red: #ff5d4f;
        --safety-red-deep: #c93a2e;
        --signal-green: #31d97e;
        --signal-green-deep: #1fa35c;
        --info-blue: #57a8ff;

        --g: #31d97e;
        --y: #ffb224;
        --r: #ff5d4f;
        --na: #6e7ea3;

        /* system accent — electric cyan telemetry */
        --volt: #e4302b;
        --volt-deep: #b31f1c;
        --violet: #f5a623;
        --line: rgba(17, 17, 17, 0.1);
        --line-strong: rgba(17, 17, 17, 0.22);
        --glass: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.96),
          rgba(255, 255, 255, 0.98)
        );

        /* surface elevation — deep space + luminous edge */
        --shadow-sm:
          0 1px 2px rgba(0, 0, 0, 0.07), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        --shadow-md:
          0 10px 26px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.05);
        --shadow-lg:
          0 28px 64px rgba(0, 0, 0, 0.12), 0 6px 18px rgba(0, 0, 0, 0.07);
        --shadow-amber: 0 8px 28px rgba(255, 178, 36, 0.22);
        --shadow-volt: 0 8px 28px rgba(228, 48, 43, 0.3);

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 14px;

        --font-display: "Archivo", sans-serif;
        --font-body: "Archivo", -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: "IBM Plex Mono", "SFMono-Regular", Menlo, monospace;

        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--steel-950);
        color: var(--steel-100);
        font-family: var(--font-body);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- signature texture: faint engineering blueprint grid ----------
   A fine graph-paper cross-hatch plus a slightly heavier line every 5th
   cell, the way a real drafting sheet is ruled. Sits at ~3% opacity so
   it reads as material, not decoration. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.05) 1px,
            transparent 1px
          ),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px
          );
        background-size:
          160px 160px,
          160px 160px,
          32px 32px,
          32px 32px;
        background-position: -1px -1px;
        pointer-events: none;
        z-index: 0;
        mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.35) 600px,
          rgba(0, 0, 0, 0.18) 1400px,
          rgba(0, 0, 0, 0.08) 100%
        );
      }

      button {
        font-family: inherit;
      }

      /* ---------- page-load choreography ---------- */
      @keyframes fadeRise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .stagger-in {
        animation: fadeRise 0.6s var(--ease) both;
      }
      .stagger-in:nth-child(1) {
        animation-delay: 0.02s;
      }
      .stagger-in:nth-child(2) {
        animation-delay: 0.08s;
      }
      .stagger-in:nth-child(3) {
        animation-delay: 0.14s;
      }
      .stagger-in:nth-child(4) {
        animation-delay: 0.2s;
      }
      .stagger-in:nth-child(5) {
        animation-delay: 0.26s;
      }
      .stagger-in:nth-child(6) {
        animation-delay: 0.32s;
      }

      /* ---------- hazard strip ---------- */
      .hazard-strip {
        height: 5px;
        width: 100%;
        background: repeating-linear-gradient(
          -45deg,
          var(--amber) 0 14px,
          var(--steel-950) 14px 28px
        );
      }

      /* ---------- topbar ---------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(251, 251, 250, 0.86);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--steel-700);
      }
      .topbar-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
      }
      .brand-mark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.5px;
        color: var(--amber);
        border: 2px solid var(--amber);
        padding: 6px 16px;
        border-radius: var(--radius-sm);
        line-height: 1;
        white-space: nowrap;
        transition:
          transform 0.2s var(--ease-spring),
          box-shadow 0.2s var(--ease);
      }
      .brand:hover .brand-mark {
        transform: translateY(-1px);
        box-shadow: var(--shadow-amber);
      }
      .brand-name {
        font-family: var(--font-display);
        font-weight: 500;
        font-size: 14.5px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--steel-300);
        display: none;
      }
      @media (min-width: 640px) {
        .brand-name {
          display: inline;
        }
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-left: auto;
      }
      .clock {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--steel-500);
        display: none;
      }
      @media (min-width: 480px) {
        .clock {
          display: inline;
        }
      }

      /* Header MHD / HD buttons */
      .header-line-btn {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 1px;
        color: var(--steel-200);
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-sm);
        padding: 9px 22px;
        cursor: pointer;
        transition:
          background 0.15s var(--ease),
          color 0.15s var(--ease),
          border-color 0.15s var(--ease),
          transform 0.15s var(--ease-spring);
      }
      .header-line-btn:hover {
        background: var(--amber);
        color: #ffffff;
        border-color: var(--amber);
        transform: translateY(-1px);
      }
      .header-line-btn.active {
        background: var(--amber);
        color: #ffffff;
        border-color: var(--amber-deep);
      }

      /* Header Back button — shown only on topic detail screen */
      .header-back-btn {
        font-family: var(--font-mono);
        font-weight: 600;
        font-size: 13.5px;
        letter-spacing: 0.5px;
        color: var(--steel-300);
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-sm);
        padding: 5px 14px;
        cursor: pointer;
        display: none;
        align-items: center;
        gap: 5px;
        transition:
          background 0.15s var(--ease),
          color 0.15s var(--ease),
          border-color 0.15s var(--ease);
      }
      .header-back-btn.visible {
        display: flex;
      }
      .header-back-btn:hover {
        background: var(--steel-800);
        color: var(--amber);
        border-color: var(--amber);
      }

      /* Header Control Panel button */
      .header-ctrl-btn {
        font-family: var(--font-mono);
        font-weight: 600;
        font-size: 13.5px;
        letter-spacing: 0.5px;
        color: var(--steel-300);
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-sm);
        padding: 5px 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        transition:
          background 0.15s var(--ease),
          color 0.15s var(--ease),
          border-color 0.15s var(--ease);
      }
      .header-ctrl-btn:hover {
        background: var(--steel-800);
        color: var(--plate);
        border-color: var(--steel-600);
      }
      .header-ctrl-btn.logged-in {
        color: var(--g);
        border-color: rgba(47, 168, 79, 0.4);
      }
      .header-ctrl-btn.logged-in:hover {
        border-color: var(--g);
      }

      /* ---------- footer ---------- */
      .app-footer {
        position: relative;
        z-index: 1;
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 24px 40px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: var(--steel-600);
        font-family: var(--font-mono);
      }
      .app-footer .dot {
        color: var(--steel-700);
      }

      main#app {
        position: relative;
        z-index: 1;
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
        min-height: 60vh;
      }

      /* ============================================================
   SCREEN: LANDING
   ============================================================ */
      .screen {
        position: relative;
        animation: screenIn 0.38s var(--ease);
      }
      @keyframes screenIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .landing {
        min-height: 72vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 48px 0 32px;
      }
      .landing-eyebrow {
        font-family: var(--font-mono);
        font-size: 14.5px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--amber);
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .landing-eyebrow::before,
      .landing-eyebrow::after {
        content: "";
        width: 28px;
        height: 1px;
        background: var(--amber-deep);
      }
      .landing-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(48px, 9vw, 96px);
        letter-spacing: 1px;
        line-height: 0.95;
        margin: 0;
        color: var(--plate);
        text-transform: uppercase;
      }
      .landing-title .accent {
        color: var(--amber);
      }
      .landing-sub {
        margin: 18px 0 56px;
        font-size: 16.5px;
        color: var(--steel-300);
        max-width: 480px;
        line-height: 1.6;
      }

      .choice-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        width: 100%;
        max-width: 780px;
      }
      @media (min-width: 640px) {
        .choice-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .choice-card {
        position: relative;
        background: linear-gradient(160deg, var(--steel-850), var(--steel-900));
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-lg);
        padding: 36px 28px;
        cursor: pointer;
        text-align: left;
        overflow: hidden;
        transition:
          border-color 0.2s var(--ease),
          transform 0.2s var(--ease),
          box-shadow 0.2s var(--ease);
      }
      .choice-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--amber);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.25s var(--ease);
      }
      .choice-card:hover {
        border-color: var(--amber-deep);
        transform: translateY(-4px);
        box-shadow:
          var(--shadow-lg),
          0 0 0 1px rgba(224, 142, 0, 0.12);
      }
      .choice-card:hover::before {
        transform: scaleX(1);
      }
      .choice-card:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 3px;
      }

      .choice-tag {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 2px;
        color: var(--steel-500);
        text-transform: uppercase;
      }
      .choice-label {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 42px;
        color: var(--plate);
        margin: 6px 0 10px;
        letter-spacing: 0.5px;
      }
      .choice-desc {
        font-size: 15px;
        color: var(--steel-300);
        line-height: 1.55;
        margin-bottom: 18px;
      }
      .choice-meta {
        display: flex;
        gap: 16px;
        font-family: var(--font-mono);
        font-size: 13.5px;
        color: var(--steel-500);
        padding-top: 14px;
        border-top: 1px dashed var(--steel-700);
      }
      .choice-meta b {
        color: var(--amber);
        font-weight: 600;
      }

      /* ---------- landing analytics: pie charts ---------- */
      .analytics-section {
        max-width: 920px;
        margin: 0 auto 64px;
        padding-top: 8px;
      }
      .analytics-section .section-head {
        justify-content: center;
        text-align: center;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 32px;
      }
      .analytics-section .section-title {
        font-size: clamp(22px, 3.4vw, 30px);
      }

      .chart-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }
      @media (min-width: 760px) {
        .chart-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .chart-panel {
        display: flex;
        flex-direction: column;
      }
      .chart-body {
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .pie-svg {
        flex: 0 0 auto;
      }
      .pie-svg path {
        transition:
          opacity 0.15s var(--ease),
          transform 0.15s var(--ease);
        transform-origin: center;
        cursor: pointer;
        animation: wedgeIn 0.55s var(--ease-spring) both;
      }
      .pie-svg path:hover {
        opacity: 0.82;
        transform: scale(1.035);
      }
      @keyframes wedgeIn {
        from {
          opacity: 0;
          transform: scale(0.4) rotate(-50deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
      .pie-center-num {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 30px;
        fill: var(--plate);
        animation: fadeRise 0.4s var(--ease) 0.3s both;
      }
      .pie-center-lbl {
        font-family: var(--font-mono);
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
        fill: var(--steel-500);
      }

      .chart-legend {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 9px;
        flex: 1 1 160px;
        min-width: 150px;
      }
      .chart-legend li {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14.5px;
        color: var(--steel-200);
        animation: fadeRise 0.4s var(--ease) both;
      }
      .chart-legend li:nth-child(1) {
        animation-delay: 0.08s;
      }
      .chart-legend li:nth-child(2) {
        animation-delay: 0.14s;
      }
      .chart-legend li:nth-child(3) {
        animation-delay: 0.2s;
      }
      .chart-legend li:nth-child(4) {
        animation-delay: 0.26s;
      }
      .chart-legend li:nth-child(5) {
        animation-delay: 0.32s;
      }
      .chart-legend .swatch {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        flex: 0 0 auto;
        transition: transform 0.15s var(--ease-spring);
      }
      .chart-legend li:hover .swatch {
        transform: scale(1.3);
      }
      .chart-legend .legend-label {
        flex: 1;
      }
      .chart-legend .legend-value {
        font-family: var(--font-mono);
        font-weight: 600;
        color: var(--plate);
        font-size: 14.5px;
      }

      /* ---------- landing analytics: bar charts (vertical columns) ---------- */
      .bar-chart-wrap {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .bar-chart-total {
        font-family: var(--font-display);
        font-weight: 800;
        font-size: 24px;
        color: var(--plate);
        text-align: center;
        flex: 0 0 auto;
      }
      .bar-chart-total span {
        display: block;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--steel-500);
        margin-top: 2px;
      }
      .bar-chart-list {
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        justify-content: center;
        gap: 16px;
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        padding: 4px 8px 0;
      }
      .bar-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        height: 100%;
        min-width: 40px;
        flex: 0 0 auto;
        animation: fadeRise 0.4s var(--ease) both;
      }
      .bar-row:nth-child(1) {
        animation-delay: 0.06s;
      }
      .bar-row:nth-child(2) {
        animation-delay: 0.12s;
      }
      .bar-row:nth-child(3) {
        animation-delay: 0.18s;
      }
      .bar-row:nth-child(4) {
        animation-delay: 0.24s;
      }
      .bar-row:nth-child(5) {
        animation-delay: 0.3s;
      }
      .bar-row:nth-child(n + 6) {
        animation-delay: 0.34s;
      }
      .bar-row-value {
        font-family: var(--font-mono);
        font-weight: 600;
        font-size: 12px;
        color: var(--plate);
        white-space: nowrap;
        flex: 0 0 auto;
        text-align: center;
      }
      .bar-row-pct {
        display: block;
        font-weight: 500;
        font-size: 10px;
        color: var(--steel-500);
      }
      .bar-track {
        position: relative;
        width: 28px;
        flex: 1 1 auto;
        min-height: 0;
        border-radius: 7px 7px 3px 3px;
        background: var(--steel-800);
        border: 1px solid var(--line);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .bar-fill {
        width: 100%;
        border-radius: 7px 7px 3px 3px;
        animation: barGrow 0.7s var(--ease-spring) both;
        transition:
          filter 0.2s var(--ease),
          opacity 0.2s var(--ease);
      }
      .bar-track:hover .bar-fill {
        filter: brightness(1.2);
      }
      @keyframes barGrow {
        from {
          transform: scaleY(0);
          transform-origin: bottom;
        }
        to {
          transform: scaleY(1);
          transform-origin: bottom;
        }
      }
      .bar-row-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        flex: 0 0 auto;
        max-width: 58px;
      }
      .bar-row-label .swatch {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex: 0 0 auto;
      }
      .bar-row-name {
        font-size: 10.5px;
        line-height: 1.2;
        color: var(--steel-300);
        text-align: center;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .bar-chart-list-scroll {
        justify-content: flex-start !important;
      }
      .bar-empty {
        color: var(--steel-600);
        font-style: italic;
        font-size: 14px;
        text-align: center;
        padding: 20px 0;
      }

      /* ============================================================
   BUDGET — pool strip (landing) + project budget panel
   ============================================================ */
      .budget-section {
        max-width: 920px;
        margin: 0 auto 56px;
      }
      .budget-section .section-head {
        margin-bottom: 20px;
      }

      .budget-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1px;
        background: var(--steel-700);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-lg);
        overflow: hidden;
        margin-bottom: 14px;
      }
      .budget-cell {
        background: var(--steel-850);
        padding: 18px 18px;
        transition: background 0.2s var(--ease);
        animation: fadeRise 0.5s var(--ease) both;
      }
      .budget-strip .budget-cell:nth-child(1) {
        animation-delay: 0.04s;
      }
      .budget-strip .budget-cell:nth-child(2) {
        animation-delay: 0.09s;
      }
      .budget-strip .budget-cell:nth-child(3) {
        animation-delay: 0.14s;
      }
      .budget-strip .budget-cell:nth-child(4) {
        animation-delay: 0.19s;
      }
      .budget-strip .budget-cell:nth-child(5) {
        animation-delay: 0.24s;
      }
      .budget-cell:hover {
        background: var(--steel-800);
      }
      .budget-cell .lbl {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--steel-500);
        margin-bottom: 6px;
      }
      .budget-cell .val {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 22px;
        color: var(--plate);
      }
      .budget-cell .sub {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-600);
        margin-top: 4px;
      }
      .budget-cell.spent .val {
        color: var(--info-blue);
      }
      .budget-cell.committed .val {
        color: var(--amber);
      }
      .budget-cell.remaining .val {
        color: var(--g);
      }
      .budget-cell.remaining.negative .val {
        color: var(--r);
      }

      .budget-gauge-wrap {
        padding: 0 2px;
      }
      .budget-gauge {
        position: relative;
        height: 14px;
        background: var(--steel-800);
        border-radius: 7px;
        overflow: hidden;
        border: 1px solid var(--steel-700);
      }
      .budget-gauge-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        transition: width 0.3s var(--ease);
        animation: gaugeFillIn 0.9s var(--ease) both;
        transform-origin: left;
      }
      @keyframes gaugeFillIn {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      .budget-gauge-fill.spent {
        background: linear-gradient(90deg, var(--info-blue), #5aa6dd);
        z-index: 2;
      }
      .budget-gauge-fill.committed {
        background: repeating-linear-gradient(
          45deg,
          var(--amber) 0 6px,
          var(--amber-deep) 6px 12px
        );
        z-index: 1;
        animation-delay: 0.15s;
      }
      .budget-gauge-legend {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 10px;
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-400);
      }
      .budget-gauge-legend .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        margin-right: 5px;
        vertical-align: middle;
      }
      .budget-gauge-legend .dot.spent {
        background: var(--info-blue);
      }
      .budget-gauge-legend .dot.committed {
        background: var(--amber);
      }
      .budget-gauge-legend .dot.free {
        background: var(--steel-700);
        border: 1px solid var(--steel-600);
      }
      .budget-gauge-legend .overbudget-text {
        color: var(--r);
        font-weight: 600;
        margin-left: auto;
      }

      .overbudget-chip {
        display: inline-flex;
        align-items: center;
        font-family: var(--font-mono);
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
        background: rgba(216, 51, 42, 0.15);
        color: var(--r);
        border: 1px solid rgba(216, 51, 42, 0.4);
        border-radius: 4px;
        padding: 2px 7px;
        margin-left: 8px;
      }

      /* per-project budget panel (sits full-width above timeline) */
      .budget-panel {
        margin-bottom: 32px;
      }
      .proj-budget-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 1px;
        background: var(--steel-700);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-md);
        overflow: hidden;
        margin-bottom: 16px;
      }
      .proj-budget-strip .budget-cell {
        padding: 14px 16px;
      }
      .proj-budget-strip .budget-cell .val {
        font-size: 18px;
      }

      .spend-log-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 22px 0 10px;
      }
      .spend-log-title {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--steel-500);
      }
      .spend-log-count {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-600);
      }
      .spend-log-table-wrap {
        overflow-x: auto;
      }
      .spend-log-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14.5px;
        min-width: 560px;
      }
      .spend-log-table th {
        text-align: left;
        font-family: var(--font-mono);
        font-size: 14.5px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--steel-500);
        padding: 7px 8px;
        border-bottom: 1px solid var(--steel-700);
      }
      .spend-log-table td {
        padding: 9px 8px;
        border-bottom: 1px solid var(--steel-800);
        color: var(--steel-100);
        vertical-align: middle;
      }
      .spend-log-table tr:last-child td {
        border-bottom: none;
      }
      .spend-date {
        font-family: var(--font-mono);
        font-size: 13.5px;
        color: var(--steel-400);
        white-space: nowrap;
      }
      .spend-note {
        color: var(--steel-400);
        font-size: 14px;
      }
      .spend-amount {
        font-family: var(--font-mono);
        font-weight: 600;
        color: var(--plate);
        white-space: nowrap;
        text-align: right;
      }
      .spend-cat-chip {
        font-family: var(--font-mono);
        font-size: 13px;
        background: var(--steel-800);
        color: var(--steel-300);
        border: 1px solid var(--steel-700);
        border-radius: 4px;
        padding: 2px 7px;
        white-space: nowrap;
      }
      .spend-type-chip {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 600;
        border-radius: 4px;
        padding: 2px 7px;
        white-space: nowrap;
      }
      .spend-type-chip.spent {
        background: rgba(58, 143, 209, 0.12);
        color: var(--info-blue);
        border: 1px solid rgba(58, 143, 209, 0.35);
      }
      .spend-type-chip.committed {
        background: rgba(240, 162, 2, 0.12);
        color: var(--amber);
        border: 1px solid rgba(240, 162, 2, 0.35);
      }
      .spend-del-btn {
        background: none;
        border: none;
        color: var(--steel-600);
        cursor: pointer;
        font-size: 14.5px;
        padding: 2px 4px;
        transition: color 0.15s var(--ease);
      }
      .spend-del-btn:hover {
        color: var(--r);
      }

      /* spend-by-project bar chart (landing page) */
      .spend-bar-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .spend-bar-row {
        cursor: pointer;
        display: grid;
        grid-template-columns: 1fr;
        gap: 5px;
        padding: 4px 0;
        border-radius: 6px;
        transition: background 0.15s var(--ease);
      }
      .spend-bar-row:hover {
        background: var(--steel-800);
        padding: 4px 8px;
        margin: 0 -8px;
      }
      .spend-bar-label {
        font-size: 14.5px;
        color: var(--steel-200);
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .spend-bar-track {
        height: 8px;
        background: var(--steel-800);
        border-radius: 4px;
        overflow: hidden;
      }
      .spend-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--amber-deep), var(--amber));
        border-radius: 4px;
        transition: width 0.3s var(--ease);
        transform-origin: left;
        animation: gaugeFillIn 0.7s var(--ease) both;
      }
      .spend-bar-fill.over {
        background: linear-gradient(
          90deg,
          var(--safety-red-deep),
          var(--safety-red)
        );
      }
      .spend-bar-row:nth-child(1) .spend-bar-fill {
        animation-delay: 0.05s;
      }
      .spend-bar-row:nth-child(2) .spend-bar-fill {
        animation-delay: 0.1s;
      }
      .spend-bar-row:nth-child(3) .spend-bar-fill {
        animation-delay: 0.15s;
      }
      .spend-bar-row:nth-child(4) .spend-bar-fill {
        animation-delay: 0.2s;
      }
      .spend-bar-row:nth-child(5) .spend-bar-fill {
        animation-delay: 0.25s;
      }
      .spend-bar-row:nth-child(6) .spend-bar-fill {
        animation-delay: 0.3s;
      }
      .spend-bar-row:nth-child(7) .spend-bar-fill {
        animation-delay: 0.35s;
      }
      .spend-bar-row:nth-child(8) .spend-bar-fill {
        animation-delay: 0.4s;
      }
      .spend-bar-value {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-500);
        text-align: right;
      }

      /* ============================================================
   MODAL — used for "Add spend entry"
   ============================================================ */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 300;
        background: rgba(17, 17, 17, 0.45);
        backdrop-filter: blur(3px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal-card {
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 440px;
        box-shadow:
          0 24px 60px -12px rgba(255, 255, 255, 0.22),
          0 4px 16px rgba(255, 255, 255, 0.1);
        animation: modalIn 0.32s var(--ease-spring);
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        border-bottom: 1px solid var(--steel-700);
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 16px;
        color: var(--plate);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .modal-close {
        background: none;
        border: none;
        color: var(--steel-500);
        font-size: 15.5px;
        cursor: pointer;
        padding: 4px;
        transition: color 0.15s var(--ease);
      }
      .modal-close:hover {
        color: var(--r);
      }
      .modal-body {
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .modal-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .modal-field span {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--steel-500);
      }
      .modal-field-optional {
        text-transform: none;
        letter-spacing: 0;
        color: var(--steel-600);
      }
      .modal-field input,
      .modal-field select {
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        color: var(--steel-100);
        font-family: var(--font-body);
        font-size: 15px;
        border-radius: 6px;
        padding: 9px 11px;
        transition:
          border-color 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .modal-field input:focus,
      .modal-field select:focus {
        outline: none;
        border-color: var(--amber-deep);
        box-shadow: 0 0 0 3px rgba(224, 142, 0, 0.16);
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 16px 20px;
        border-top: 1px solid var(--steel-700);
      }
      .btn-primary {
        font-family: var(--font-mono);
        font-size: 14.5px;
        font-weight: 600;
        color: #ffffff;
        background: var(--amber);
        border: none;
        border-radius: 6px;
        padding: 9px 18px;
        cursor: pointer;
        transition:
          background 0.15s var(--ease),
          transform 0.15s var(--ease-spring),
          box-shadow 0.15s var(--ease);
      }
      .btn-primary:hover {
        background: #f0a020;
        transform: translateY(-1px);
        box-shadow: var(--shadow-amber);
      }
      .btn-primary:active {
        transform: translateY(0);
      }

      /* ---- control panel: project list ---- */
      .cp-class-block {
        margin-bottom: 20px;
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-md);
        overflow: hidden;
      }
      .cp-class-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 14px;
        background: var(--steel-850);
        border-bottom: 1px solid var(--steel-700);
      }
      .cp-class-tag {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--plate);
      }
      .cp-class-count {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-500);
      }
      .cp-proj-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .cp-proj-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--steel-700);
        font-size: 14.5px;
      }
      .cp-proj-row:last-child {
        border-bottom: none;
      }
      .cp-proj-name {
        flex: 1;
        color: var(--steel-100);
        font-weight: 500;
      }
      .cp-proj-code {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-400);
        white-space: nowrap;
      }
      .cp-proj-cpm {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-500);
        white-space: nowrap;
      }
      .cp-empty-class {
        font-size: 14.5px;
        color: var(--steel-600);
        font-style: italic;
        padding: 10px 14px;
      }
      .cp-add-proj-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 10px 14px;
        background: none;
        border: none;
        border-top: 1px dashed var(--steel-700);
        color: var(--amber);
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
        transition:
          background 0.15s var(--ease),
          color 0.15s var(--ease);
      }
      .cp-add-proj-btn:hover {
        background: rgba(224, 142, 0, 0.08);
        color: var(--amber-deep);
      }

      /* ---- keep modal-box a wider-friendly class ---- */
      .modal-box {
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-lg);
        width: 100%;
        box-shadow:
          0 24px 60px -12px rgba(255, 255, 255, 0.22),
          0 4px 16px rgba(255, 255, 255, 0.1);
        animation: modalIn 0.32s var(--ease-spring);
        padding: 24px 24px 20px;
      }
      .auth-modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 400;
        background: rgba(17, 17, 17, 0.45);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fadeRise 0.2s var(--ease) both;
      }
      .login-modal {
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 360px;
        padding: 24px 24px 20px;
        box-shadow:
          0 24px 60px -12px rgba(255, 255, 255, 0.22),
          0 4px 16px rgba(255, 255, 255, 0.1);
        animation: modalIn 0.32s var(--ease-spring);
      }
      .modal-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 17px;
        color: var(--plate);
        margin-bottom: 6px;
      }
      .login-sub {
        font-size: 14.5px;
        color: var(--steel-500);
        margin: 0 0 18px;
        line-height: 1.5;
      }
      .login-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 14px;
      }
      .login-field span {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--steel-500);
      }
      .login-field input {
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        color: var(--steel-100);
        font-family: var(--font-body);
        font-size: 15px;
        border-radius: 6px;
        padding: 9px 11px;
        transition:
          border-color 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .login-field select {
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        color: var(--steel-100);
        font-family: var(--font-body);
        font-size: 15px;
        border-radius: 6px;
        padding: 9px 11px;
        cursor: pointer;
        transition:
          border-color 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .login-field input:focus,
      .login-field select:focus {
        outline: none;
        border-color: var(--amber-deep);
        box-shadow: 0 0 0 3px rgba(224, 142, 0, 0.16);
      }
      .login-error {
        font-size: 14px;
        color: var(--r);
        margin: -4px 0 14px;
      }
      .login-modal .modal-actions {
        padding: 14px 0 0;
        border-top: 1px solid var(--steel-700);
        margin-top: 6px;
      }

      /* ---- read-only lock hints, shown on editable surfaces when logged out ---- */
      .locked-hint {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-600);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .locked-hint::before {
        content: "🔒";
        font-size: 14.5px;
      }
      .meta-cell.locked {
        cursor: not-allowed;
      }
      .meta-cell.locked:hover::after {
        content: "🔒";
        color: var(--steel-600);
      }
      .editable-cell.locked,
      .list-panel li.locked {
        cursor: not-allowed;
        opacity: 0.85;
      }
      .add-row-btn.locked,
      .panel-action.locked,
      .spend-del-btn.locked {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ============================================================
   SCREEN: CLASS SELECT
   ============================================================ */
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin: 40px 0 28px;
      }
      .section-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(26px, 4vw, 38px);
        color: var(--plate);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 0;
      }
      .section-title .accent {
        color: var(--amber);
      }
      .section-hint {
        font-size: 14.5px;
        color: var(--steel-500);
        font-family: var(--font-mono);
      }
      .back-link {
        display: none; /* replaced by topbar back button */
      }

      .class-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-bottom: 40px;
      }
      .class-card {
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-lg);
        padding: 28px 24px;
        cursor: pointer;
        text-align: left;
        box-shadow: var(--shadow-sm);
        transition:
          border-color 0.2s var(--ease),
          transform 0.2s var(--ease),
          background 0.2s var(--ease),
          box-shadow 0.2s var(--ease);
        position: relative;
        animation: fadeRise 0.45s var(--ease) both;
      }
      .class-grid .class-card:nth-child(1) {
        animation-delay: 0.03s;
      }
      .class-grid .class-card:nth-child(2) {
        animation-delay: 0.09s;
      }
      .class-grid .class-card:nth-child(3) {
        animation-delay: 0.15s;
      }
      .class-card:hover {
        border-color: var(--amber-deep);
        transform: translateY(-3px);
        background: var(--steel-800);
        box-shadow: var(--shadow-md);
      }
      .class-card:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 3px;
      }
      .class-num {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 54px;
        color: var(--steel-700);
        line-height: 1;
        transition: color 0.2s var(--ease);
      }
      .class-card:hover .class-num {
        color: var(--amber);
      }
      .class-name {
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 600;
        color: var(--plate);
        margin: 8px 0 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .class-count {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--steel-500);
      }
      .class-count b {
        color: var(--steel-200);
      }
      .class-card.empty {
        opacity: 0.55;
      }
      .class-card.empty:hover {
        transform: none;
        border-color: var(--steel-700);
        background: var(--steel-850);
      }

      /* ============================================================
   SCREEN: PROJECT LIST
   ============================================================ */
      .project-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 48px;
      }
      .project-row {
        display: grid;
        grid-template-columns: auto 1fr auto auto auto auto;
        align-items: center;
        gap: 18px;
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-left: 4px solid var(--steel-600);
        border-radius: var(--radius-md);
        padding: 18px 22px;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        transition:
          border-color 0.2s var(--ease),
          background 0.2s var(--ease),
          transform 0.15s var(--ease),
          box-shadow 0.2s var(--ease);
        animation: fadeRise 0.45s var(--ease) both;
      }
      .project-list .project-row:nth-child(1) {
        animation-delay: 0.03s;
      }
      .project-list .project-row:nth-child(2) {
        animation-delay: 0.08s;
      }
      .project-list .project-row:nth-child(3) {
        animation-delay: 0.13s;
      }
      .project-list .project-row:nth-child(4) {
        animation-delay: 0.18s;
      }
      .project-list .project-row:nth-child(5) {
        animation-delay: 0.23s;
      }
      .project-row:hover {
        background: var(--steel-800);
        transform: translateX(3px);
        box-shadow: var(--shadow-md);
      }
      .project-row[data-status="Y"] {
        border-left-color: var(--g);
      }
      .project-row[data-status="R"] {
        border-left-color: var(--r);
      }
      .project-row[data-status="G"] {
        border-left-color: var(--g);
      }

      .status-pill {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
      }
      .status-pill.Y {
        background: var(--y);
        box-shadow: 0 0 12px rgba(240, 162, 2, 0.6);
      }
      .status-pill.R {
        background: var(--r);
        box-shadow: 0 0 12px rgba(216, 51, 42, 0.65);
      }
      .status-pill.G {
        background: var(--g);
        box-shadow: 0 0 12px rgba(47, 168, 79, 0.6);
      }

      .project-row-name {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 18px;
        color: var(--plate);
      }
      .project-row-sub {
        font-family: var(--font-mono);
        font-size: 13.5px;
        color: var(--steel-500);
        margin-top: 2px;
      }
      .project-row-field {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--steel-300);
        text-align: right;
        white-space: nowrap;
      }
      .project-row-field .lbl {
        display: block;
        color: var(--steel-600);
        font-size: 14.5px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 2px;
      }
      .project-row-arrow {
        color: var(--steel-600);
        font-size: 20px;
        transition:
          transform 0.2s var(--ease),
          color 0.2s var(--ease);
      }
      .project-row:hover .project-row-arrow {
        color: var(--amber);
        transform: translateX(3px);
      }

      .project-row-pct {
        position: relative;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pct-ring {
        transform: rotate(-90deg);
      }
      .pct-ring-bg {
        fill: none;
        stroke: var(--steel-700);
        stroke-width: 3;
      }
      .pct-ring-fg {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        transition: stroke-dasharray 0.3s var(--ease);
      }
      .pct-ring-fg.low {
        stroke: var(--r);
      }
      .pct-ring-fg.mid {
        stroke: var(--y);
      }
      .pct-ring-fg.done {
        stroke: var(--g);
      }
      .pct-ring-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 700;
        color: var(--steel-300);
      }

      .empty-state {
        border: 1px dashed var(--steel-700);
        border-radius: var(--radius-lg);
        padding: 56px 24px;
        text-align: center;
        color: var(--steel-500);
      }
      .empty-state-title {
        font-family: var(--font-display);
        font-size: 22px;
        color: var(--steel-300);
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .empty-state-sub {
        font-size: 15px;
        max-width: 380px;
        margin: 0 auto 22px;
        line-height: 1.6;
      }
      .btn-ghost {
        font-family: var(--font-mono);
        font-size: 14.5px;
        color: var(--amber);
        background: none;
        border: 1px solid var(--amber-deep);
        border-radius: 6px;
        padding: 9px 18px;
        cursor: pointer;
        transition:
          background 0.15s var(--ease),
          color 0.15s var(--ease);
      }
      .btn-ghost:hover {
        background: rgba(240, 162, 2, 0.1);
      }

      /* ============================================================
   PROJECT DASHBOARD
   ============================================================ */
      .dash-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
        margin: 32px 0 24px;
      }
      .dash-header-actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }
      .topic-file-btns {
        display: flex;
        gap: 8px;
      }
      .topic-file-btns .btn-ghost,
      .topic-file-btns .btn-danger {
        padding: 6px 12px;
        font-size: 13px;
      }
      .topic-file-btns button[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
      }
      .topic-file-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .topic-file-info {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .topic-file-icon {
        font-size: 26px;
        flex: 0 0 auto;
      }
      .topic-file-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-right: auto;
        min-width: 0;
      }
      .topic-file-name {
        font-size: 14.5px;
        font-weight: 600;
        color: var(--plate);
        word-break: break-all;
      }
      .topic-file-sub {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--steel-500);
      }
      .btn-open-file {
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        background: var(--amber);
        border: none;
        border-radius: 6px;
        padding: 9px 20px;
        cursor: pointer;
        flex: 0 0 auto;
        transition:
          background 0.15s var(--ease),
          transform 0.15s var(--ease-spring),
          box-shadow 0.15s var(--ease);
      }
      .btn-open-file:hover {
        background: #f0a020;
        transform: translateY(-1px);
        box-shadow: var(--shadow-amber);
      }
      .btn-open-file[disabled] {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
        transform: none;
        box-shadow: none;
      }
      .btn-danger {
        font-family: var(--font-mono);
        font-size: 13.5px;
        font-weight: 600;
        color: var(--r);
        background: none;
        border: 1px solid rgba(216, 51, 42, 0.4);
        border-radius: 6px;
        padding: 6px 12px;
        cursor: pointer;
        transition:
          background 0.15s var(--ease),
          border-color 0.15s var(--ease);
      }
      .btn-danger:hover {
        background: rgba(216, 51, 42, 0.1);
        border-color: var(--r);
      }
      .dash-title-block .eyebrow {
        font-family: var(--font-mono);
        font-size: 13.5px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--steel-500);
        margin-bottom: 6px;
      }
      .dash-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(24px, 3.6vw, 34px);
        color: var(--plate);
        margin: 0;
      }
      .dash-title.editable-title {
        cursor: text;
        border-radius: 6px;
        padding: 2px 6px;
        margin: -2px -6px;
        transition: background 0.15s var(--ease);
      }
      .dash-title.editable-title:hover {
        background: var(--steel-800);
      }
      .dash-title.editable-title:focus {
        outline: none;
        background: var(--steel-800);
        box-shadow: 0 0 0 2px var(--amber-deep);
      }
      .dash-title.editable-title.locked {
        cursor: pointer;
      }
      .dash-title.editable-title.locked:hover::after {
        content: " 🔒";
        font-size: 15.5px;
      }
      .status-banner {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 8px;
        font-family: var(--font-mono);
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .status-banner.Y {
        background: rgba(240, 162, 2, 0.12);
        color: var(--y);
        border: 1px solid rgba(240, 162, 2, 0.35);
      }
      .status-banner.R {
        background: rgba(216, 51, 42, 0.12);
        color: var(--r);
        border: 1px solid rgba(216, 51, 42, 0.35);
      }
      .status-banner.G {
        background: rgba(47, 168, 79, 0.12);
        color: var(--g);
        border: 1px solid rgba(47, 168, 79, 0.35);
      }
      .status-banner .pulse {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 0 0 currentColor;
        }
        50% {
          opacity: 0.5;
        }
      }

      .meta-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 1px;
        background: var(--steel-700);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-md);
        overflow: hidden;
        margin-bottom: 32px;
      }
      .meta-cell {
        background: var(--steel-850);
        padding: 14px 16px;
      }
      .meta-cell .lbl {
        font-family: var(--font-mono);
        font-size: 14.5px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--steel-500);
        margin-bottom: 4px;
      }
      .meta-cell .val {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 18px;
        color: var(--plate);
      }
      .meta-cell.editable {
        cursor: pointer;
        position: relative;
      }
      .meta-cell.editable:hover {
        background: var(--steel-800);
      }
      .meta-cell.editable:hover::after {
        content: "✎";
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 13px;
        color: var(--steel-600);
      }
      .meta-pct-val.low {
        color: var(--r);
      }
      .meta-pct-val.mid {
        color: var(--y);
      }
      .meta-pct-val.done {
        color: var(--g);
      }

      /* ---- phase timeline ---- */
      .timeline-wrap {
        margin-bottom: 36px;
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-lg);
        padding: 28px 28px 22px;
        overflow-x: auto;
      }
      .timeline-title {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--steel-500);
        margin-bottom: 20px;
      }
      .timeline-track {
        position: relative;
        display: grid;
        grid-template-columns: repeat(6, minmax(120px, 1fr));
        min-width: 760px;
      }
      .timeline-phase {
        position: relative;
        padding: 0 4px 28px;
        text-align: center;
      }
      .timeline-phase .bar {
        height: 34px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 14.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: rgba(0, 0, 0, 0.55);
        position: relative;
        z-index: 1;
      }
      .timeline-phase:nth-child(1) .bar {
        background: linear-gradient(90deg, #8e98a3, #a7afb8);
      }
      .timeline-phase:nth-child(2) .bar {
        background: linear-gradient(90deg, #d8332a, #e8584f);
        color: #fff;
      }
      .timeline-phase:nth-child(3) .bar {
        background: linear-gradient(90deg, #e8843a, #f0a202);
      }
      .timeline-phase:nth-child(4) .bar {
        background: linear-gradient(90deg, #f0d202, #f4e24a);
      }
      .timeline-phase:nth-child(5) .bar {
        background: linear-gradient(90deg, #3fae5e, #2fa84f);
        color: #fff;
      }
      .timeline-phase:nth-child(6) .bar {
        background: linear-gradient(90deg, #3a8fd1, #5aa6dd);
        color: #fff;
      }
      .timeline-phase.active .bar {
        outline: 3px solid var(--amber);
        outline-offset: 2px;
        box-shadow: 0 0 18px rgba(240, 162, 2, 0.5);
      }
      .timeline-rail {
        position: absolute;
        left: 0;
        right: 0;
        top: 17px;
        height: 2px;
        background: var(--steel-700);
        z-index: 0;
      }
      .timeline-milestones {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 10px;
        align-items: center;
      }
      .milestone-chip {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-300);
        background: var(--steel-800);
        border: 1px solid var(--steel-700);
        border-radius: 4px;
        padding: 3px 7px;
        white-space: normal;
        line-height: 1.4;
      }
      .milestone-chip.done {
        color: var(--steel-600);
        text-decoration: line-through;
        border-color: var(--steel-700);
        background: transparent;
      }
      .milestone-chip.risk {
        color: var(--r);
        border-color: rgba(216, 51, 42, 0.4);
        background: rgba(216, 51, 42, 0.08);
        font-weight: 600;
      }
      .milestone-chip.go {
        color: var(--g);
        border-color: rgba(47, 168, 79, 0.4);
        background: rgba(47, 168, 79, 0.08);
        font-weight: 600;
      }
      .milestone-name {
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--steel-500);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-top: 6px;
      }

      /* ---- per-milestone gate-chart timeline — each milestone gets its own
   colored bar segment (colored by which of the 6 phases it falls under:
   PreStudy/Concept/Detail/Final/Industrialization/Follow-up), with the
   MILESTONE's own name (PCIG, FeG, CG...) printed on that segment, and
   the milestone's date(s) shown directly below. ---- */
      .timeline-gatechart-flat {
        display: grid;
        gap: 6px;
        min-width: 1080px;
      }
      .gatechart-flat-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .gatechart-flat-seg {
        width: 100%;
        min-height: 36px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 5px 4px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        color: rgba(0, 0, 0, 0.6);
        line-height: 1.2;
      }
      .gatechart-flat-seg.phase-0,
      .gatechart-flat-seg.phase-1,
      .gatechart-flat-seg.phase-2,
      .gatechart-flat-seg.phase-3,
      .gatechart-flat-seg.phase-4,
      .gatechart-flat-seg.phase-5 {
        background: linear-gradient(160deg, #d7dade, #e6e8eb);
        color: rgba(0, 0, 0, 0.6);
      }
      /* Major decision gates (DG, FDG, FIG, LG) stay highlighted in red so
   they stand out against the light-grey phase bar. Purely a colour
   override — the underlying phase-N class/index and click behaviour
   are untouched. */
      .gatechart-flat-seg.gate-highlight {
        background: linear-gradient(160deg, #d8332a, #e8584f);
        color: #fff;
      }
      .gatechart-flat-seg.active {
        outline: 3px solid var(--amber);
        outline-offset: 2px;
        box-shadow: 0 0 18px rgba(240, 162, 2, 0.5);
      }

      .milestone-week-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
      }
      .milestone-week-old {
        font-family: var(--font-mono);
        font-size: 13.5px;
        line-height: 1.4;
        color: var(--steel-500);
        text-decoration: none;
        white-space: nowrap;
      }
      .week-placeholder {
        color: var(--steel-600);
        font-weight: 400;
        font-style: italic;
        text-decoration: none;
      }
      .timeline-week-editable {
        cursor: text;
      }
      .timeline-week-editable:hover,
      .timeline-week-editable:focus {
        outline: none;
        background: var(--steel-800);
        box-shadow: 0 0 0 1px var(--amber);
      }
      .milestone-week {
        font-family: var(--font-mono);
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--steel-500);
        white-space: nowrap;
        padding: 1px 5px;
        border-radius: 3px;
      }
      /* Both the "first planned" and "revised ending" placeholders now share
   this single neutral style regardless of milestone status — the
   done/risk/go/active-week flags are still tracked in the data and drive
   other UI (ticks, timeline highlighting), they just no longer recolor
   these two date rows, so every phase's pair of placeholders looks the
   same. */
      .milestone-week.done,
      .milestone-week.risk,
      .milestone-week.go,
      .milestone-week.active-week {
        color: var(--steel-500);
        background: transparent;
        font-weight: 600;
        text-decoration: none;
        box-shadow: none;
      }

      /* ---- timeline: clickable phases & dual dates ---- */
      .phase-clickable {
        cursor: pointer;
        position: relative;
      }
      .phase-clickable:hover {
        filter: brightness(1.08);
        transform: translateY(-2px) scale(1.01);
        box-shadow: 0 6px 18px rgba(255, 255, 255, 0.14);
      }
      .phase-highlighted {
        box-shadow:
          0 0 0 2.5px rgba(31, 143, 72, 0.7),
          0 4px 14px rgba(31, 143, 72, 0.25) !important;
        opacity: 1 !important;
      }
      .phase-highlighted::after {
        content: "";
        position: absolute;
        bottom: -3px;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        height: 2px;
        background: var(--signal-green);
        border-radius: 2px;
      }
      .phase-done-tick {
        position: absolute;
        top: 3px;
        right: 5px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, 0.85);
        font-weight: 700;
        line-height: 1;
      }
      /* Phase segments that are NOT highlighted get a slight dim */
      .gatechart-flat-seg:not(.phase-highlighted):not(.active) {
        opacity: 0.72;
      }
      .gatechart-flat-seg.active:not(.phase-highlighted) {
        opacity: 1;
      }

      /* Dual dates row under each milestone */
      .milestone-dual-dates {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px 2px 2px;
        margin-top: 2px;
      }
      .milestone-date-row {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
      }

      .milestone-date-input {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-400);
        background: transparent;
        border: none;
        border-bottom: 1px dashed var(--steel-700);
        border-radius: 0;
        padding: 1px 2px;
        width: 100%;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s var(--ease),
          color 0.15s var(--ease);
        -webkit-appearance: none;
      }
      .milestone-date-row.revised .milestone-date-input {
        color: var(--amber);
        border-bottom-color: rgba(224, 142, 0, 0.4);
      }
      /* When a revised date is present, the planned date is "cut over" —
   struck through to show it has been superseded by the revised date below it. */
      .milestone-date-row.planned.has-revision .milestone-date-input {
        text-decoration: line-through;
        text-decoration-color: var(--safety-red);
        text-decoration-thickness: 1.4px;
        color: var(--steel-600);
        opacity: 0.8;
      }
      .milestone-date-input:focus {
        outline: none;
        border-bottom-color: var(--amber-deep);
        color: var(--plate);
      }
      .milestone-date-input:disabled {
        cursor: default;
        opacity: 0.6;
      }
      .milestone-date-input::-webkit-calendar-picker-indicator {
        display: none;
      }
      .milestone-date-input::-webkit-inner-spin-button {
        display: none;
      }

      /* ---- grid layout for content blocks ---- */
      .dash-grid {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 24px;
        margin-bottom: 32px;
        align-items: start;
      }
      @media (max-width: 920px) {
        .dash-grid {
          grid-template-columns: 1fr;
        }
      }

      /* compact 4-up grid for Achievements / Upcoming / Support / Notes —
   keeps these four lower-priority panels to a single dense row so
   the dashboard doesn't need extra scroll to reach them. */
      .dash-grid-quad {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 32px;
        align-items: start;
      }
      @media (max-width: 1080px) {
        .dash-grid-quad {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 560px) {
        .dash-grid-quad {
          grid-template-columns: 1fr;
        }
      }

      .compact-panel {
        padding: 16px 16px;
        display: flex;
        flex-direction: column;
      }
      .compact-panel .panel-head {
        margin-bottom: 10px;
      }
      .compact-panel .panel-title {
        font-size: 14.5px;
      }
      .compact-panel-body {
        max-height: 170px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .compact-panel-body::-webkit-scrollbar {
        width: 5px;
      }
      .compact-panel-body::-webkit-scrollbar-thumb {
        background: var(--steel-700);
        border-radius: 4px;
      }
      .compact-panel .list-panel ul,
      .compact-panel-body ul {
        gap: 7px;
      }
      .compact-panel .list-panel li,
      .compact-panel-body li {
        font-size: 14.5px;
        line-height: 1.4;
      }
      .compact-panel .add-row-btn {
        margin-top: 10px;
        padding: 5px 10px;
        font-size: 13px;
      }

      .panel {
        background: var(--steel-850);
        border: 1px solid var(--steel-700);
        border-radius: var(--radius-lg);
        padding: 22px 24px;
        box-shadow: var(--shadow-sm);
        transition:
          box-shadow 0.25s var(--ease),
          transform 0.25s var(--ease);
      }
      .panel:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        gap: 10px;
        flex-wrap: wrap;
      }
      .panel-title {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 16px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--plate);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel-title .chip {
        font-family: var(--font-mono);
        font-size: 14.5px;
        color: var(--steel-500);
        border: 1px solid var(--steel-700);
        padding: 1px 6px;
        border-radius: 4px;
      }
      .panel-action {
        font-family: var(--font-mono);
        font-size: 13px;
        color: var(--steel-500);
        background: none;
        border: 1px solid var(--steel-700);
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
        transition:
          border-color 0.15s,
          color 0.15s;
      }
      .panel-action:hover {
        border-color: var(--amber-deep);
        color: var(--amber);
      }

      /* topic tracker — grouped sections, each card links out to an Excel sheet */
      .topic-sections-wrap {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .topic-group-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }
      .topic-group-name {
        font-family: var(--font-mono);
        font-size: 13px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--steel-500);
      }
      .grp-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 13px;
        background: var(--steel-800);
        color: var(--steel-300);
      }
      .topic-section-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }

      /* flat 7-column x 2-row topic tracker grid — all 13 entries visible at
   once without the old Quality/Development sub-grouping. */
      .topic-section-grid-flat {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 10px;
      }
      @media (max-width: 1200px) {
        .topic-section-grid-flat {
          grid-template-columns: repeat(4, 1fr);
        }
      }
      @media (max-width: 760px) {
        .topic-section-grid-flat {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 460px) {
        .topic-section-grid-flat {
          grid-template-columns: 1fr;
        }
      }

      .compact-topic .topic-section-open {
        padding: 10px 11px;
        gap: 6px;
      }
      .compact-topic .topic-section-name {
        font-size: 13.5px;
        line-height: 1.25;
      }
      .compact-topic .topic-section-meta {
        gap: 8px;
        font-size: 14.5px;
      }
      .compact-topic .topic-section-meta .lbl {
        font-size: 13px;
      }
      .compact-topic .ryg-dot {
        gap: 0;
      }

      .topic-tracker-panel {
        margin-bottom: 32px;
      }

      /* ---- topic detail full-screen view ---- */
      .topic-detail-panel {
        padding: 26px 28px;
      }
      .topic-detail-header {
        padding-bottom: 18px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--steel-700);
      }
      .topic-detail-meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 22px;
        font-size: 14.5px;
        color: var(--steel-300);
      }
      .topic-detail-meta-row .lbl {
        display: block;
        font-size: 14.5px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--steel-500);
        margin-bottom: 2px;
      }
      .topic-detail-section {
        margin-bottom: 26px;
      }
      .topic-detail-section:last-child {
        margin-bottom: 0;
      }
      .topic-detail-section-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 15.5px;
        color: var(--plate);
        margin-bottom: 12px;
      }
      .topic-detail-note {
        font-size: 14.5px;
        color: var(--steel-500);
        margin-top: 10px;
        line-height: 1.5;
      }
      .ryg-dot.lg {
        font-size: 14.5px;
        gap: 6px;
      }
      .ryg-dot.lg .d {
        width: 10px;
        height: 10px;
      }

      .detail-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14.5px;
      }
      .detail-table th {
        text-align: left;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: var(--steel-500);
        font-weight: 600;
        padding: 8px 10px;
        border-bottom: 1px solid var(--steel-700);
      }
      .detail-table td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--steel-800);
        color: var(--steel-300);
      }
      .detail-table td.num {
        text-align: right;
        font-family: var(--font-mono);
      }
      .detail-table tr:last-child td {
        border-bottom: none;
      }
      .detail-table .rpn {
        font-weight: 700;
        border-radius: 4px;
      }
      .detail-table .rpn.high {
        color: var(--r);
      }
      .detail-table .rpn.med {
        color: var(--amber-deep);
      }
      .detail-table .rpn.low {
        color: var(--g);
      }

      /* bottom trio: Achievements / Upcoming / Support, single full-width row */
      .dash-grid-trio {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 32px;
        align-items: start;
      }
      @media (max-width: 880px) {
        .dash-grid-trio {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 560px) {
        .dash-grid-trio {
          grid-template-columns: 1fr;
        }
      }

      /* ---- per-project History tab ---- */
      .history-panel {
        margin-bottom: 32px;
      }
      .history-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 420px;
        overflow-y: auto;
        padding-right: 4px;
      }
      .history-list::-webkit-scrollbar {
        width: 5px;
      }
      .history-list::-webkit-scrollbar-thumb {
        background: var(--steel-700);
        border-radius: 4px;
      }
