            <div class="panel-head"><div class="panel-title">⚠ Support Required</div></div>
            <div class="compact-panel-body">${renderEditableList(p.support, "support", "⚠")}</div>
            <button class="add-row-btn" data-add-list="support">+ Add support item</button>
          </div>
        </div>

        ${isLoggedIn() ? renderHistoryPanel(p) : ''}
      </section>
    `;

    bindDashboardEvents(p);
  }

  function statusLabel(s){
    return s==="Y" ? "On Track" : s==="R" ? "At Risk" : s==="G" ? "Ahead / Complete" : s;
  }

  function metaCell(label, value, field){
    const locked = !isLoggedIn();
    return `<div class="meta-cell editable ${locked?'locked':''}" data-field="${field}">
      <div class="lbl">${label}</div>
      <div class="val" ${locked?'':'contenteditable="true"'} data-field="${field}">${escapeHtml(value||'—')}</div>
    </div>`;
  }

  function metaCellStatusSelect(status){
    const locked = !isLoggedIn();
    return `<div class="meta-cell ${locked?'locked':''}">
      <div class="lbl">Status</div>
      <div class="val">
        <select class="ryg-select" data-status-select style="font-size:16px;" ${locked?'disabled':''}>
          <option value="Y" ${status==='Y'?'selected':''}>Y · On Track</option>
          <option value="R" ${status==='R'?'selected':''}>R · At Risk</option>
          <option value="G" ${status==='G'?'selected':''}>G · Ahead</option>
        </select>
      </div>
    </div>`;
  }

  function metaCellPercent(pct){
    const tier = pct>=100 ? 'done' : pct>=50 ? 'mid' : 'low';
    return `<div class="meta-cell" title="Average of milestones cleared and readiness sign-offs achieved">
      <div class="lbl">% Complete</div>
      <div class="val meta-pct-val ${tier}">${pct}%</div>
    </div>`;
  }

  function renderDateField(p){
    const history = (p.dateHistory || []);
    const current = p.targetDate || "";
    const histHtml = history.length ? `
      <div class="date-history">
        ${history.map(d=>`<span class="date-history-item"><s>${escapeHtml(d)}</s></span>`).join("")}
      </div>` : "";
    return `<div class="meta-cell date-field-cell" style="min-width:180px;">
      <div class="lbl">Target Date <span style="font-size:13.5px;color:var(--steel-600);">(editable)</span></div>
      <div class="val" style="display:flex;flex-direction:column;gap:4px;">
        <input type="date" class="date-field-input" data-date-field value="${escapeHtml(current)}" title="Click to change target date">
        ${histHtml}
      </div>
    </div>`;
  }

  // ---- project budget panel ----
  function renderProjectBudgetPanel(p){
    const s = projectBudgetSummary(p);
    const log = (p.budget && p.budget.spendLog) || [];
    const pctSpent = s.allocated ? Math.min(100, (s.spent/s.allocated)*100) : 0;
    const pctCommitted = s.allocated ? Math.min(100-pctSpent, (s.committed/s.allocated)*100) : 0;

    return `
      <div class="panel budget-panel">
        <div class="panel-head">
          <div class="panel-title">💰 Allocation Budget ${s.overBudget ? '<span class="overbudget-chip">OVER BUDGET</span>' : ''}</div>
          <button class="panel-action" data-edit-allocated>Edit allocation</button>
        </div>

        <div class="proj-budget-strip">
          <div class="budget-cell">
            <div class="lbl">Allocated</div>
            <div class="val">${formatINR(s.allocated)}</div>
          </div>
          <div class="budget-cell spent">
            <div class="lbl">Spent</div>
            <div class="val">${formatINR(s.spent)}</div>
          </div>
          <div class="budget-cell committed">
            <div class="lbl">Committed</div>
            <div class="val">${formatINR(s.committed)}</div>
          </div>
          <div class="budget-cell remaining ${s.remaining<0?'negative':''}">
            <div class="lbl">Remaining</div>
            <div class="val">${formatINR(s.remaining)}</div>
          </div>
        </div>

        <div class="budget-gauge-wrap">
          <div class="budget-gauge">
            <div class="budget-gauge-fill spent" style="width:${pctSpent}%"></div>
            <div class="budget-gauge-fill committed" style="width:${pctCommitted}%; left:${pctSpent}%"></div>
          </div>
          <div class="budget-gauge-legend">
            <span><span class="dot spent"></span> Spent (${s.pctUsed>100?100:Math.round(pctSpent)}%)</span>
            <span><span class="dot committed"></span> Committed</span>
            <span><span class="dot free"></span> Free</span>
            ${s.overBudget ? `<span class="overbudget-text">Exceeds allocation by ${formatINR(Math.abs(s.remaining))}</span>` : ''}
          </div>
        </div>

        <div class="spend-log-head">
          <span class="spend-log-title">Spend Log</span>
          <span class="spend-log-count">${log.length} ${log.length===1?'entry':'entries'}</span>
        </div>
        <div class="spend-log-table-wrap">
          ${log.length ? `
          <table class="spend-log-table">
            <thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Type</th><th>Amount</th><th></th></tr></thead>
            <tbody>
              ${log.slice().sort((a,b)=> (b.date||"").localeCompare(a.date||"")).map(e=>`
                <tr data-spend-id="${e.id}">
                  <td class="spend-date">${escapeHtml(e.date||'—')}</td>
                  <td><span class="spend-cat-chip">${escapeHtml(e.category)}</span></td>
                  <td class="spend-note">${escapeHtml(e.note||'')}</td>
                  <td><span class="spend-type-chip ${e.type}">${e.type==='committed'?'Committed':'Spent'}</span></td>
                  <td class="spend-amount">${formatINR(e.amount)}</td>
                  <td><button class="spend-del-btn" data-del-spend="${e.id}" title="Remove entry">✕</button></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
          ` : `<div style="color:var(--steel-600);font-style:italic;padding:14px 0;font-size:14.5px;">No spend logged yet — add the first entry below.</div>`}
        </div>
        <button class="add-row-btn" data-add-spend>+ Add spend entry</button>
      </div>
    `;
  }

  // ---- timeline ----
  function renderTimeline(p){
    const ms = p.milestones || [];
    const total = ms.length;
    // Find the last done index so all segments up to that index are highlighted
    let lastDoneIdx = -1;
    ms.forEach((m,i)=>{ if(m.done) lastDoneIdx = i; });

    return `
      <div class="timeline-wrap">
        <div class="timeline-title">Project Phase Timeline <span style="font-family:var(--font-mono);font-size:13px;color:var(--steel-500);font-weight:400;margin-left:8px;">${isLoggedIn() ? '— click a phase to mark progress' : ''}</span></div>
        <div class="timeline-gatechart-flat" style="grid-template-columns:repeat(${Math.max(total,1)}, minmax(82px,1fr));">
          ${total ? ms.map((m,i)=>{
            const phaseIdx = milestonePhaseIdx(i, total);
            const hist = splitWeekHistory(m.week);
            const isHighlighted = i <= lastDoneIdx;
            // planned date (original, first in history or current if no history)
            const plannedDate = m.plannedDate || "";
            // revised date (current expected)
            const revisedDate = m.revisedDate || "";
            return `
            <div class="gatechart-flat-col timeline-phase-col" data-phase-idx="${i}">
              <div class="gatechart-flat-seg phase-${phaseIdx} ${m.active?'active':''} ${isHighlighted?'phase-highlighted':''} ${isLoggedIn()?'phase-clickable':''}" data-phase="${i}" title="${escapeHtml(m.label)} — ${isLoggedIn()?'click to toggle progress':''}">
                ${escapeHtml(m.label)}
                ${isHighlighted ? '<span class="phase-done-tick">✓</span>' : ''}
              </div>
              <div class="milestone-week-block">
                ${hist.old.map(w=>`<div class="milestone-week-old">${escapeHtml(w)}</div>`).join("")}
                <div class="milestone-week ${m.done?'done':''} ${m.risk?'risk':''} ${m.go?'go':''} ${m.active?'active-week':''}">${escapeHtml(hist.current)}</div>
              </div>
              <div class="milestone-dual-dates">
                <div class="milestone-date-row planned ${revisedDate ? 'has-revision' : ''}">
                  <input type="date" class="milestone-date-input" data-date-type="planned" data-ms-idx="${i}" value="${escapeHtml(plannedDate)}" title="Original planned completion date" ${isLoggedIn()?'':'disabled'}>
                </div>
                <div class="milestone-date-row revised">
                  <input type="date" class="milestone-date-input" data-date-type="revised" data-ms-idx="${i}" value="${escapeHtml(revisedDate)}" title="Current expected completion date" ${isLoggedIn()?'':'disabled'}>
                </div>
              </div>
            </div>`;
          }).join("") : `<div style="grid-column:1/-1;text-align:center;color:var(--steel-500);font-size:14.5px;padding:18px 0;">No milestones logged yet.</div>`}
        </div>
      </div>
    `;
  }

  function chunkMilestones(ms, n){
    const buckets = Array.from({length:n}, ()=>[]);
    if(!ms.length) return buckets;
    const per = Math.ceil(ms.length/n);
    ms.forEach((m,i)=>{
      const idx = Math.min(n-1, Math.floor(i/per));
      buckets[idx].push(m);
    });
    return buckets;
  }

  // ---- topic table ----
  function renderTopicSections(p){
    if(!p.topics.length){
      return `<div style="color:var(--steel-500);font-size:14.5px;padding:18px 0;">No topics logged yet.</div>`;
    }
    const locked = !isLoggedIn();
    // Flat grid of all topics (no Quality/Development grouping) — 8 columns x 2
    // rows so all 15 entries are visible at a glance without extra scroll.
    return `
      <div class="topic-section-grid-flat">
        ${p.topics.map((t,idx) => `
          <div class="topic-section compact-topic" data-topic-idx="${idx}">
            ${locked ? '' : `<button class="topic-del-btn" data-del-topic-idx="${idx}" title="Delete this section">✕</button>`}
            <div class="topic-section-open" data-topic-idx="${idx}" data-action="open-topic" title="Open ${escapeHtml(t.topic)} details">
              <div class="topic-section-top">
                <span class="topic-section-name ${locked?'locked':''}" ${locked?'':'contenteditable="true"'} data-topic-name-idx="${idx}" title="${locked?'Log in to rename':'Click to rename'}">${escapeHtml(t.topic)}</span>
                <span class="ryg-dot"><span class="d ${t.status}"></span></span>
              </div>
              <div class="topic-section-meta">
                <span><span class="lbl">Plan</span>${escapeHtml(t.plan||'—')}</span>
                <span><span class="lbl">Actual</span>${escapeHtml(t.actual||'—')}</span>
              </div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  // ---- NCR table ----
  function renderNcrTable(p, locked){
    const rows = p.ncrRows||[];
    const totals = {G:0,Y:[0,0,0],R:[0,0,0],total:0};
    rows.forEach(r=>{
      totals.G += r.G||0;
      totals.total += r.total||0;
      (r.Y||[]).forEach((v,i)=> totals.Y[i]+=v);
      (r.R||[]).forEach((v,i)=> totals.R[i]+=v);
    });
    const cellAttrs = field => locked
      ? `class="editable-cell locked" data-ncr-field="${field}"`
      : `class="editable-cell" contenteditable="true" data-ncr-field="${field}"`;
    return `
      <table class="ncr-table">
        <thead>
          <tr>
            <th rowspan="2">Category</th>
            <th rowspan="2">G</th>
            <th colspan="3">Y</th>
            <th colspan="3">R</th>
            <th rowspan="2">Total</th>
          </tr>
          <tr>
            <th>P1</th><th>P2</th><th>P3</th>
            <th>P1</th><th>P2</th><th>P3</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r,i)=>`
            <tr data-ncr-idx="${i}">
              <td>${escapeHtml(r.category)}</td>
              <td class="g-col" ${cellAttrs("G")}>${r.G}</td>
              ${[0,1,2].map(j=>`<td class="y-col" ${cellAttrs("Y"+j)}>${r.Y[j]}</td>`).join("")}
              ${[0,1,2].map(j=>`<td class="r-col" ${cellAttrs("R"+j)}>${r.R[j]}</td>`).join("")}
              <td class="total-col">${r.total}</td>
            </tr>
          `).join("")}
        </tbody>
        <tfoot>
          <tr>
            <td>Total</td>
            <td class="g-col">${totals.G}</td>
            ${totals.Y.map(v=>`<td class="y-col">${v}</td>`).join("")}
            ${totals.R.map(v=>`<td class="r-col">${v}</td>`).join("")}
            <td class="total-col">${totals.total}</td>
          </tr>
        </tfoot>
      </table>
    `;
  }

  // ---- editable lists ----
  function renderEditableList(items, key, ico){
    const locked = !isLoggedIn();
    if(!items || !items.length){
      return `<ul><li style="color:var(--steel-600);font-style:italic;">${locked ? 'Nothing logged yet.' : 'Nothing logged yet — click "add" below.'}</li></ul>`;
    }
    return `<ul>
      ${items.map((txt,i)=>`
        <li data-list="${key}" data-idx="${i}" ${locked?'class="locked"':''}>
          <span class="ico">${ico}</span>
          <span ${locked?'':'contenteditable="true"'} data-list-field="${key}" data-idx="${i}">${escapeHtml(txt)}</span>
          ${locked ? '' : `<button class="list-del" data-list-del="${key}" data-idx="${i}" title="Remove" style="margin-left:auto;background:none;border:none;color:var(--steel-600);cursor:pointer;font-size:15.5px;">✕</button>`}
        </li>
      `).join("")}
    </ul>`;
  }

  // ============================================================
  //  EVENT BINDING for project dashboard (editing & persistence)
  // ============================================================
  function bindDashboardEvents(p){
    const deleteBtn = app.querySelector("[data-delete-project]");
    if(deleteBtn){
      deleteBtn.addEventListener("click", ()=>{
        const confirmed = confirm(`Delete "${p.name}" permanently? This cannot be undone.`);
        if(!confirmed) return;
        const ok = deleteProject(state.line, state.classId, p.id);
        if(ok){
          showToast("Project deleted");
          navigate({projectId:null, topicIdx:null});
        }
      });
    }

    // project name (dashboard title)
    const titleEl = app.querySelector(".editable-title");
    if(titleEl){
      if(titleEl.classList.contains("locked")){
        titleEl.addEventListener("click", ()=>{
          showLoginModal(()=> renderProjectDashboard(p));
        });
      } else {
        const beforeName = titleEl.textContent.trim();
        titleEl.addEventListener("blur", ()=>{
          const newName = titleEl.textContent.trim();
          if(newName && newName !== beforeName){
            logChange(p, "Project name", beforeName, newName);
            p.name = newName;
            saveData();
            showToast("Project renamed");
            renderProjectDashboard(p);
          } else if(!newName){
            titleEl.textContent = beforeName; // don't allow blanking the name
          }
        });
        titleEl.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); titleEl.blur(); } });
      }
    }

    // meta fields
    app.querySelectorAll(".meta-cell.editable").forEach(cell=>{
      if(cell.classList.contains("locked")){
        cell.addEventListener("click", ()=>{
          showLoginModal(()=> renderProjectDashboard(p));
        });
        return;
      }
      const el = cell.querySelector(".val[contenteditable]");
      const before = el.textContent.trim();
      el.addEventListener("blur", ()=>{
        const field = el.dataset.field;
        const newVal = el.textContent.trim();
        if(newVal !== before){
          logChange(p, field, before, newVal);
          p[field] = newVal;
          saveData();
          showToast("Saved");
        }
      });
      el.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
    });

    const statusSelect = app.querySelector("[data-status-select]");
    if(statusSelect){
      if(statusSelect.disabled){
        statusSelect.closest(".meta-cell").addEventListener("click", ()=>{
          showLoginModal(()=> renderProjectDashboard(p));
        });
      } else {
        statusSelect.addEventListener("change", ()=>{
          const oldVal = p.status;
          logChange(p, "Status", statusLabel(oldVal), statusLabel(statusSelect.value));
          p.status = statusSelect.value;
          saveData();
          renderProjectDashboard(p); // re-render to update banner colors
          showToast("Status updated");
        });
      }
    }

    // editable date field with history
    const dateInput = app.querySelector("[data-date-field]");
    if(dateInput){
      dateInput.addEventListener("change", ()=>{
        const newDate = dateInput.value;
        if(!newDate) return;
        const old = p.targetDate || "";
        if(old && old !== newDate){
          if(!p.dateHistory) p.dateHistory = [];
          p.dateHistory.push(old);
        }
        p.targetDate = newDate;
        saveData();
        renderProjectDashboard(p);
        showToast("Target date updated");
      });
    }

    // budget: edit allocation
    const editAllocBtn = app.querySelector("[data-edit-allocated]");
    if(editAllocBtn){
      editAllocBtn.addEventListener("click", ()=> withAuth(()=>{
        const current = (p.budget && p.budget.allocated) || 0;
        const input = prompt(`Set allocated budget for "${p.name}" (₹):`, current);
        if(input === null) return;
        const val = parseFloat(input.replace(/[^\d.]/g,""));
        if(isNaN(val) || val < 0){ showToast("Enter a valid amount"); return; }
        if(!p.budget) p.budget = { allocated:0, spendLog:[] };
        logChange(p, "Allocated budget", current, Math.round(val));
        p.budget.allocated = Math.round(val);
        saveData();
        renderProjectDashboard(p);
        showToast("Budget allocation updated");
      }));
    }

    // budget: add spend entry
    const addSpendBtn = app.querySelector("[data-add-spend]");
    if(addSpendBtn){
      addSpendBtn.addEventListener("click", ()=> withAuth(()=> openSpendEntryDialog(p)));
    }

    // budget: delete spend entry
    app.querySelectorAll("[data-del-spend]").forEach(btn=>{
      btn.addEventListener("click", ()=> withAuth(()=>{
        const id = btn.dataset.delSpend;
        if(!p.budget || !p.budget.spendLog) return;
        if(!confirm("Remove this spend entry?")) return;
        const entry = p.budget.spendLog.find(e=>e.id===id);
        p.budget.spendLog = p.budget.spendLog.filter(e=>e.id!==id);
        if(entry) logChange(p, "Spend entry removed", `${entry.note||entry.category} (${formatINRShort(entry.amount)})`, "(removed)");
        saveData();
        renderProjectDashboard(p);
        showToast("Spend entry removed");
      }));
    });

    // phase click -> mark all phases up to this one as done (visual progress update)
    app.querySelectorAll(".timeline-phase-col .phase-clickable").forEach(el=>{
      el.addEventListener("click", ()=> withAuth(()=>{
        const clickedIdx = parseInt(el.dataset.phase, 10);
        const ms = p.milestones || [];
        // Toggle: if everything up to this point is already done, undo back to previous
        const alreadyAllDone = ms.slice(0, clickedIdx+1).every(m => m.done);
        ms.forEach((m, i) => {
          if(alreadyAllDone){
            // undo: unmark from clicked onwards
            if(i >= clickedIdx) m.done = false;
          } else {
            // mark all up to clicked as done
            m.done = i <= clickedIdx;
          }
          // set active on the first undone milestone
        });
        // update active flag: first undone = active
        let foundActive = false;
        ms.forEach(m => {
          if(!m.done && !foundActive){ m.active = true; foundActive = true; }
          else { m.active = false; }
        });
        logChange(p, "Timeline progress", "—", alreadyAllDone ? `Undone to phase ${clickedIdx}` : `Marked done through phase ${clickedIdx}`);
        saveData();
        renderProjectDashboard(p);
        showToast(alreadyAllDone ? "Timeline progress rolled back" : "Timeline updated ✓");
      }));
    });

    // dual date inputs: planned and revised dates per milestone
    app.querySelectorAll(".milestone-date-input").forEach(input=>{
      input.addEventListener("change", ()=> withAuth(()=>{
        const idx = parseInt(input.dataset.msIdx, 10);
        const type = input.dataset.dateType; // "planned" | "revised"
        const ms = p.milestones || [];
        if(!ms[idx]) return;
        const field = type === "planned" ? "plannedDate" : "revisedDate";
        const oldVal = ms[idx][field] || "";
        ms[idx][field] = input.value;
        logChange(p, `Milestone ${ms[idx].label} ${type} date`, oldVal, input.value);
        saveData();
        showToast(`${type === "planned" ? "Planned" : "Revised"} date saved`);
      }));
    });

    // topic sections — click opens the full-screen Project Readiness Tracker
    // detail view for that topic (see SCREEN 3.5, renderTopicDetail).
    // Viewing detail is open to everyone; editing the section NAME inline
    // (below) requires login and must not also trigger navigation.
    app.querySelectorAll('.topic-section-open[data-action="open-topic"]').forEach(card=>{
      card.addEventListener("click", (e)=>{
        if(e.target.closest('[data-topic-name-idx]')) return; // let the rename field handle its own click
        const idx = parseInt(card.dataset.topicIdx,10);
        navigate({topicIdx: idx});
      });
    });
    // rename a Project Readiness Tracker section (grid card label). Locked
    // (logged-out) names show a login prompt instead of becoming editable;
    // the click is stopped from bubbling into the card's open-detail handler.
    app.querySelectorAll('[data-topic-name-idx]').forEach(nameEl=>{
      nameEl.addEventListener("click", (e)=> e.stopPropagation());
      if(nameEl.classList.contains("locked")){
        nameEl.addEventListener("click", ()=>{
          showLoginModal(()=> renderProjectDashboard(p));
        });
        return;
      }
      const idx = parseInt(nameEl.dataset.topicNameIdx,10);
      const before = nameEl.textContent.trim();
      nameEl.addEventListener("blur", ()=>{
        const topic = p.topics[idx];
        if(!topic) return;
        const newName = nameEl.textContent.trim();
        if(newName && newName !== before){
          if(!topic.custom){
            if(!p.renamedTopics) p.renamedTopics = {};
            p.renamedTopics[topic.key || before] = newName;
          }
          logChange(p, "Section renamed", before, newName);
          topic.topic = newName;
          saveData();
          showToast("Section renamed");
          renderProjectDashboard(p);
        } else if(!newName){
          nameEl.textContent = before; // don't allow blanking the name
        }
      });
      nameEl.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); nameEl.blur(); } });
    });
    // delete a Project Readiness Tracker section — only rendered when
    // logged in (see renderTopicSections), so no extra withAuth needed
    // here, but the click still shouldn't bubble up into the card's own
    // open-detail button.
    app.querySelectorAll('[data-del-topic-idx]').forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        const idx = parseInt(btn.dataset.delTopicIdx,10);
        const topic = p.topics[idx];
        if(!topic) return;
        if(!confirm(`Delete the "${topic.topic}" section from the Project Readiness Tracker? This cannot be undone.`)) return;
        // Track the deletion by stable key (not the possibly-renamed display
        // label) so the self-healing seed resync, which normally re-adds any
        // canonical topic that's missing, knows to leave this one out
        // permanently, even after a refresh or a prior rename.
        if(!p.deletedTopics) p.deletedTopics = [];
        const dKey = topic.key || topic.topic;
        if(!topic.custom && !p.deletedTopics.includes(dKey)){
          p.deletedTopics.push(dKey);
        }
        logChange(p, "Topic deleted", topic.topic, "(removed)");
        p.topics.splice(idx,1);
        saveData();
        renderProjectDashboard(p);
        showToast("Section deleted");
      });
    });
    const addTopicBtn = app.querySelector("[data-add-topic]");
    if(addTopicBtn){
      addTopicBtn.addEventListener("click", ()=> withAuth(()=>{
        p.topics.push({group:"D", topic:"New topic", key:"New topic", plan:"TBD", actual:"", status:"Y", remarks:"", custom:true});
        logChange(p, "Topic added", "—", "New topic");
        saveData();
        renderProjectDashboard(p);
      }));
    }

    // editable lists (achievements / upcoming / support)
    app.querySelectorAll('[data-list-field]').forEach(el=>{
      const before = el.textContent.trim();
      el.addEventListener("blur", ()=>{
        const key = el.dataset.listField;
        const idx = parseInt(el.dataset.idx,10);
        const newVal = el.textContent.trim();
        if(newVal !== before){
          logChange(p, key + " item", before, newVal);
          p[key][idx] = newVal;
          saveData();
        }
      });
      el.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); el.blur(); } });
    });
    app.querySelectorAll('.list-panel li.locked').forEach(li=>{
      li.addEventListener("click", ()=>{
        showLoginModal(()=> renderProjectDashboard(p));
      });
    });
    app.querySelectorAll('[data-list-del]').forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const key = btn.dataset.listDel;
        const idx = parseInt(btn.dataset.idx,10);
        logChange(p, key + " item removed", p[key][idx], "(removed)");
        p[key].splice(idx,1);
        saveData();
        renderProjectDashboard(p);
      });
    });
    app.querySelectorAll('[data-add-list]').forEach(btn=>{
      btn.addEventListener("click", ()=> withAuth(()=>{
        const key = btn.dataset.addList;
        p[key].push("New item — click to edit");
        logChange(p, key + " item added", "—", "New item — click to edit");
        saveData();
        renderProjectDashboard(p);
      }));
    });

    const addExtraBtn = app.querySelector("[data-add-extra]");
    if(addExtraBtn){
      addExtraBtn.addEventListener("click", ()=> withAuth(()=>{
        p.extra = { heading: "Notes", bullets: ["New note"] };
        saveData();
        renderProjectDashboard(p);
      }));
    }
  }

  // ---------------- reset control (hidden, accessible via keyboard shortcut) ----------------
  window.addEventListener("keydown", (e)=>{
    if(e.altKey && e.shiftKey && e.key.toLowerCase()==="r"){
      if(confirm("Reset all dashboard data to the original factory seed? This will erase any edits made on this device.")){
        resetToFactory();
      }
    }
  });

  // ---------------- init ----------------
  state = parseHash();
  refreshControlPanelBtn();
  render();

  // ---------------- server hydration ----------------
  // Boot renders instantly from local cache/seed (above); then we sync with
  // the server: (1) restore the real login session, (2) pull the authoritative
  // shared state. Both are wrapped so that opening the file without a backend
  // (file://) still works purely on localStorage — nothing here can break the
  // dashboard if the server is absent.
  (async function serverHydrate(){
    try{
      const s = await fetch("/api/session").then(r=>r.json());
      SERVER_LOGGED_IN = !!(s && s.logged_in);
      if(s && s.operator) SERVER_OPERATOR = s.operator;
    }catch(e){ /* no backend -> stay logged out */ }

    try{
      const res = await fetch("/api/npi_state");
      if(res.ok){
        const body = await res.json();
        if(body && body.success && body.state){
          // Feed the server copy through the SAME self-healing merge that
          // loadData() uses, so schema back-fills behave identically.
          try{ localStorage.setItem(STORE_KEY, JSON.stringify(body.state)); }catch(e){}
          DATA = loadData();
        }
      }
    }catch(e){ /* no backend -> keep local DATA */ }

    refreshControlPanelBtn();
    render();
  })();

})();

</script>
<script>
/* ============================================================
   MISSION CONTROL MOTION ENGINE
   Purely presentational: cursor spotlight on glass surfaces,
   ring draw-in sweeps, and numeric count-ups. Never touches
   app state, data, or render logic; every hook is wrapped so
   a failure here can never break the dashboard.
   ============================================================ */
(function(){
  "use strict";

  var reduceMotion = false;
  try{
    reduceMotion = typeof window.matchMedia === "function" &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }catch(e){ reduceMotion = false; }

  /* ---- 1. cursor spotlight: feed --mx/--my to the hovered glass card ---- */
  var SPOT_SEL = ".panel, .chart-panel, .landing-chart-panel, .landing-bottom-panel, " +
    ".compact-panel, .topic-detail-panel, .budget-panel, .list-panel, .history-panel, " +
    ".project-matrix-panel, .spend-by-project-panel, .topic-tracker-panel, .extra-panel, " +
    ".class-card, .choice-card, .project-row, .topic-section";
  var spotPending = false, spotEvent = null;
  document.addEventListener("pointermove", function(e){
    if(reduceMotion) return;
    spotEvent = e;
    if(spotPending) return;
    spotPending = true;
    requestAnimationFrame(function(){
      spotPending = false;
      try{
        var t = spotEvent.target;
        if(!t || typeof t.closest !== "function") return;
        var card = t.closest(SPOT_SEL);
        if(!card) return;
        var r = card.getBoundingClientRect();
        card.style.setProperty("--mx", (spotEvent.clientX - r.left) + "px");
        card.style.setProperty("--my", (spotEvent.clientY - r.top) + "px");
      }catch(err){}
    });
  }, { passive:true });

  /* ---- 2. ring draw-in: sweep each completion ring from 0 to its value ---- */
  function sweepRings(root){
    var rings;
    try{ rings = root.querySelectorAll(".pct-ring-fg:not([data-swept])"); }
    catch(e){ return; }
    for(var i = 0; i < rings.length; i++){
      (function(el){
        el.setAttribute("data-swept", "1");
        if(reduceMotion) return;
        var target = el.getAttribute("stroke-dasharray");
        if(!target) return;
        var parts = target.trim().split(/[\s,]+/);
        var circ = parts[1] || "97.4";
        el.style.transition = "none";
        el.setAttribute("stroke-dasharray", "0 " + circ);
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            el.style.transition = "";
            el.setAttribute("stroke-dasharray", target);
          });
        });
      })(rings[i]);
    }
  }

  /* ---- 3. count-up: percentage labels tick from 0 to their value ---- */
  function countUps(root){
    var nodes;
    try{
      nodes = root.querySelectorAll(
        ".pct-ring-label:not([data-counted]), .pie-center-num:not([data-counted]), .meta-pct-val:not([data-counted])"
      );
    }catch(e){ return; }
    for(var i = 0; i < nodes.length; i++){
      (function(el){
        el.setAttribute("data-counted", "1");
        if(reduceMotion) return;
        var text = (el.textContent || "").trim();
        var m = /^(\d{1,4})(%?)$/.exec(text);
        if(!m) return;
        var end = parseInt(m[1], 10), suffix = m[2] || "";
        if(!isFinite(end) || end <= 0) return;
        var textNode = el.firstChild;
        if(!textNode || textNode.nodeType !== 3) return;
        var dur = 750, start = null;
        function tick(ts){
          if(start === null) start = ts;
          var p = Math.min(1, (ts - start) / dur);
          var eased = 1 - Math.pow(1 - p, 3); /* easeOutCubic */
          textNode.nodeValue = Math.round(end * eased) + suffix;
          if(p < 1) requestAnimationFrame(tick);
        }
        textNode.nodeValue = "0" + suffix;
        requestAnimationFrame(tick);
      })(nodes[i]);
    }
  }

  /* ---- 4. run on load + after every re-render of #app ---- */
  function enhance(){
    try{
      var app = document.getElementById("app") || document.body;
      sweepRings(app);
      countUps(app);
    }catch(e){}
  }

  try{
    var app = document.getElementById("app");
    if(app && typeof MutationObserver === "function"){
      var queued = false;
      var mo = new MutationObserver(function(){
        if(queued) return;
        queued = true;
        requestAnimationFrame(function(){
          queued = false;
          enhance();
        });
      });
      mo.observe(app, { childList:true, subtree:true });
    }
  }catch(e){}

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", enhance);
  }else{
    enhance();
  }
})();
</script>

<script>
/* ============================================================
   FX ENGINE — simulation layer
   Hand-rolled, zero dependencies:
     · WebGL fragment-shader nebula + starfield with mouse
       parallax (falls back to the CSS aurora if WebGL is
       unavailable)
     · 3D pointer tilt on interactive cards
     · Button ripples
     · Scroll progress beam
     · Once-per-session boot sequence
     · Text decode / scramble on screen titles
   Purely presentational, fully guarded — a failure anywhere
   in here can never break the dashboard.
   ============================================================ */
(function(){
  "use strict";

  var reduceMotion = false;
  try{
    reduceMotion = typeof window.matchMedia === "function" &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }catch(e){}

  /* ================= 1. WebGL nebula ================= */
  function initNebula(){
    if(reduceMotion) return;
    var canvas = document.createElement("canvas");
    canvas.id = "fxCanvas";
    canvas.setAttribute("aria-hidden", "true");
    document.body.insertBefore(canvas, document.body.firstChild);

    var gl = null;
    try{
      gl = canvas.getContext("webgl", { alpha:true, antialias:false, depth:false, stencil:false, powerPreference:"low-power" }) ||
           canvas.getContext("experimental-webgl");
    }catch(e){}
    if(!gl){ canvas.remove(); return; }

    var VERT = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
    var FRAG = [
      "precision mediump float;",
      "uniform float uT;",
      "uniform vec2 uR;",
      "uniform vec2 uM;",
      "float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }",
      "float noise(vec2 p){",
      "  vec2 i=floor(p), f=fract(p);",
      "  vec2 u=f*f*(3.0-2.0*f);",
      "  return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),",
      "             mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x), u.y);",
      "}",
      "float fbm(vec2 p){",
      "  float v=0.0, a=0.5;",
      "  for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.03; a*=0.5; }",
      "  return v;",
      "}",
      "void main(){",
      "  vec2 uv = gl_FragCoord.xy / uR;",
      "  vec2 asp = vec2(uR.x/uR.y, 1.0);",
      "  vec2 q = (uv - 0.5) * asp;",
      "  vec2 par = (uM - 0.5) * 0.08;",
      "  float t = uT * 0.035;",
      /* base void gradient */
      "  vec3 col = mix(vec3(1.0,1.0,1.0), vec3(0.985,0.985,0.982), uv.y);",
      /* flowing aurora ribbons */
      "  float n1 = fbm(q*1.6 + par + vec2(t*0.9,  t*0.4));",
      "  float n2 = fbm(q*2.2 - par + vec2(-t*0.6, t*0.8) + 5.2);",
      "  float n3 = fbm(q*1.1 + par*0.5 + vec2(t*0.3, -t*0.5) + 9.7);",
      "  float rib1 = smoothstep(0.45, 0.85, n1) * smoothstep(1.0, 0.55, n1);",
      "  float rib2 = smoothstep(0.5, 0.9, n2) * smoothstep(1.0, 0.6, n2);",
      "  float rib3 = smoothstep(0.55, 0.95, n3);",
      "  col += vec3(-0.06, -0.015, -0.01) * rib1 * 0.18;",   /* cyan */
      "  col += vec3(-0.02, -0.03, -0.05) * rib2 * 0.12;",   /* violet */
      "  col += vec3(-0.02, -0.02, -0.02) * rib3 * 0.06;",  /* faint amber */
      /* starfield: two layers, twinkling */
      "  vec2 sp1 = uv * uR / 3.0;",
      "  float s1 = hash(floor(sp1));",
      "  float star1 = step(0.9975, s1) * (0.55 + 0.45*sin(uT*1.7 + s1*80.0));",
      "  vec2 sp2 = uv * uR / 5.0 + 31.0;",
      "  float s2 = hash(floor(sp2));",
      "  float star2 = step(0.9985, s2) * (0.4 + 0.6*sin(uT*1.1 + s2*60.0));",
      "  col += vec3(-0.12, -0.09, -0.03) * (star1*0.35 + star2*0.5);",
      /* vignette */
      "  float vig = 1.0 - dot(q,q) * 0.55;",
      "  col *= clamp(vig, 0.55, 1.0);",
      "  gl_FragColor = vec4(col, 1.0);",
      "}"
    ].join("\n");

    function shader(type, src){
      var s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
      return s;
    }
    var vs = shader(gl.VERTEX_SHADER, VERT);
    var fs = shader(gl.FRAGMENT_SHADER, FRAG);
    if(!vs || !fs){ canvas.remove(); return; }
    var prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ canvas.remove(); return; }
    gl.useProgram(prog);

    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    var uT = gl.getUniformLocation(prog, "uT");
    var uR = gl.getUniformLocation(prog, "uR");
    var uM = gl.getUniformLocation(prog, "uM");

    var SCALE = 0.5; /* render at half res — nebula is soft anyway */
    function resize(){
      var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      var w = Math.max(2, Math.floor(window.innerWidth  * dpr * SCALE));
      var h = Math.max(2, Math.floor(window.innerHeight * dpr * SCALE));
      if(canvas.width !== w || canvas.height !== h){
        canvas.width = w; canvas.height = h;
        gl.viewport(0, 0, w, h);
      }
    }
    resize();
    var rszT = null;
    window.addEventListener("resize", function(){
      clearTimeout(rszT); rszT = setTimeout(resize, 150);
    });

    var mx = 0.5, my = 0.5, tmx = 0.5, tmy = 0.5;
    document.addEventListener("pointermove", function(e){
      tmx = e.clientX / Math.max(1, window.innerWidth);
      tmy = 1 - e.clientY / Math.max(1, window.innerHeight);
    }, { passive:true });

    var start = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    var last = 0, FRAME = 1000/40; /* cap ~40fps */
    function loop(now){
      requestAnimationFrame(loop);
      if(document.hidden) return;
      if(now - last < FRAME) return;
      last = now;
      mx += (tmx - mx) * 0.04;
      my += (tmy - my) * 0.04;
      gl.uniform1f(uT, (now - start) / 1000);
      gl.uniform2f(uR, canvas.width, canvas.height);
      gl.uniform2f(uM, mx, my);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(loop);
    document.documentElement.classList.add("has-webgl");
  }
  try{ initNebula(); }catch(e){}

  /* ================= 2. 3D card tilt ================= */
  var TILT_SEL = ".class-card, .choice-card, .project-row";
  var MAX_TILT = 3.5; /* degrees */
  var tiltCard = null, tiltPending = false, tiltEvt = null;
  function clearTilt(el){
    if(!el) return;
    el.style.setProperty("--tiltx", "0deg");
    el.style.setProperty("--tilty", "0deg");
  }
  document.addEventListener("pointermove", function(e){
    if(reduceMotion) return;
    tiltEvt = e;
    if(tiltPending) return;
    tiltPending = true;
    requestAnimationFrame(function(){
      tiltPending = false;
      try{
        var t = tiltEvt.target;
        var card = (t && typeof t.closest === "function") ? t.closest(TILT_SEL) : null;
        if(card !== tiltCard){ clearTilt(tiltCard); tiltCard = card; }
        if(!card) return;
        var r = card.getBoundingClientRect();
        if(r.width < 2 || r.height < 2) return;
        var px = (tiltEvt.clientX - r.left) / r.width  - 0.5;
        var py = (tiltEvt.clientY - r.top)  / r.height - 0.5;
        card.style.setProperty("--tilty", ( px * MAX_TILT * 2).toFixed(2) + "deg");
        card.style.setProperty("--tiltx", (-py * MAX_TILT * 2).toFixed(2) + "deg");
      }catch(err){}
    });
  }, { passive:true });
  document.addEventListener("pointerleave", function(){ clearTilt(tiltCard); tiltCard = null; });

  /* ================= 3. button ripple ================= */
  var RIPPLE_SEL = ".btn-primary, .btn-ghost, .btn-danger, .header-line-btn, " +
    ".header-back-btn, .header-ctrl-btn, .support-submit-btn, .add-row-btn, .cp-add-proj-btn";
  document.addEventListener("pointerdown", function(e){
    if(reduceMotion) return;
    try{
      var t = e.target;
      var btn = (t && typeof t.closest === "function") ? t.closest(RIPPLE_SEL) : null;
      if(!btn) return;
      var r = btn.getBoundingClientRect();
      var d = Math.max(r.width, r.height) * 2;
      var span = document.createElement("span");
      span.className = "fx-ripple";
      span.style.width = span.style.height = d + "px";
      span.style.left = (e.clientX - r.left - d/2) + "px";
      span.style.top  = (e.clientY - r.top  - d/2) + "px";
      btn.appendChild(span);
      span.addEventListener("animationend", function(){ span.remove(); });
      setTimeout(function(){ if(span.parentNode) span.remove(); }, 800);
    }catch(err){}
  }, { passive:true });

  /* ================= 4. scroll progress beam ================= */
  try{
    var beam = document.createElement("div");
    beam.id = "scrollBeam";
    beam.setAttribute("aria-hidden", "true");
    document.body.appendChild(beam);
    var beamPending = false;
    function updateBeam(){
      beamPending = false;
      var doc = document.documentElement;
      var max = doc.scrollHeight - doc.clientHeight;
      var p = max > 0 ? (doc.scrollTop || document.body.scrollTop || 0) / max : 0;
      beam.style.width = (p * 100).toFixed(2) + "%";
    }
    window.addEventListener("scroll", function(){
      if(beamPending) return;
      beamPending = true;
      requestAnimationFrame(updateBeam);
    }, { passive:true });
    updateBeam();
  }catch(e){}

  /* ================= 5. boot sequence (once per session) ================= */
  function boot(){
    if(reduceMotion) return;
    var seen = false;
    try{ seen = sessionStorage.getItem("npi_boot_v1") === "1"; }catch(e){}
    if(seen) return;
    try{ sessionStorage.setItem("npi_boot_v1", "1"); }catch(e){}
    try{
      var ov = document.createElement("div");
      ov.id = "bootOverlay";
      ov.innerHTML =
        '<div class="boot-logo">ME NPI Dashboard</div>' +
        '<div class="boot-bar"><i></i></div>' +
        '<div class="boot-line"></div>';
      document.body.appendChild(ov);
      var bar = ov.querySelector(".boot-bar i");
      var line = ov.querySelector(".boot-line");
      var steps = [
        [10,  "loading project registry"],
        [34,  "syncing milestone gantt"],
        [58,  "calibrating budget gauges"],
        [82,  "linking facility trackers"],
        [100, "telemetry online"]
      ];
      var i = 0, killed = false;
      function finish(){
        if(killed) return;
        killed = true;
        ov.classList.add("done");
        setTimeout(function(){ ov.remove(); }, 550);
      }
      function step(){
        if(killed) return;
        if(i >= steps.length){ setTimeout(finish, 260); return; }
        bar.style.width = steps[i][0] + "%";
        line.textContent = steps[i][1];
        i++;
        setTimeout(step, 240);
      }
      ov.addEventListener("click", finish);
      setTimeout(step, 60);
      setTimeout(finish, 3000); /* hard cap — never trap the user */
    }catch(e){}
  }
  boot();

  /* ================= 6. text decode / scramble ================= */
  var DECODE_SEL = ".dash-title:not([data-decoded]), .section-title:not([data-decoded]), " +
                   ".landing-title:not([data-decoded]), .panel-title:not([data-decoded])";
  var GLYPHS = "!<>-_/[]{}=+*^?#";
  function decode(el){
    el.setAttribute("data-decoded", "1");
    if(reduceMotion) return;
    var node = el.firstChild;
    if(!node || node.nodeType !== 3) return;           /* single text node only */
    if(el.childNodes.length !== 1) return;
    var target = node.nodeValue || "";
    if(!target.trim() || target.length > 48) return;
    var frames = 14, f = 0;
    function tick(){
      f++;
      var reveal = Math.floor((f / frames) * target.length);
      var out = "";
      for(var i = 0; i < target.length; i++){
        var ch = target.charAt(i);
        if(i < reveal || ch === " "){ out += ch; }
        else{ out += GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length)); }
      }
      node.nodeValue = out;
      if(f < frames){ requestAnimationFrame(tick); }
      else{ node.nodeValue = target; }
    }
    requestAnimationFrame(tick);
  }
  function decodeAll(){
    try{
      var els = document.querySelectorAll(DECODE_SEL);
      for(var i = 0; i < els.length && i < 8; i++) decode(els[i]);
      /* mark any overflow so they don't scramble later mid-view */
      for(var j = 8; j < els.length; j++) els[j].setAttribute("data-decoded", "1");
    }catch(e){}
  }
  try{
    var app = document.getElementById("app");
    if(app && typeof MutationObserver === "function"){
      var queued = false;
      new MutationObserver(function(){
        if(queued) return;
        queued = true;
        requestAnimationFrame(function(){ queued = false; decodeAll(); });
      }).observe(app, { childList:true, subtree:true });
    }
  }catch(e){}
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", decodeAll);
  }else{
    decodeAll();
  }
})();
</script>
